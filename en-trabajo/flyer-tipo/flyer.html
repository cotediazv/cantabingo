<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Flyer tipo, versión 2: igual a las pantallas de la Sala (diseño nuevo, html.t2): fondo con focos, recuadros
   «tarima» con la línea de color arriba y la esquina cortada, franja de título con línea, etiquetas en mono
   y la franja de logos abajo. */
:root{--noche:#0c0b12;--tarima:#15131e;--tarima2:#1c1828;--linea:#2a2636;--texto:#f3eee6;--tenue:#a59fb0;--foco:#f4bf5a;--tinta:#1a1407;--c:#47b8e6;--onc:#06131a;
  --disp:"Big Shoulders Display",Impact,sans-serif;--mono:"JetBrains Mono",monospace;--corte:34px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:var(--H);overflow:hidden;color:var(--texto);font-family:Manrope,sans-serif;background:var(--noche)}
.fondo{position:absolute;inset:-10%;background:radial-gradient(circle at 26% 20%,color-mix(in srgb,var(--c) 46%,transparent) 0,transparent 42%),radial-gradient(circle at 78% 84%,rgba(244,191,90,.24) 0,transparent 40%),linear-gradient(160deg,#15131e,#0c0b12 55%,#07060c)}
canvas{position:absolute;inset:0}
.caja{position:absolute;inset:0;display:flex;flex-direction:column;padding:var(--pad) 60px calc(var(--pad) * .55)}
/* franja de título, como «EL BINGO DE…» de las pantallas */
.tit{display:flex;align-items:center;gap:22px}
.tit h2{font-family:var(--disp);font-weight:800;font-size:58px;text-transform:uppercase;letter-spacing:.01em;line-height:1;white-space:nowrap}
.tit h2 b{color:var(--foco)}
.tit i{flex:1;height:3px;background:linear-gradient(90deg,var(--foco),color-mix(in srgb,var(--foco) 10%,transparent))}
.tag{display:inline-block;background:var(--c);color:var(--onc);font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.2em;text-transform:uppercase;padding:9px 26px 8px 18px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);white-space:nowrap}
.tag.oro{background:var(--foco);color:var(--tinta)}
/* recuadro «tarima» con la foto */
.panel{position:relative;background:var(--tarima);border-top:6px solid var(--c);clip-path:polygon(0 0,100% 0,100% calc(100% - var(--corte)),calc(100% - var(--corte)) 100%,0 100%)}
.foto{margin-top:var(--g1);height:var(--fh);overflow:hidden}
.foto img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.alta .foto{clip-path:polygon(12% 0,88% 0,100% 14%,100% calc(100% - var(--corte)),calc(100% - var(--corte)) 100%,12% 100%,0 86%,0 14%)}
.alta .foto .tag{display:none}
.alta .foto img{object-position:50% 0}
.foto .tag{position:absolute;left:0;top:0}
.foto::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(180deg,transparent,rgba(12,11,18,.7))}
/* nombre del show */
.show{margin-top:var(--g2);padding:30px 40px 30px;border-top-color:var(--foco)}
.show .antes{font-family:var(--mono);font-weight:500;font-size:28px;letter-spacing:.3em;text-transform:uppercase;color:var(--tenue)}
.show h1{margin-top:4px;font-family:var(--disp);font-weight:900;text-transform:uppercase;line-height:.84;font-size:var(--fs);white-space:nowrap;color:var(--texto)}
.show .fila{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.show .mas{font-family:var(--disp);font-weight:800;font-size:56px;text-transform:uppercase;letter-spacing:.06em;color:var(--foco);line-height:1}
/* horario, como la franja del GC */
.horas{margin-top:var(--g3);display:flex;background:var(--tarima);border-top:3px solid var(--linea);clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%)}
.horas div{flex:1;padding:16px 18px 14px;border-left:2px solid var(--linea)}
.horas div:first-child{border-left:0}
.horas small{display:block;font-family:var(--mono);font-weight:500;font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:var(--tenue);line-height:1.3}
.horas strong{display:block;font-family:var(--disp);font-weight:800;font-size:54px;line-height:1}
.horas div.sh{background:color-mix(in srgb,var(--foco) 14%,var(--tarima))}
.horas div.sh strong{color:var(--foco)}
.lugar{margin-top:var(--g4);font-family:var(--mono);font-size:24px;letter-spacing:.12em;text-transform:uppercase;color:var(--texto);text-align:center}
.lugar span{color:var(--c)}
/* franja de logos, como abajo en los tableros */
.pie{margin-top:auto;display:flex;align-items:stretch;justify-content:center;gap:34px}
.pie .col{display:flex;flex-direction:column;align-items:center;gap:12px}
.pie .logo{height:var(--lh);display:flex;align-items:center;justify-content:center}
.pie .col span{display:block;font-family:var(--mono);letter-spacing:.02em;color:var(--texto);white-space:nowrap;line-height:1}
.pie img{display:block;height:auto}.pie .krb{width:var(--lw1)}.pie .loc{width:var(--lw2)}
.pie i{width:2px;align-self:center;height:96px;background:rgba(243,238,230,.4)}
.pie b{font-family:var(--disp);font-weight:800;font-size:46px;text-transform:uppercase}
.redes{margin-top:14px;text-align:center;font-family:var(--mono);font-size:22px;letter-spacing:.1em;color:var(--tenue)}
.redes b{color:var(--texto);font-weight:500}
.alta .show .fila{flex-direction:column;align-items:flex-start;margin-top:4px;gap:16px}
/* publicación (1080x1350): la foto entera como en la historia, y el nombre con «+ Karaoke» en la misma fila */
.baja .foto{clip-path:polygon(11% 0,89% 0,100% 17%,100% calc(100% - var(--corte)),calc(100% - var(--corte)) 100%,11% 100%,0 83%,0 17%)}
.baja .foto img{object-position:50% 0}
.baja .foto .tag{display:none}
.baja .show{padding:22px 36px 24px}
.baja .show .fila{margin-top:0;align-items:flex-end;gap:24px}
.baja .show h1{margin-top:2px}
.baja .show .mas{font-size:50px;padding-bottom:10px;white-space:nowrap}
.baja .redes{margin-top:8px}
</style></head><body>
<div class="fondo"></div><canvas id="red"></canvas>
<div class="caja">
  <div class="tit"><h2 id="fecha"></h2><i></i><span class="tag" id="local"></span></div>
  <div class="panel foto"><img id="foto" alt=""><span class="tag oro" id="tipo"></span></div>
  <div class="panel show">
    <div class="antes" id="antes"></div>
    <div class="fila"><h1 id="titulo"></h1><span class="mas" id="mas"></span></div>
  </div>
  <div class="horas" id="horas"></div>
  <div class="lugar" id="lugar"></div>
  <div class="pie" id="pie"></div>
  <div class="redes" id="redes"></div>
</div>
<script>
const Q=new URLSearchParams(location.search);
const LOC={kennedy:{c:'#47b8e6',onc:'#06131a',n:'Mercado Kennedy',logo:'logo-kennedy.png',h:'48px',ig:'@krbstage',igLoc:'@mercadokennedy_'},
  frida:{c:'#e0338f',onc:'#fff',n:'Frida Kahlo',logo:'logo-frida.png',h:'72px',ig:'@krbstage4'},
  tobalaba:{c:'#e5413a',onc:'#fff',n:'Tobalaba',logo:'',h:'0',ig:'@krbstage3'}};
const L=LOC[Q.get('l')||'kennedy'];
const story=Q.get('f')==='historia';const H=story?1920:1350;
const set=(k,v)=>document.documentElement.style.setProperty(k,v);
set('--H',H+'px');document.body.classList.add(story?'alta':'baja');set('--c',L.c);set('--onc',L.onc);set('--logoh',L.h);
set('--pad',story?'150px':'86px');set('--g1',story?'44px':'30px');set('--g2',story?'34px':'22px');set('--g3',story?'34px':'22px');set('--g4',story?'40px':'20px');
set('--fh',story?'760px':'520px');
document.getElementById('fecha').innerHTML=Q.get('fecha')||'';
document.getElementById('local').textContent=L.n;
document.getElementById('tipo').textContent=Q.get('tipo')||'';
document.getElementById('foto').src=(story&&Q.get('fotoH'))||Q.get('foto')||'';
document.getElementById('antes').textContent=Q.get('antes')||'';
document.getElementById('titulo').textContent=Q.get('titulo')||'';
const mas=Q.get('mas');document.getElementById('mas').textContent=mas||'';
const fsBase=story?236:176;set('--fs',fsBase+'px');
const horas=(Q.get('horas')||'').split(';').filter(Boolean).map(x=>x.split('='));
document.getElementById('horas').innerHTML=horas.map(([t,k])=>`<div class="${/^show/i.test(k)?'sh':''}"><small>${k}</small><strong>${t}</strong></div>`).join('');
document.getElementById('lugar').innerHTML=Q.get('lugar')||'';
document.getElementById('pie').innerHTML=`<div class="col"><div class="logo"><img class="krb" src="krb-stage.svg" alt=""></div><span>${L.ig}</span></div><i></i><div class="col"><div class="logo">${L.logo?`<img class="loc" src="${L.logo}" alt="">`:`<b>${L.n}</b>`}</div>${L.igLoc?`<span>${L.igLoc}</span>`:''}</div>`;
document.getElementById('redes').style.display='none';
set('--lw1',story?'150px':'136px');set('--lw2',story?'270px':'246px');set('--lh',story?'96px':'86px');
// cada Instagram mide lo mismo que el ancho de su logo
document.fonts.ready.then(()=>document.querySelectorAll('.pie .col span').forEach(sp=>{const w=sp.parentElement.querySelector('img').getBoundingClientRect().width;let f=40;sp.style.fontSize=f+'px';f=f*w/sp.getBoundingClientRect().width;sp.style.fontSize=f+'px'}));
// el título nunca se corta: si no cabe a lo ancho, se achica
document.fonts.ready.then(()=>{const h=document.getElementById('titulo');const m=document.getElementById('mas');const w=document.querySelector('.show').clientWidth-72-(story?0:m.offsetWidth+24);let fs=fsBase;while(h.scrollWidth>w&&fs>90){fs-=4;h.style.fontSize=fs+'px'}});
// neuronas, como en el fondo de las pantallas (solo en los bordes, nunca sobre los textos)
const cv=document.getElementById('red'),x=cv.getContext('2d');cv.width=1080;cv.height=H;let sd=7;const r=()=>{sd=(sd*16807)%2147483647;return sd/2147483647};
const col=[L.c,'#f4bf5a','#ffffff'];const pts=[];for(let i=0;i<40;i++){const lado=r()<.5;pts.push({x:lado?r()*60:1020+r()*60,y:r()*H,c:col[Math.floor(r()*3)]})}
x.lineWidth=1.2;for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const p=pts[i],q=pts[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d>170)continue;x.globalAlpha=(1-d/170)*.35;x.strokeStyle='#fff';x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}
for(const p of pts){x.globalAlpha=.85;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,3,0,7);x.fill()}
</script></body></html>
