<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control KRB · liviano</title>
<!-- Centro de control liviano (pedido de Cote, 21 nov): para el iPad viejo (iOS 9.3.5). Todas las funciones de los
     juegos: sala, sorteo de juegos, bingo, El Rosco, El Festival, El objeto más extraño, karaoke y En pantalla.
     Escrito en JavaScript antiguo (sin funciones flecha, let/const, fetch, plantillas, includes ni NodeList.forEach)
     y CSS sin grid, para que funcione en navegadores de 2016. Enlace corto: cantabingo.onrender.com/cc -->
<style>
  body { margin: 0; padding: 12px; background: #14112a; color: #fff; font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 18px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 19px; margin: 0 0 10px; color: #ffc400; }
  .box { background: #221d44; border: 1px solid #5a54a0; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .muted { color: #b9b4dc; font-size: 15px; }
  input, select { width: 100%; box-sizing: border-box; font-size: 18px; padding: 10px; margin: 6px 0 10px; border-radius: 8px; border: 1px solid #5a54a0; background: #14112a; color: #fff; }
  button { font-size: 18px; font-weight: bold; color: #fff; background: #3a3470; border: 2px solid #5a54a0; border-radius: 12px; padding: 13px 8px; margin: 4px 0; cursor: pointer; -webkit-appearance: none; }
  button[disabled] { opacity: .35; }
  .big { display: block; width: 100%; background: #6c5ce7; border-color: #6c5ce7; font-size: 21px; padding: 16px 8px; }
  .ok { background: #1f9d55; border-color: #3fe08f; }
  .bad { background: #b3262e; border-color: #ff6b6b; }
  .warn { background: #b07a00; border-color: #ffc400; }
  .half { float: left; width: 48%; margin: 4px 1%; box-sizing: border-box; min-height: 58px; }
  .row { overflow: hidden; }
  .tabs { overflow: hidden; margin: 10px 0 12px; }
  .tabs button { float: left; width: 23%; margin: 3px 1%; box-sizing: border-box; font-size: 15px; padding: 10px 2px; }
  .tabs button.on, .on { background: #1f9d55; border-color: #3fe08f; }
  .top { overflow: hidden; }
  .top h1 { float: left; padding-top: 6px; }
  .top button { float: right; font-size: 14px; padding: 6px 12px; margin: 0; }
  .ball { display: inline-block; width: 120px; height: 120px; line-height: 120px; border-radius: 50%; background: #ffc400; color: #1a1a1a; font-size: 40px; font-weight: bold; text-align: center; }
  .chips span { display: inline-block; padding: 3px 9px; margin: 2px; border-radius: 99px; border: 1px solid #5a54a0; font-size: 15px; }
  .now { padding: 10px 12px; border: 2px solid #ffc400; border-radius: 12px; margin: 8px 0; }
  .now small { color: #ffc400; font-weight: bold; display: block; }
  .now b { font-size: 22px; }
  .q { background: #14112a; border-radius: 10px; padding: 10px; margin: 8px 0; font-size: 19px; }
  .a { color: #3fe08f; font-weight: bold; margin-top: 6px; }
  .item { padding: 8px 0; border-bottom: 1px solid #3a3470; overflow: hidden; }
  .item button { float: right; font-size: 15px; padding: 6px 10px; margin: 0 0 0 6px; }
  .box > button, .box > p > button { display: block; width: 100%; }
  #msg { position: fixed; left: 10px; right: 10px; bottom: 10px; background: #000; color: #ffc400; padding: 10px; border-radius: 10px; font-size: 16px; display: none; text-align: center; }
</style>
</head>
<body>
<div class="top"><h1>Control KRB</h1><button type="button" onclick="location.reload()">↻ Refrescar</button></div>
<div id="login" class="box" style="display:none;margin-top:12px">
  <p class="muted">Entra con tu usuario y clave de moderador.</p>
  <input id="user" type="text" placeholder="Usuario" autocapitalize="off" autocorrect="off">
  <input id="pass" type="password" placeholder="Clave">
  <button type="button" class="big" data-a="entrar">Entrar</button>
</div>
<div id="panel" style="display:none">
  <div class="tabs" id="tabs">
    <button type="button" data-tab="sala">🏠 Sala</button><button type="button" data-tab="juegos">🎲 Juegos</button>
    <button type="button" data-tab="bingo">🎱 Bingo</button><button type="button" data-tab="rosco">🎡 Rosco</button>
    <button type="button" data-tab="festival">🎤 Festival</button><button type="button" data-tab="objeto">🗳️ Objeto</button>
    <button type="button" data-tab="karaoke">🎶 Karaoke</button><button type="button" data-tab="pantalla">📺 Pantalla</button>
  </div>
  <div id="body"></div>
  <p class="muted" style="text-align:center;margin-top:20px"><a href="#" data-a="salir" style="color:#b9b4dc">Cerrar sesión</a></p>
</div>
<div id="msg"></div>
<script>
var token = '';
try { token = window.localStorage.getItem('adminToken') || ''; } catch (e) { token = ''; }
var tab = 'sala';
try { tab = window.localStorage.getItem('ccTab') || 'sala'; } catch (e) { tab = 'sala'; }
var S = { sala: null, bingo: null, draw: null, wheel: null, wheels: [], raffle: null, people: null, vote: null, kar: null, stage: '', projects: null, newRosco: false };
var offset = 0; // diferencia de reloj con el servidor
var VENUES = [['kennedy', 'Kennedy'], ['frida', 'Frida'], ['tobalaba', 'Tobalaba']];
var GAMES = { bingo: '🎱 Bingo', rosco: '🎡 El Rosco', festival: '🎤 El Festival', objeto: '🗳️ El objeto más extraño' };
var FIGS = [['linea', 'Línea (cualquiera)'], ['horizontal', 'Línea horizontal'], ['vertical', 'Línea vertical'], ['diagonal', 'Diagonal'], ['dos-lineas', 'Dos líneas'],
  ['esquinas', 'Cuatro esquinas'], ['sello', 'Sello'], ['cruz', 'Cruz'], ['marco', 'Marco'], ['cuadro', 'Cuadro central'], ['diamante', 'Diamante'], ['piramide', 'Pirámide'],
  ['piramide-inv', 'Pirámide invertida'], ['reloj', 'Reloj de arena'], ['corazon', 'Corazón'], ['estrella', 'Estrella'], ['lleno', 'Cartón lleno']];
(function () { var l = 'abcdefghijklmnopqrstuvwxyz'; for (var i = 0; i < l.length; i++) FIGS.push([l.charAt(i), 'Figura ' + l.charAt(i).toUpperCase()]); })();
var STAGES = [['bingo', '🎱 Bingo'], ['sorteo', '🎲 Sorteo'], ['rueda', '🎡 El Rosco'], ['qr', '📱 QR en pantalla'], ['karaoke', '🎤 Karaoke'], ['show', '⭐ Show'], ['voto', '🗳️ Votación'], ['insta', '📸 Instagram'], ['juego', '🎲 Sorteo de juegos'], ['none', '⬛ Nada']];

function $(id) { return document.getElementById(id); }
function h(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
var msgT = null;
function msg(t) { var m = $('msg'); m.innerHTML = h(t); m.style.display = t ? 'block' : 'none'; clearTimeout(msgT); if (t) msgT = setTimeout(function () { m.style.display = 'none'; }, 4000); }
function pedir(metodo, ruta, datos, listo) {
  var x = new XMLHttpRequest();
  x.open(metodo, ruta, true);
  x.setRequestHeader('Content-Type', 'application/json');
  if (token) x.setRequestHeader('x-admin', token);
  x.timeout = 30000;
  x.onreadystatechange = function () {
    if (x.readyState !== 4) return;
    var r = null;
    try { r = JSON.parse(x.responseText); } catch (e) { r = null; }
    if (x.status === 401 && ruta.indexOf('/api/login') < 0) { mostrarLogin(); return; }
    if (listo) listo(x.status >= 200 && x.status < 300 ? null : ((r && r.error) || 'Sin conexión, intenta de nuevo'), r);
  };
  x.ontimeout = function () { if (listo) listo('Sin conexión, intenta de nuevo', null); };
  x.send(datos ? JSON.stringify(datos) : null);
}
// Acción con aviso y relectura
function hacer(metodo, ruta, datos, texto) {
  msg('Guardando…');
  pedir(metodo, ruta, datos, function (err) { msg(err || texto || ''); leer(); });
}
function mostrarLogin() { $('login').style.display = 'block'; $('panel').style.display = 'none'; }
function mostrarPanel() { $('login').style.display = 'none'; $('panel').style.display = 'block'; leer(); }
function sala() { return S.sala && S.sala.length ? S.sala[0] : null; }
function btn(texto, a, extra, cls, off) { return '<button type="button" class="' + (cls || '') + '" data-a="' + a + '"' + (extra || '') + (off ? ' disabled' : '') + '>' + texto + '</button>'; }
function data(k, v) { return ' data-' + k + '="' + h(v) + '"'; }
function clock(ms) { ms = Math.max(0, ms); var s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
function ord(n) { return n + '.º lugar'; }

// ---------- Lectura: solo lo que necesita la pestaña abierta (el iPad es lento) ----------
var leyendo = 0;
function leer() {
  var b = $('tabs').getElementsByTagName('button');
  for (var i = 0; i < b.length; i++) b[i].className = b[i].getAttribute('data-tab') === tab ? 'on' : '';
  var faltan = 2; leyendo++;
  var mio = leyendo;
  var fin = function () { if (--faltan <= 0 && mio === leyendo) pintar(); };
  pedir('GET', '/api/current', null, function (err, r) { if (!err && r) S.sala = r.sessions; fin(); });
  pedir('GET', '/api/stage', null, function (err, r) { if (!err && r) S.stage = r.show; fin(); });
  var mas = function (ruta, clave) { faltan++; pedir('GET', ruta, null, function (err, r) { if (!err) { S[clave] = r; if (r && r.now) offset = r.now - new Date().getTime(); } fin(); }); };
  if (tab === 'sala') mas('/api/projects', 'projects');
  if (tab === 'juegos') mas('/api/gamedraw', 'draw');
  if (tab === 'bingo') { faltan++; pedir('GET', '/api/current', null, function (err, r) { var s = r && r.sessions && r.sessions[0]; if (!s) { S.bingo = null; fin(); return; } pedir('GET', '/api/sessions/' + s.id + '/host/state', null, function (e2, st) { S.bingo = e2 ? null : st; if (st && st.now) offset = st.now - new Date().getTime(); fin(); }); }); }
  if (tab === 'rosco') {
    faltan++;
    pedir('GET', '/api/wheels', null, function (err, list) {
      S.wheels = list || [];
      if (S.wheels.length && !S.newRosco) { pedir('GET', '/api/wheels/' + S.wheels[0].id, null, function (e2, w) { S.wheel = e2 ? null : w; if (w && w.now) offset = w.now - new Date().getTime(); fin(); }); }
      else { S.wheel = null; faltan++; pedir('GET', '/api/raffle', null, function (e3, r) { S.raffle = r; fin(); }); pedir('GET', '/api/people', null, function (e4, p) { S.people = p; fin(); }); }
    });
  }
  if (tab === 'festival' || tab === 'objeto') mas('/api/vote/host', 'vote');
  if (tab === 'karaoke') mas('/api/karaoke/cola', 'kar');
}

// ---------- Pintar ----------
var P = {};
function pintar() { $('body').innerHTML = (P[tab] || P.sala)(); }

P.sala = function () {
  var s = sala();
  if (s) return '<div class="box"><h2>Sala de juegos abierta</h2><div class="now"><b>' + h(s.name) + '</b><br><span class="muted">Ronda ' + s.round + '</span></div>' +
    btn('🗑 Cerrar la sala', 'cerrarSala', data('sid', s.id), 'bad') + '<p class="muted">Cerrar la sala termina la noche: se borran los participantes y los juegos.</p></div>';
  var h2 = '<div class="box"><h2>Crear sala de juegos</h2><p class="muted">Elige el local:</p><div class="row">';
  for (var i = 0; i < VENUES.length; i++) h2 += btn(VENUES[i][1], 'crearSala', data('v', VENUES[i][0]), 'half');
  return h2 + '</div></div>';
};

P.juegos = function () {
  var g = S.draw;
  if (!sala()) return '<div class="box">Primero crea la sala de juegos (pestaña Sala).</div>';
  if (!g) return '<div class="box">Cargando…</div>';
  var ready = g.ready && (!g.last || g.ready.at > g.last.at);
  var full = g.list.length >= g.total;
  var out = '<div class="box"><h2>Sorteo de juegos</h2>';
  if (!g.list.length && !ready) out += '<p>¿Cuántos juegos vamos a sortear? <b style="font-size:26px">' + g.total + '</b></p><div class="row">' + btn('− Uno menos', 'total', data('n', g.total - 1), 'half', g.total <= 1) + btn('+ Uno más', 'total', data('n', g.total + 1), 'half', g.total >= 10) + '</div>';
  out += '<div class="chips" style="margin:8px 0"><span>Inicial · Bingo</span>';
  for (var i = 0; i < g.total; i++) out += '<span>' + (i + 1) + '.º · ' + (g.list[i] ? GAMES[g.list[i]] : (ready && i === g.list.length ? '🎲 …' : '🔒')) + '</span>';
  out += '</div>';
  if (full) out += '<p class="muted">✔ Ya se sortearon los ' + g.total + ' juegos.</p>';
  else if (ready) {
    out += btn('🎰 Girar la tómbola · ' + (g.list.length + 1) + '.º juego', 'girar', '', 'big warn');
    out += '<p class="muted">…o elige un juego directo, sin tómbola:</p><div class="row">';
    for (var k in GAMES) if (GAMES.hasOwnProperty(k)) out += btn(GAMES[k], 'elegir', data('g', k), 'half');
    out += '</div>';
  } else out += btn('🎲 Iniciar sorteo del ' + (g.list.length + 1) + '.º juego (de ' + g.total + ')', 'iniciarSorteo', '', 'big');
  out += btn('↩️ Deshacer', 'deshacer', '', '', !g.undoable);
  if (g.last && !ready) out += '<p>Último juego: <b>' + GAMES[g.last.game] + '</b> → ve a su pestaña.</p>';
  return out + '</div>';
};

// Letra del número (B, I, N, G, O), igual que en el panel grande: cada letra tiene un quinto de los números
function letra(st, v) { var hs = String(st.headers || 'BINGO'); for (var c = 0; c < 5; c++) if (v <= Math.floor(((c + 1) * st.values) / 5)) return hs.charAt(c); return hs.charAt(4); }
function conLetra(st, v) { return st.format === 'numbers' ? letra(st, v) + ' ' + v : String(v); }
function figName(id) { for (var i = 0; i < FIGS.length; i++) if (FIGS[i][0] === id) return FIGS[i][1]; return id; }
function figSelect() { var o = '<select id="fig">'; for (var i = 0; i < FIGS.length; i++) o += '<option value="' + FIGS[i][0] + '">' + h(FIGS[i][1]) + '</option>'; return o + '</select>'; }
P.bingo = function () {
  var st = S.bingo;
  if (!sala()) return '<div class="box">Primero crea la sala de juegos (pestaña Sala).</div>';
  if (!st) return '<div class="box">Cargando…</div>';
  var last = st.drawn.length ? conLetra(st, st.drawn[st.drawn.length - 1]) : '—';
  var out = '<div class="box"><h2>' + h(String(st.name).replace(/^Los Juegos de /, 'El Bingo de ')) + '</h2><p class="muted">Ronda ' + st.round + ' · ' + st.players + ' participantes · Figura: <b>' + h(figName(st.patterns[0])) + '</b></p>';
  if (st.winConfirmed) {
    out += '<div class="now"><small>✔ Ganador confirmado</small>';
    for (var i = 0; i < st.results.length; i++) if (st.results[i].confirmed && !st.results[i].dismissed) out += '<b>' + h(st.results[i].name) + '</b><br>';
    out += '</div><p>Para otro bingo: elige la figura y empieza la ronda nueva.</p>' + figSelect() + btn('▶ Empezar ronda nueva', 'ronda', '', 'big') + '</div>';
    return out;
  }
  out += '<div style="text-align:center"><span class="ball">' + h(last) + '</span><p class="muted">' + st.drawn.length + ' de ' + st.values + ' números</p></div>';
  // Ganadores pendientes
  var w = []; var seen = {};
  for (var j = 0; j < st.results.length; j++) { var r = st.results[j]; if (r.validated && !r.dismissed && !seen[r.cardNo]) { seen[r.cardNo] = 1; w.push(r); } }
  if (w.length) {
    out += '<div class="now" style="border-color:#3fe08f"><small>🏆 ¡Hay ' + (w.length > 1 ? w.length + ' ganadores!' : 'un ganador!') + '</small>';
    for (var k = 0; k < w.length; k++) out += '<b>' + h(w[k].name) + '</b> <span class="muted">cartón #' + (st.startNumber + w[k].cardNo - 1) + '</span><br>';
    out += '</div>';
    if (w.length > 1 && !st.tieWinner) out += btn('🎲 Desempatar por sorteo', 'desempatarBingo', '', 'big warn');
    else {
      if (st.tieWinner) out += '<p>Ganador del desempate: <b>' + h(st.tieWinner.name) + '</b></p>';
      out += '<div class="row">' + btn('✔ Confirmar ganador', 'bingoAct', data('x', 'confirmwin'), 'half ok') + btn('▶ Seguir jugando', 'bingoAct', data('x', 'keepplaying'), 'half') + '</div>';
    }
  } else out += btn('Generar un número', 'bingoAct', data('x', 'draw'), 'big');
  out += btn(st.bigQr ? '📱 QR grande en pantalla: quitar' : '📱 Mostrar QR grande en pantalla', 'qr', '', st.bigQr ? 'on' : '');
  out += '<p class="muted" style="margin-top:12px">Orden de salida</p><div class="chips">';
  for (var n = 0; n < st.drawn.length; n++) out += '<span>' + h(conLetra(st, st.drawn[n])) + '</span>';
  return out + '</div></div>';
};

function stepOf(w) { var c = w.players[w.turn]; return !c.active || w.winner || w.tie ? 0 : w.runningSince ? 3 : w.onScreen ? 2 : 1; }
function roscoLeft(w) { var c = w.players[w.turn]; return w.runningSince ? c.remainingMs - (new Date().getTime() + offset - w.runningSince) : c.remainingMs; }
P.rosco = function () {
  if (!sala()) return '<div class="box">Primero crea la sala de juegos (pestaña Sala).</div>';
  var w = S.wheel;
  if (!w) {
    var r = S.raffle; var p = S.people;
    if (!r || !p) return '<div class="box">Cargando…</div>';
    var picked = r.picked || [];
    var out = '<div class="box"><h2>Sorteo de concursantes</h2><p class="muted">' + p.connected.length + ' conectados ahora</p>';
    for (var i = 0; i < picked.length; i++) out += '<div class="item">' + (i + 1) + '. <b>' + h(picked[i]) + '</b></div>';
    if (picked.length >= 3) out += btn('✔ Cargar El Rosco con los 3', 'cargarRosco', '', 'big ok');
    else out += btn('🎲 Sortear concursante (' + (picked.length + 1) + '.º de 3)', 'sortearConc', '', 'big', !p.connected.length);
    if (picked.length && picked.length < 3) out += btn('Cargar El Rosco con ' + picked.length, 'cargarRosco', '');
    out += btn('Empezar de nuevo', 'raffleReset', '');
    if (S.wheels.length) out += btn('← Volver al rosco cargado', 'verRosco', '');
    return out + '</div>';
  }
  var c = w.players[w.turn]; var step = stepOf(w);
  var o = '<div class="box"><h2>El Rosco</h2>';
  if (w.winner) {
    o += '<div class="now" style="border-color:#3fe08f"><small>🏆 Ganador</small><b>' + h(w.winner.name) + '</b> <span class="muted">' + w.winner.hits + ' ✔ · ' + w.winner.misses + ' ✘</span></div>';
    if (!w.winAccepted) o += btn('✔ Aceptar ganador', 'rosco', data('x', 'acceptwin'), 'big ok');
    else {
      o += '<p>✔ Ganador aceptado</p>';
      if (!w.crowdWinner) o += btn('🏅 Mostrar ganador de la Trivia del Rosco', 'rosco', data('x', 'crowdwin'), 'big');
      else o += '<div class="now"><small>Ganó la Trivia del Rosco</small><b>' + h(w.crowdWinner.name) + '</b> <span class="muted">' + w.crowdWinner.score + ' puntos</span></div>';
    }
  } else if (w.tie) {
    o += '<p>Empate entre <b>' + h(w.tie.names.join(' y ')) + '</b>.</p>' + btn('🎲 Desempatar por sorteo', 'desempatarRosco', '', 'big warn', w.tie.rolling);
  } else {
    o += '<div class="now"><small>Turno</small><b>' + h(c.name) + '</b> · letra <b style="font-size:26px">' + h(c.active ? w.letters[c.current] : '—') + '</b> · <b id="rclock">' + clock(roscoLeft(w)) + '</b><br><span class="muted">' + c.hits + ' ✔ · ' + c.misses + ' ✘</span></div>';
    var q = ((w.questions || [])[w.turn] || [])[c.current] || {};
    if (w.runningSince && q.q) o += '<div class="q">' + h(q.q) + (q.a ? '<div class="a">Respuesta: ' + h(q.a) + '</div>' : '') + '</div>';
    o += btn(w.onScreen ? '📺 Rosco en pantalla ✓' : '📺 Poner rosco en pantalla', 'roscoShow', '', 'big', step !== 1);
    o += btn(w.runningSince ? '⏱ Pregunta en curso' : '▶ Iniciar pregunta', 'rosco', data('x', 'start'), 'big', step !== 2);
    o += '<div class="row">' + btn('✔ Correcta', 'rosco', data('x', 'hit'), 'half ok', step !== 3) + btn('✘ Incorrecta', 'rosco', data('x', 'miss'), 'half bad', step !== 3) + '</div>';
    o += btn('↷ Pasa', 'rosco', data('x', 'pass'), 'big warn', step !== 3);
    o += '<div class="row">' + btn('↶ Deshacer', 'rosco', data('x', 'undo'), 'half', !w.canUndo) + btn('Cambiar turno', 'rosco', data('x', 'turn'), 'half') + '</div>';
  }
  o += btn(w.rank ? '🏅 Recoger ranking (está en pantalla)' : '🏅 Desplegar ranking de la Trivia', 'roscoRank', '', w.rank ? 'on' : '');
  o += btn('Sortear concursantes para un rosco nuevo', 'nuevoRosco', '');
  return o + '</div>';
};

P.festival = function () { return votoHTML('karaoke'); };
P.objeto = function () { return votoHTML('objeto'); };
function votoHTML(want) {
  var st = S.vote;
  if (!sala()) return '<div class="box">Primero crea la sala de juegos (pestaña Sala).</div>';
  if (!st) return '<div class="box">Cargando…</div>';
  var name = want === 'karaoke' ? '🎤 El Festival' : '🗳️ El objeto más extraño';
  var o = '<div class="box"><h2>' + name + '</h2>';
  if (st.mode !== want) {
    if (!st.players.length && st.phase === 'voting') return o + btn('Empezar ' + name, 'voto', data('x', 'mode') + data('mode', want), 'big') + '</div>';
    return o + '<p class="muted">Hay otro concurso en curso (' + h(st.title) + ').</p>' + btn('Empezar ' + name + ' (borra el anterior)', 'votoNuevo', data('mode', want), 'big warn') + '</div>';
  }
  if (st.phase === 'voting') {
    var next = null; for (var i = 0; i < st.players.length; i++) if (!st.players[i].done) { next = st.players[i]; break; }
    var anyDone = false; for (var j = 0; j < st.players.length; j++) if (st.players[j].done) anyDone = true;
    if (st.open) o += '<div class="now"><small>🗳️ Votación abierta · ' + (st.counts[st.open.id] || 0) + ' votos</small><b>' + h(st.open.name) + '</b><br><span class="muted">' + h(st.open.thing) + '</span></div>' + btn('Cerrar votación', 'voto', data('x', 'close'), 'big');
    else if (st.signup) o += '<div class="now"><small>📲 Inscripciones abiertas</small>' + st.players.length + ' inscritos</div>' + btn('Cerrar inscripciones', 'voto', data('x', 'signup'), 'big');
    else if (!st.players.length) o += '<p>' + (want === 'karaoke' ? '¿Cuántos participantes van a cantar?' : 'Cupos (máximo de participantes)') + ' <b style="font-size:26px">' + st.max + '</b></p><div class="row">' + btn('− Uno menos', 'voto', data('x', 'max') + data('max', st.max - 1), 'half', st.max <= 2) + btn('+ Uno más', 'voto', data('x', 'max') + data('max', st.max + 1), 'half', st.max >= 30) + '</div>' + btn('📲 Abrir inscripciones', 'voto', data('x', 'signup') + data('on', '1'), 'big');
    else if (st.overflow) o += btn('🎲 Sortear los ' + st.max + ' que cantan (se inscribieron ' + st.players.length + ')', 'voto', data('x', 'draw'), 'big warn');
    else if (next && st.onstage && st.onstage.id === next.id) o += '<div class="now"><small>' + (want === 'karaoke' ? '🎤 En el escenario' : '🗳️ Presentando su objeto') + '</small><b>' + h(next.name) + '</b><br><span class="muted">' + h(next.thing) + '</span></div>' + btn('🗳️ Iniciar votación', 'voto', data('x', 'open') + data('id', next.id), 'big ok');
    else if (next) o += '<div class="now"><small>' + (anyDone ? 'Ya viene el siguiente participante' : 'Primer participante') + '</small><b>' + h(next.name) + '</b><br><span class="muted">' + h(next.thing) + '</span></div>' + btn('🎤 Iniciar participante', 'voto', data('x', 'present') + data('id', next.id), 'big');
    else if (st.players.length >= 2) o += btn('🏁 Pasar a los resultados', 'voto', data('x', 'results'), 'big');
    else o += '<p class="muted">Se necesitan al menos 2 participantes.</p>' + btn('📲 Abrir inscripciones otra vez', 'voto', data('x', 'signup') + data('on', '1'), 'big');
    for (var k = 0; k < st.players.length; k++) { var p = st.players[k]; o += '<div class="item">' + (p.done ? '✔ ' : '') + '<b>' + h(p.name) + '</b> <span class="muted">' + h(p.thing) + (p.done ? ' · ' + st.counts[p.id] + ' votos' : '') + '</span></div>'; }
  } else if (st.phase === 'results') {
    if (st.next) o += '<div class="now"><small>Viene · solo lo ves tú</small><b>' + ord(st.next.place) + ' · ' + h(st.next.name) + '</b></div>' + btn('Revelar ' + ord(st.next.place), 'voto', data('x', 'reveal'), 'big');
    else o += btn(want === 'karaoke' ? '🥁 Redoble de tambores: los dos finalistas' : '⚔️ Gran final: abrir votación', 'voto', data('x', 'final'), 'big warn');
    for (var m = st.places.length - 1; m >= 0; m--) o += '<div class="item">' + ord(st.places[m].place) + ' · <b>' + h(st.places[m].name) + '</b></div>';
  } else if (st.phase === 'final') {
    if (want === 'karaoke') o += btn('🏆 Revelar al gran ganador', 'voto', data('x', 'winner'), 'big ok');
    else if (st.final.open) o += '<p>Recibiendo votos de la gran final…</p>' + btn('Cerrar votación', 'voto', data('x', 'closefinal'), 'big');
    else o += btn('🏆 Revelar quién ganó', 'voto', data('x', 'winner'), 'big ok') + btn('Reabrir votación', 'voto', data('x', 'final'), '');
  } else if (st.winner) {
    o += '<div class="now" style="border-color:#3fe08f"><small>🏆 Ganó</small><b>' + h(st.winner.name) + '</b></div><p class="muted">Sigue con el sorteo de juegos (pestaña Juegos).</p>';
  }
  o += '<p style="margin-top:16px">' + btn('🗑 Nuevo concurso (borra este)', 'votoNuevo', data('mode', want), 'bad') + '</p>';
  return o + '</div>';
}

P.karaoke = function () {
  var k = S.kar;
  if (!k) return '<div class="box">Cargando…</div>';
  var o = '<div class="box"><h2>Karaoke · ' + h(k.name) + '</h2>';
  if (!k.list.length) return o + '<p class="muted">Cuando alguien pida una canción, aparecerá aquí.</p></div>';
  for (var i = 0; i < k.list.length; i++) {
    var p = k.list[i];
    o += '<div class="item">' + (k.edit && p.id ? btn('▼', 'kar', data('x', 'bajar') + data('id', p.id), '', i === k.list.length - 1) + btn('▲', 'kar', data('x', 'subir') + data('id', p.id), '', i === 0) + btn('✔ Ya cantó', 'kar', data('x', 'cantado') + data('id', p.id), 'ok') : '') +
      (i === 0 ? '🎤 ' : (i + 1) + '. ') + '<b>' + h(p.name) + '</b><br><span class="muted">' + h(p.song) + (p.artist ? ' · ' + h(p.artist) : '') + '</span></div>';
  }
  if (!k.edit) o += '<p class="muted">El orden y «Ya cantó» se manejan en la app del equipo.</p>';
  return o + '</div>';
};

P.pantalla = function () {
  var o = '<div class="box"><h2>En pantalla</h2><div class="row">';
  for (var i = 0; i < STAGES.length; i++) o += btn(STAGES[i][1], 'pantalla', data('s', STAGES[i][0]), 'half' + (S.stage === STAGES[i][0] ? ' on' : ''));
  return o + '</div></div>';
};

// ---------- Acciones ----------
var A = {};
A.entrar = function () {
  msg('Entrando…');
  pedir('POST', '/api/login', { user: $('user').value, pass: $('pass').value }, function (err, r) {
    if (err) { msg(err); return; }
    token = r.token;
    try { window.localStorage.setItem('adminToken', token); } catch (e) { /* modo privado */ }
    msg(''); mostrarPanel();
  });
};
A.salir = function () { token = ''; try { window.localStorage.removeItem('adminToken'); } catch (e) { /* nada */ } mostrarLogin(); };
A.cerrarSala = function (el) { if (confirm('¿Cerrar la sala de juegos? Se borran los participantes y los juegos de la noche.')) hacer('POST', '/api/sessions/' + el.getAttribute('data-sid') + '/host/close', {}, 'Sala cerrada'); };
A.crearSala = function (el) {
  var v = el.getAttribute('data-v'); var nombre = 'Los Juegos de ' + el.innerHTML;
  msg('Creando la sala…');
  var proj = null; var list = S.projects || [];
  for (var i = 0; i < list.length; i++) if (list[i].theme === v && list[i].format === 'numbers') { proj = list[i]; break; }
  var abrir = function (pid) { pedir('POST', '/api/projects/' + pid + '/session', { name: nombre, theme: v, password: '', cardsPerPlayer: 1, isPublic: true, showName: true, patterns: ['linea'] }, function (err) { msg(err || 'Sala creada: ' + nombre); leer(); }); };
  if (proj) abrir(proj.id);
  else pedir('POST', '/api/projects', { name: nombre, theme: v, count: 320, format: 'numbers', values: 75, headers: 'BINGO', freeCenter: false, startNumber: 1 }, function (err, p) { if (err) { msg(err); return; } abrir(p.id); });
};
A.total = function (el) { hacer('POST', '/api/gamedraw/total', { total: Number(el.getAttribute('data-n')) }); };
A.iniciarSorteo = function () { hacer('POST', '/api/gamedraw/ready', null, 'En pantalla: los juegos que pueden salir'); };
A.girar = function () { msg('Girando…'); pedir('POST', '/api/gamedraw', null, function (err, g) { msg(err || ('Salió: ' + GAMES[g.last.game])); leer(); }); };
A.elegir = function (el) { hacer('POST', '/api/gamedraw/pick', { game: el.getAttribute('data-g') }, 'Siguiente juego elegido'); };
A.deshacer = function () { hacer('POST', '/api/gamedraw/undo', null, 'Se volvió al paso anterior'); };
A.bingoAct = function (el) { var s = sala(); if (s) hacer('POST', '/api/sessions/' + s.id + '/host/' + el.getAttribute('data-x'), {}); };
A.qr = function () { var s = sala(); if (s && S.bingo) hacer('POST', '/api/sessions/' + s.id + '/host/bigqr', { on: !S.bingo.bigQr }); };
A.ronda = function () { var s = sala(); if (s) hacer('POST', '/api/sessions/' + s.id + '/host/restart', { patterns: [$('fig').value] }, 'Ronda nueva'); };
A.desempatarBingo = function () { var s = sala(); if (s) hacer('POST', '/api/raffle/tiebreak', { sid: s.id }, 'Desempate en pantalla'); };
A.sortearConc = function () { hacer('POST', '/api/raffle/draw', null, 'Sorteando en pantalla…'); };
A.raffleReset = function () { hacer('POST', '/api/raffle/reset', null); };
A.cargarRosco = function () {
  if (!S.raffle) return;
  msg('Cargando El Rosco…');
  pedir('POST', '/api/wheels', { name: 'El Rosco', players: S.raffle.picked }, function (err) { msg(err || 'El Rosco cargado'); S.newRosco = false; leer(); });
};
A.nuevoRosco = function () { S.newRosco = true; pedir('POST', '/api/raffle/reset', null, function () { leer(); }); };
A.verRosco = function () { S.newRosco = false; leer(); };
A.rosco = function (el) { if (S.wheel) hacer('POST', '/api/wheels/' + S.wheel.id + '/act', { action: el.getAttribute('data-x') }); };
A.roscoShow = function () { if (S.wheel) hacer('POST', '/api/wheels/' + S.wheel.id + '/act', { action: 'show', on: true }); };
A.roscoRank = function () { if (S.wheel) hacer('POST', '/api/wheels/' + S.wheel.id + '/act', { action: 'rank', on: !S.wheel.rank }); };
A.desempatarRosco = function () { if (S.wheel) hacer('POST', '/api/wheels/' + S.wheel.id + '/tiebreak', null, 'Desempate en pantalla'); };
A.voto = function (el) {
  var d = { action: el.getAttribute('data-x') };
  if (el.getAttribute('data-mode')) d.mode = el.getAttribute('data-mode');
  if (el.getAttribute('data-max')) d.max = Number(el.getAttribute('data-max'));
  if (el.getAttribute('data-id')) d.id = el.getAttribute('data-id');
  if (el.getAttribute('data-on')) d.on = true;
  hacer('POST', '/api/vote/host', d);
};
A.votoNuevo = function (el) {
  if (!confirm('¿Borrar este concurso y empezar uno nuevo?')) return;
  var mode = el.getAttribute('data-mode');
  pedir('POST', '/api/vote/host', { action: 'reset' }, function (err) { if (err) { msg(err); return; } hacer('POST', '/api/vote/host', { action: 'mode', mode: mode }); });
};
A.kar = function (el) { hacer('POST', '/api/karaoke/accion', { accion: el.getAttribute('data-x'), id: el.getAttribute('data-id') }, el.getAttribute('data-x') === 'cantado' ? 'Marcado: ya cantó' : ''); };
A.pantalla = function (el) { hacer('POST', '/api/stage', { show: el.getAttribute('data-s') }); };

document.onclick = function (e) {
  var t = e.target || e.srcElement;
  while (t && t !== document && !(t.getAttribute && (t.getAttribute('data-a') || t.getAttribute('data-tab')))) t = t.parentNode;
  if (!t || t === document || t.disabled) return;
  if (t.getAttribute('data-tab')) { tab = t.getAttribute('data-tab'); try { window.localStorage.setItem('ccTab', tab); } catch (x) { /* nada */ } $('body').innerHTML = '<div class="box">Cargando…</div>'; leer(); return; }
  var f = A[t.getAttribute('data-a')];
  if (f) { if (e.preventDefault) e.preventDefault(); f(t); }
};

if (token) pedir('GET', '/api/me', null, function (err, r) { if (!err && r && r.admin) mostrarPanel(); else mostrarLogin(); });
else mostrarLogin();
// Relectura cada 3 s (no mientras se elige una figura) y reloj de El Rosco cada segundo
setInterval(function () { if ($('panel').style.display === 'block' && document.activeElement && document.activeElement.tagName !== 'SELECT') leer(); }, 3000);
setInterval(function () { var c = $('rclock'); if (c && S.wheel) c.innerHTML = clock(roscoLeft(S.wheel)); }, 1000);
</script>
</body>
