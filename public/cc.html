<!doctype html>

<title>Control KRB · liviano</title>
<!-- Centro de control liviano (pedido de Cote, 21 nov) para el iPad viejo (iOS 9.3.5). Mismos pasos, botones y textos
     que la plataforma completa: inicio → crear sala → figura → bingo; menú de juegos abajo con el sorteo en dos pasos;
     sorteo de concursantes → El Rosko; El Festival y El objeto más extraño paso a paso; karaoke; Centro de control.
     Escrito en JavaScript antiguo (sin funciones flecha, let/const, fetch, plantillas, includes ni NodeList.forEach)
     y CSS sin grid, para navegadores de 2016. Lee el estado cada 3 s (sin conexiones en vivo). Enlace corto: /cc -->
<style>
  body { margin: 0; padding: 12px 12px 40px; background: #120f24; color: #f3f0ff; font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 18px; }

  .paso { background: #16a34a; border-color: #16a34a; color: #fff; }

  .big { display: block; width: 100%; font-size: 21px; padding: 16px 10px; border-radius: 16px; margin: 8px 0; }
  .ok { background: #1f9d55; border-color: #3fe08f; }

  @media (min-width: 900px) { .modes.lobby button.mode { float: left; width: 32%; margin: 0 2% 16px 0; } .modes.lobby button.mode:last-child { margin-right: 0; } }
  .gvnow { text-align: center; color: #ffc400; font-weight: bold; font-size: 18px; margin: 6px 0 10px; }
  .gvwin { text-align: center; color: #ffc400; font-weight: bold; font-size: 22px; margin: 6px 0 10px; }

  .gvrow.gwin, .gvrow.gsel { border-color: #ffc400; }
  .sec { text-align: center; color: #a9a3cf; font-size: 13px; font-weight: bold; letter-spacing: 1px; margin: 14px 0 4px; }
  .game { float: left; width: 48%; margin: 4px 1%; border-radius: 16px; padding: 14px 6px; min-height: 76px; }
  .game { height: 96px; overflow: hidden; }
  .game.cur { border: 3px solid #ffc400; }
  .game.played { opacity: .55; }
  .grid75 { overflow: hidden; }
  .grid75 .l { float: left; width: 100%; font-weight: bold; color: #ffc400; margin-top: 6px; }
  .grid75 button { float: left; width: 12.5%; padding: 8px 0; margin: 1px 0; border-radius: 8px; font-size: 15px; }
  .home { text-align: center; padding-top: 20px; }
  .create { display: block; padding: 28px 10px; border-radius: 24px; font-size: 26px; font-weight: bold; color: #fff; text-decoration: none; background: #ff7a1a; margin: 18px 0 10px; text-align: center; }
  .create.open { background: #1f9d55; }
  .center { text-align: center; }
  #msg { position: fixed; left: 10px; right: 10px; bottom: 10px; background: #000; color: #ffc400; padding: 12px; border-radius: 12px; font-size: 16px; display: none; text-align: center; z-index: 9; }
  /* ---------- Modo animador (pedido de Cote, 25 nov): la misma estética oscura de la marca y lo justo ---------- */
  body.anim { background: #0c0b12; padding-bottom: 300px; }
  .anim .panel { background: #15131e; border-color: #2a2636; border-top: 3px solid #f4bf5a; border-radius: 14px; }

  .anim .paso.fijo { top: auto; bottom: 10px; min-height: 84px; font-size: 24px; background: #22b35e; border-color: #22b35e; }
  .anim .paso.fijo[disabled] { background: #4a4752; border-color: #4a4752; opacity: 1; -webkit-filter: none; filter: none; }
  .anim .wkeys { position: fixed; left: 2%; width: 96%; bottom: 0; z-index: 50; background: #0c0b12; padding: 8px 0 10px; -webkit-box-shadow: 0 -10px 24px rgba(0,0,0,.7); box-shadow: 0 -10px 24px rgba(0,0,0,.7); overflow: hidden; }

  .anim .wkeys .wback { float: none; min-height: 48px; }

  .anim .wkeys .third { min-height: 84px; font-size: 22px; margin-bottom: 0; }
  .anim .wkeys .ok { background: #22b35e; border-color: #22b35e; }
  .anim .wkeys .bad { background: #e0413a; border-color: #e0413a; }
  .anim .wkeys .warn { background: #f2c230; border-color: #f2c230; color: #1a1407; }
  .anim .wkeys button[disabled] { background: #4a4752; border-color: #4a4752; color: #c9c5d0; opacity: 1; -webkit-filter: none; filter: none; }
  #an-opts { position: fixed; top: 8px; right: 10px; z-index: 60; text-align: right; }

  .an-card { max-width: 640px; margin: 12% auto 0; background: #15131e; border-top: 4px solid #f4bf5a; border-radius: 18px; padding: 22px 20px 18px; font-size: 22px; line-height: 1.35; }
  .an-card b.t, .an-card .an-title { display: block; color: #f4bf5a; font-size: 28px; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; }

  .an-card em { color: #f4bf5a; font-style: normal; font-weight: bold; }

<script>
var token = '';
try { token = window.localStorage.getItem('adminToken') || ''; } catch (e) { token = ''; }
var offset = 0;
var PANEL_ID = 'cc' + Math.random().toString(36).slice(2, 10);
var V = { frida: 'Frida', tobalaba: 'Tobalaba', kennedy: 'Mercado Kennedy' }; // el local se llama Mercado Kennedy (pedido de Cote, 21 nov)
// «y» o «e» entre nombres (Cote, 25 nov: «Camilo e Isidora»)
function eY(w) { var s = String(w || '').replace(/^[^A-Za-z\u00C0-\u00FF]+/, '').toLowerCase(); return /^h?[i\u00ed\u00ef]/.test(s) && !/^h?[i\u00ed][aeiou\u00e1\u00e9\u00f3\u00fa]/.test(s) ? 'e' : 'y'; }
function yJoin(a) { a = a || []; return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' ' + eY(a[a.length - 1]) + ' ' + a[a.length - 1]; }
var BINGO_HOWTO = ['Todos juegan desde las mesas, con su cartón en el celular.', 'Gana quien complete primero la <em>figura</em>.', 'Empate: sorteo.'];
var ROSCO_HOWTO = ['3 participantes.', 'Todos juegan desde las mesas.', '<em>Premio mayor</em> para el que gana El Rosko.', '<em>Premio especial</em> para el ganador del público que juega la Trivia del Rosko.'];
var LINES = [['linea', 'Línea (cualquiera)'], ['horizontal', 'Línea horizontal'], ['vertical', 'Línea vertical'], ['diagonal', 'Diagonal'], ['dos-lineas', 'Dos líneas']];
var SHAPES = [['esquinas', 'Cuatro esquinas'], ['sello', 'Sello (2×2 en una esquina)'], ['cruz', 'Cruz'], ['marco', 'Marco'], ['cuadro', 'Cuadro central'], ['diamante', 'Diamante'], ['piramide', 'Pirámide'], ['piramide-inv', 'Pirámide invertida'], ['reloj', 'Reloj de arena'], ['corazon', 'Corazón'], ['estrella', 'Estrella'], ['lleno', 'Cartón lleno']];
var LETTERS = []; (function () { var l = 'abcdefghijklmnopqrstuvwxyz'; for (var i = 0; i < l.length; i++) LETTERS.push([l.charAt(i), 'Figura ' + l.charAt(i).toUpperCase()]); })();
var STAGES = [['bingo', '🎱 Bingo'], ['sorteo', '🎲 Sorteo'], ['rueda', '🎡 El Rosko'], ['qr', '📱 QR en pantalla completa'], ['karaoke', '🎤 Karaoke'], ['show', '⭐ Show'], ['voto', '🗳️ Votación'], ['insta', '📸 Instagram'], ['none', '⬛ Nada']];
// Botones de «En pantalla» (pedido de Cote, 28 nov): los de la sala light del local, con «Juego en vivo» primero
var FONDO_LUZ = { kennedy: 'FONDO KENNEDY', frida: 'FONDO FRIDA', tobalaba: 'FONDO TOBALABA' };
function luzKeys(v) {
  return [['sala', '🎮 JUEGO EN VIVO'], ['karaoke', '🎤 GC KARAOKE'], ['qr', '📱 QR GRANDE'], ['show', '⭐ GC SHOW'], ['cartelera', '📅 GC CARTELERA'], ['info', '🔄 INFO GRAL'], FONDO_LUZ[v] ? ['fondo', '🎬 ' + FONDO_LUZ[v]] : ['none', '⛔ NADA'], ['insta', '📸 REDES SOCIALES']];
}

function $(id) { return document.getElementById(id); }
function h(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function many(n, one, more) { return n + ' ' + (n === 1 ? one : more); } // «1 acierto», «2 aciertos»
var msgT = null;
function toast(t) { var m = $('msg'); m.innerHTML = h(t); m.style.display = t ? 'block' : 'none'; clearTimeout(msgT); if (t) msgT = setTimeout(function () { m.style.display = 'none'; }, 4000); }
function api(metodo, ruta, datos, listo) {
  var x = new XMLHttpRequest();
  x.open(metodo, ruta, true);
  x.setRequestHeader('Content-Type', 'application/json');
  if (token) x.setRequestHeader('x-admin', token);
  x.setRequestHeader('x-panel', PANEL_ID); // el servidor no hace dos veces el mismo paso si lo mandan dos paneles a la vez
  x.timeout = 30000;
  x.onreadystatechange = function () {
    if (x.readyState !== 4) return;
    var r = null;
    try { r = JSON.parse(x.responseText); } catch (e) { r = null; }
    if (r && r.now) offset = r.now - new Date().getTime();
    if (x.status === 401 && ruta.indexOf('/api/login') < 0) { token = ''; go('#/login'); return; }

  var all = app.querySelectorAll('.paso'); var best = null; var i;
  for (i = 0; i < all.length && !best; i++) if (!all[i].disabled && all[i].offsetWidth) best = all[i];
  for (i = 0; i < all.length && !best; i++) if (all[i].offsetWidth) best = all[i];
  if (best !== pasoCur) { if (pasoCur) pasoCur.className = pasoCur.className.replace(/ ?fijo/g, ''); pasoCur = best; if (best) best.className += ' fijo'; }
  var pad = best ? (best.offsetHeight + 14) + 'px' : '';
  if (ANIM) pad = ''; // modo animador: el botón va abajo y el espacio de abajo lo da la hoja de estilos
  if (app.style.paddingTop !== pad) app.style.paddingTop = pad;
}
setInterval(fijarPaso, 250);

function stepOf(w) { var c = w.players[w.turn]; return !c.active || w.winner || w.tie ? 0 : w.runningSince ? 3 : w.onScreen ? 2 : 1; }
function roscoLeft(w) { var c = w.players[w.turn]; return w.runningSince ? c.remainingMs - (new Date().getTime() + offset - w.runningSince) : c.remainingMs; }
var W = null;
// Panel de El Rosko: se dibuja con el estado del rosko (al leerlo cada 3 s o, al instante, con la respuesta de cada acción)

  if (location.hash !== '#/rosco' || !w) return;
  W = w;

  var o = topBar(['#/', 'Inicio'], 1);
  if (!started && !w.winAccepted) o += howto('El Rosko', ROSCO_HOWTO);
  o += '<div class="panel">';
  if (!w.winAccepted) {
    // Pedido de Cote (21 nov): arriba a la derecha, «Es el turno de» chico y el nombre grande y en color; al cambiar el

    var turnFlash = S.lastTurn !== undefined && S.lastTurn !== w.turn;
    S.lastTurn = w.turn;
    if (c.active && !w.winner && !w.tie) o += '<div class="who' + (turnFlash ? ' flash' : '') + '"><small>Es el turno de</small><b>' + h(c.name) + '</b>' + (c.place ? '<small>📍 ' + h(c.place) + '</small>' : '') + '</div>';
    o += '<h1>' + h(w.name) + '</h1><div class="muted">' + (w.winner ? '🏆 Gana ' + h(w.winner.name) + ' (' + w.winner.hits + ' ✔ · ' + w.winner.misses + ' ✘)' : w.tie ? 'Empate' : '') + '</div><div style="clear:both"></div>';
    if (w.rank) o += rankAnn(w.rank, w.rankPlayers || 0, !!(w.crowdWinner || w.winner)); // el ranking que está en pantalla, grande
    o += '<div class="now"><small>Letra · reloj</small><b style="font-size:30px">' + h(c.active ? w.letters[c.current] : '—') + '</b> · <b id="rclock">' + clock(roscoLeft(w)) + '</b> <span class="muted">' + c.hits + ' ✔ · ' + c.misses + ' ✘</span></div>';
    var q = ((w.questions || [])[w.turn] || [])[c.current] || {};
    o += '<div class="q' + (w.runningSince && c.active ? ' live' : '') + '">' + (!c.active ? (w.tie ? (w.tie.rolling ? '<b>Sorteando el desempate…</b> Mira la pantalla.' : '<b>Hay un empate</b> entre ' + h(yJoin(w.tie.names)) + '. Primero desempata por sorteo.') : 'Juego terminado.') :
      !w.runningSince ? '<span class="muted">Pulsa «Iniciar pregunta» para ver la pregunta de esta letra.</span>' : '<div class="qt">' + h(q.q || '') + '</div>' + (q.a ? '<div class="a"><small>Respuesta</small>' + h(q.a) + '</div>' : '')) + '</div>';
    if (w.tie && !w.tie.rolling) o += btn('🎲 Desempatar por sorteo', 'tieRosco', '', 'big warn');
    if (w.rankDue && !w.runningSince) o += '<div class="ann" style="padding:12px;border-radius:14px;margin:8px 0"><b style="font-size:20px">📊 Terminaron ' + (w.rankEvery || 2) + ' rondas.</b><br>Antes de la próxima pregunta, despliega el ranking de la Trivia del Rosko en pantalla.</div>' + btn('📊 Terminaron ' + (w.rankEvery || 2) + ' rondas: despliega el ranking de la Trivia (obligatorio)', 'roscoRankOn', '', 'big warn rankdue');

    o += btn(w.runningSince ? '⏱ Pregunta en curso' : '▶ Iniciar pregunta', 'wheel', d('x', 'start'), 'big primary', step !== 2 || w.rankDue);

  if (w.rank && w.winAccepted) o += rankAnn(w.rank, w.rankPlayers || 0, true); // con el ganador aceptado, también al final

  o += '</div>' + (w.winAccepted && !w.crowdWinner ? '' : nav('rosco', started && !w.winAccepted)) + foot();

A.kar = function (el) { act('POST', '/api/karaoke/accion', { accion: el.getAttribute('data-x'), id: el.getAttribute('data-id') }, el.getAttribute('data-x') === 'cantado' ? 'Marcado: ya cantó' : ''); };
A.karPhone = function (el) { act('POST', '/api/karaoke/config', { phone: !!el.getAttribute('data-on') }); };
A.closeSala = function (el) { if (window.confirm('¿Cerrar la sala de juegos? Se borran los participantes y los juegos de la noche.')) act('POST', '/api/sessions/' + el.getAttribute('data-sid') + '/host/close', {}, 'Sala cerrada'); };

document.onclick = function (e) {
  var t = e.target || e.srcElement;
  while (t && t !== document && !(t.getAttribute && t.getAttribute('data-a'))) t = t.parentNode;
  if (!t || t === document || t.disabled) return;
  var f = A[t.getAttribute('data-a')];
  if (ANIM) { // «¿Seguro?» solo en lo que no se puede deshacer (30.1)
    var x = t.getAttribute('data-x');
    if (x === 'confirmwin' && !window.confirm('¿Seguro que confirmas a este ganador?')) return;
    var p = t; while (p && p !== document && p.id !== 'an-opts') p = p.parentNode;
    if (p && p.id === 'an-opts' && t.getAttribute('data-a') !== 'animOpts') { animOptsOpen = false; p.className = ''; }
  }
  if (f) { if (e.preventDefault) e.preventDefault(); f(t); }
};

// Votación del juego: se lee cada segundo mientras está abierta (reloj y votos) y, si el ganador sale mientras el
// panel mira, el panel pasa solo a ese juego (como el sorteo)
var gvT = null; var gvLast = '';
function gvPoll() {
  clearTimeout(gvT);
  if (!token || howOf(S.draw) !== 'votacion') { gvT = setTimeout(gvPoll, 2000); return; }
  api('GET', '/api/gamevote', null, function (err, r) {
    if (r) {
      var prev = S.gv; S.gv = r;
      var box = $('gvbox'); var html = gvHtml();
      if (box && (html !== gvLast || box.innerHTML === '')) { box.innerHTML = html; gvLast = html; }
      if (!box && !S.navMode && (r.phase === 'voting' || (r.phase === 'result' && r.runoff)) && document.querySelector('.modes')) refresh(); // se despliega sola
      if (r.phase === 'voting' && box) S.gvVoting = r.id; // el iPad está mirando esta votación
      if (box && S.gvVoting === r.id && prev && prev.id === r.id && prev.phase === 'voting' && r.phase === 'done' && r.winner) {
        S.gvVoting = null;
        toast('🗳️ Ganó ' + gameIcon(r.winner) + ' ' + gameName(r.winner) + '. En unos segundos pasamos al juego…');
        clearTimeout(goTimer);
        var here = location.hash; // si el animador ya eligió otra cosa, no se salta (Cote, 24 nov)
        goTimer = setTimeout(function () { if (location.hash === here) toGame(r.winner); }, 8000);
      }
    }
    gvT = setTimeout(gvPoll, r && (r.phase === 'voting' || r.phase === 'intro') ? 1000 : 2500);
  });
}
gvPoll();

// ---------- Rutas ----------
var refresh = function () {};
function route() {
  clearInterval(poll); clearInterval(tick); poll = null; tick = null;
  var parts = (location.hash || '#/').replace(/^#\/?/, '').split('/');
  var name = parts[0] || 'home';
  if (!token && name !== 'login') { go('#/login'); return; }
  S.foldOpen = false; // como en la plataforma completa: al cambiar de vista, el menú vuelve a plegarse si hay un juego en curso
  S.navMode = null; // al entrar a otra vista, el menú parte con los tres botones
  S.fx = ''; // acciones que cada vista hace una sola vez al entrar
  S.gvVoting = null; // al cambiar de vista no se pasa solo a un juego por una votación vista antes
  S.roscoBusy = false; busySeq++; // una acción de El Rosko que quedó a medias (red lenta o sesión vencida) no bloquea la vista nueva
  var v = views[name] || views.home;
  refresh = function () { clearInterval(poll); clearInterval(tick); v(parts[1]); };
  window.scrollTo(0, 0);
  v(parts[1]);
}
window.onhashchange = function () { route(); setTimeout(panelSend, 60); };
// ---------- Paneles sincronizados (pedido de Cote, 26 nov) ----------
// Igual que en la plataforma: cuando otro panel (el celular del animador, la plataforma, el GC Master u otro iPad) pasa
// a otra vista de juego, este iPad pasa solo a la misma, y al revés. Rutas de la plataforma ↔ rutas de este panel.
var PFOLLOW = /^#\/(juegos|figura|bingo|ronda|festival|objeto|desafio|rosco|sorteoctl)/;
var panelSeq = -1; var panelQuiet = new Date().getTime() + 3000;
function ccRuta(hh) {
  var m = [[/^#\/juegos/, '#/juegos'], [/^#\/figura\//, '#/figura'], [/^#\/anfitrion\//, '#/bingo'], [/^#\/ronda\//, '#/ronda'], [/^#\/votoctl\/festival/, '#/festival'],
    [/^#\/votoctl\/objeto/, '#/objeto'], [/^#\/desafioctl/, '#/desafio'], [/^#\/ruedactl\//, '#/rosco'], [/^#\/sorteoctl\/desafio/, '#/sorteoctl/desafio'], [/^#\/sorteoctl/, '#/sorteoctl']];
  for (var i = 0; i < m.length; i++) if (m[i][0].test(hh)) return m[i][1];
  return '';
}
function panelSend() {
  var hh = location.hash || '';
  if (!token || new Date().getTime() < panelQuiet || !PFOLLOW.test(hh)) return;
  api('POST', '/api/panel/ruta', { hash: hh }, function (err, r) { if (!err && r) panelSeq = r.seq; });
}
function panelCheck() {
  if (!token || document.hidden) return;
  api('GET', '/api/panel/ruta', null, function (err, r) {
    if (err || !r) return;
    var fresh = panelSeq >= 0 && r.seq !== panelSeq;
    panelSeq = r.seq;
    if (!fresh || r.from === PANEL_ID || !r.hash || !PFOLLOW.test(location.hash || '')) return;
    var to = ccRuta(r.hash);
    if (!to || to === location.hash) return;
    panelQuiet = new Date().getTime() + 2500;
    go(to);
  });
}
setTimeout(panelCheck, 1200);
setInterval(panelCheck, 1500);
if (/[?&]animador/.test(location.search) && !ANIM) token = ''; // /ca: entrar como animador (pide su clave)
if (token) api('GET', '/api/me', null, function (err, r) { if (!err && r && r.admin) { if (/^#\/login/.test(location.hash)) go(ANIM ? '#/juegos' : '#/'); else route(); } else { token = ''; go('#/login'); } });
else go('#/login');
</script>
</body>
</html>
