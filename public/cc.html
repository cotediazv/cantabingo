<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control KRB · liviano</title>
<!-- Centro de control liviano (pedido de Cote, 21 nov) para el iPad viejo (iOS 9.3.5). Mismos pasos, botones y textos
     que la plataforma completa: inicio → crear sala → figura → bingo; menú de juegos abajo con el sorteo en dos pasos;
     sorteo de concursantes → El Rosco; El Festival y El objeto más extraño paso a paso; karaoke; Centro de control.
     Escrito en JavaScript antiguo (sin funciones flecha, let/const, fetch, plantillas, includes ni NodeList.forEach)
     y CSS sin grid, para navegadores de 2016. Lee el estado cada 3 s (sin conexiones en vivo). Enlace corto: /cc -->
<style>
  body { margin: 0; padding: 12px 12px 40px; background: #120f24; color: #f3f0ff; font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 18px; }
  a { color: #b9a8ff; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  h2 { font-size: 20px; margin: 0 0 10px; }
  .panel { background: #1d1838; border: 1px solid #3a3470; border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .muted { color: #a9a3cf; font-size: 15px; }
  input, select { width: 100%; box-sizing: border-box; font-size: 18px; padding: 10px; margin: 6px 0 12px; border-radius: 10px; border: 1px solid #5a54a0; background: #120f24; color: #fff; }
  button, .btn { display: inline-block; box-sizing: border-box; font-size: 18px; font-weight: bold; color: #fff; background: #2b2550; border: 1px solid #5a54a0; border-radius: 999px; padding: 11px 18px; margin: 4px 2px; cursor: pointer; -webkit-appearance: none; text-decoration: none; text-align: center; }
  button[disabled] { opacity: .35; -webkit-filter: grayscale(1); filter: grayscale(1); }
  .primary { background: #6c5ce7; border-color: #6c5ce7; }
  .big { display: block; width: 100%; font-size: 21px; padding: 16px 10px; border-radius: 16px; margin: 8px 0; }
  .ok { background: #1f9d55; border-color: #3fe08f; }
  .bad { background: #b3262e; border-color: #ff6b6b; }
  .warn { background: #ffc400; border-color: #ffc400; color: #1a1a1a; }
  .on { background: #1f9d55; border-color: #3fe08f; }
  .row { overflow: hidden; }
  .half { float: left; width: 48%; margin: 4px 1%; min-height: 60px; border-radius: 16px; }
  .third { float: left; width: 31.3%; margin: 4px 1%; min-height: 60px; border-radius: 16px; }
  .top { overflow: hidden; margin-bottom: 8px; }
  .top a { float: left; padding-top: 8px; }
  .top button { float: right; font-size: 13px; padding: 5px 10px; margin: 0; }
  .howto { background: #2a2312; border: 2px solid #ffc400; border-radius: 16px; padding: 12px 16px; margin-bottom: 14px; }
  .howto b.t { color: #ffc400; display: block; margin-bottom: 6px; }
  .howto li { margin: 4px 0; }
  .howto em { color: #ffc400; font-style: normal; font-weight: bold; }
  .balls { text-align: center; margin: 6px 0 10px; }
  .ball { display: inline-block; vertical-align: middle; width: 130px; height: 130px; border-radius: 50%; background: #ffc400; color: #1a1a1a; text-align: center; margin: 0 8px; }
  .ball small { display: block; font-size: 18px; font-weight: bold; padding-top: 22px; }
  .ball b { display: block; font-size: 50px; line-height: 1; }
  .ball.prev { width: 86px; height: 86px; background: #f0dfa6; }
  .ball.prev small { padding-top: 12px; font-size: 14px; }
  .ball.prev b { font-size: 30px; }
  .chips span { display: inline-block; padding: 3px 10px; margin: 2px; border-radius: 99px; border: 1px solid #3a3470; font-size: 15px; }
  .win { background: #1f9d55; border-radius: 16px; padding: 12px; margin: 10px 0; text-align: center; }
  .win h3 { margin: 0 0 6px; font-size: 22px; }
  .win b { display: block; font-size: 22px; background: rgba(0, 0, 0, .2); border-radius: 10px; padding: 8px; margin: 6px 0; }
  .now { padding: 10px 14px; border: 2px solid #ffc400; border-radius: 14px; margin: 8px 0; background: rgba(255, 196, 0, .08); }
  .now small { color: #ffc400; font-weight: bold; display: block; }
  .now b { font-size: 22px; }
  .q { background: #120f24; border-radius: 12px; padding: 12px; margin: 8px 0; font-size: 19px; }
  .a { color: #3fe08f; font-weight: bold; margin-top: 6px; }
  .item { padding: 9px 0; border-bottom: 1px solid #3a3470; overflow: hidden; }
  .item .r { float: right; }
  .item .r button { font-size: 14px; padding: 6px 10px; margin: 0 0 0 4px; }
  .plan { border: 2px solid #ffc400; border-radius: 14px; padding: 12px; margin-bottom: 10px; background: rgba(255, 196, 0, .08); overflow: hidden; }
  .plan .slots { float: left; width: 58%; }
  .plan .slots span { display: block; padding: 5px 10px; margin: 3px 0; border-radius: 10px; border: 1px dashed #5a54a0; font-size: 15px; }
  .plan .slots span.done { border: 1px solid #3fe08f; background: rgba(63, 224, 143, .15); }
  .plan .count { float: right; width: 38%; text-align: center; color: #ffc400; font-weight: bold; }
  .plan .count b { display: block; font-size: 34px; color: #fff; margin: 4px 0; }
  .plan .count button { padding: 6px 14px; }
  .tabs2 { width: 100%; border: 2px solid #5a54a0; border-radius: 14px; margin: 4px 0 10px; overflow: hidden; }
  .tabs2 button { float: left; width: 50%; height: 54px; margin: 0; border: 0; border-radius: 0; padding: 0 4px; background: #1d1838; color: #a9a3cf; line-height: 1.15; overflow: hidden; }
  .tabs2 button.on { background: #ffc400; color: #1a1a1a; }
  .tabs2.t3 button { width: 33.333%; font-size: 15px; }
  .modes { overflow: hidden; margin: 6px 0 10px; }
  .modes button.mode { float: left; width: 32%; margin: 0 2% 0 0; height: 110px; border-radius: 18px; font-size: 18px; font-weight: bold; border: 2px solid #5a54a0; }
  .modes button.mode:last-child { margin-right: 0; }
  .modes button.mode.on { background: #ffc400; color: #1a1a1a; border-color: #ffc400; }
  .modes.lobby { margin-top: 24px; }
  .modes.lobby button.mode { float: none; display: block; width: 100%; margin: 0 0 16px; height: 140px; font-size: 26px; }
  .gvnow { text-align: center; color: #ffc400; font-weight: bold; font-size: 18px; margin: 6px 0 10px; }
  .gvwin { text-align: center; color: #ffc400; font-weight: bold; font-size: 22px; margin: 6px 0 10px; }
  .gvhelp { text-align: center; color: #a9a3cf; font-weight: bold; margin: 6px 0 10px; }
  .gvrow { position: relative; overflow: hidden; margin: 0 0 6px; padding: 10px 12px; border-radius: 10px; border: 1px solid #3a3466; background: #1d1838; font-weight: bold; }
  .gvrow .bar { position: absolute; left: 0; top: 0; bottom: 0; opacity: .45; }
  .gvrow span, .gvrow b { position: relative; }
  .gvrow b { float: right; }
  .gvrow.dim { opacity: .45; }
  .gvrow.win, .gvrow.sel { border-color: #ffc400; }
  .sec { text-align: center; color: #a9a3cf; font-size: 13px; font-weight: bold; letter-spacing: 1px; margin: 14px 0 4px; }
  .game { float: left; width: 48%; margin: 4px 1%; border-radius: 16px; padding: 14px 6px; min-height: 76px; }
  .game { height: 96px; overflow: hidden; }
  .game.cur { border: 3px solid #ffc400; }
  .game.played { opacity: .55; }
  .grid75 { overflow: hidden; }
  .grid75 .l { float: left; width: 100%; font-weight: bold; color: #ffc400; margin-top: 6px; }
  .grid75 button { float: left; width: 12.5%; padding: 8px 0; margin: 1px 0; border-radius: 8px; font-size: 15px; }
  .home { text-align: center; padding-top: 20px; }
  .create { display: block; padding: 28px 10px; border-radius: 24px; font-size: 26px; font-weight: bold; color: #fff; text-decoration: none; background: #ff7a1a; margin: 18px 0 10px; text-align: center; }
  .create.open { background: #1f9d55; }
  .center { text-align: center; }
  #msg { position: fixed; left: 10px; right: 10px; bottom: 10px; background: #000; color: #ffc400; padding: 12px; border-radius: 12px; font-size: 16px; display: none; text-align: center; z-index: 9; }
</style>
</head>
<body>
<div id="app"></div>
<div id="msg"></div>
<script>
var token = '';
try { token = window.localStorage.getItem('adminToken') || ''; } catch (e) { token = ''; }
var offset = 0;
var V = { frida: 'Frida', tobalaba: 'Tobalaba', kennedy: 'Kennedy' };
var BINGO_HOWTO = ['Todos juegan desde las mesas, con su cartón en el celular.', 'Gana quien complete primero la <em>figura</em>.', 'Empate: sorteo.'];
var ROSCO_HOWTO = ['3 participantes.', 'Todos juegan desde las mesas.', '<em>Premio mayor</em> para el que gana El Rosco.', '<em>Premio especial</em> para el ganador del público que juega la Trivia del Rosco.'];
var LINES = [['linea', 'Línea (cualquiera)'], ['horizontal', 'Línea horizontal'], ['vertical', 'Línea vertical'], ['diagonal', 'Diagonal'], ['dos-lineas', 'Dos líneas']];
var SHAPES = [['esquinas', 'Cuatro esquinas'], ['sello', 'Sello (2×2 en una esquina)'], ['cruz', 'Cruz'], ['marco', 'Marco'], ['cuadro', 'Cuadro central'], ['diamante', 'Diamante'], ['piramide', 'Pirámide'], ['piramide-inv', 'Pirámide invertida'], ['reloj', 'Reloj de arena'], ['corazon', 'Corazón'], ['estrella', 'Estrella'], ['lleno', 'Cartón lleno']];
var LETTERS = []; (function () { var l = 'abcdefghijklmnopqrstuvwxyz'; for (var i = 0; i < l.length; i++) LETTERS.push([l.charAt(i), 'Figura ' + l.charAt(i).toUpperCase()]); })();
var STAGES = [['bingo', '🎱 Bingo'], ['sorteo', '🎲 Sorteo'], ['rueda', '🎡 El Rosco'], ['qr', '📱 QR en pantalla completa'], ['karaoke', '🎤 Karaoke'], ['show', '⭐ Show'], ['voto', '🗳️ Votación'], ['insta', '📸 Instagram'], ['none', '⬛ Nada']];

function $(id) { return document.getElementById(id); }
function h(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
var msgT = null;
function toast(t) { var m = $('msg'); m.innerHTML = h(t); m.style.display = t ? 'block' : 'none'; clearTimeout(msgT); if (t) msgT = setTimeout(function () { m.style.display = 'none'; }, 4000); }
function api(metodo, ruta, datos, listo) {
  var x = new XMLHttpRequest();
  x.open(metodo, ruta, true);
  x.setRequestHeader('Content-Type', 'application/json');
  if (token) x.setRequestHeader('x-admin', token);
  x.timeout = 30000;
  x.onreadystatechange = function () {
    if (x.readyState !== 4) return;
    var r = null;
    try { r = JSON.parse(x.responseText); } catch (e) { r = null; }
    if (r && r.now) offset = r.now - new Date().getTime();
    if (x.status === 401 && ruta.indexOf('/api/login') < 0) { token = ''; go('#/login'); return; }
    if (listo) listo(x.status >= 200 && x.status < 300 ? null : ((r && r.error) || 'Sin conexión, intenta de nuevo'), r);
  };
  x.ontimeout = function () { if (listo) listo('Sin conexión, intenta de nuevo', null); };
  x.send(datos ? JSON.stringify(datos) : null);
}
// Acción y volver a leer la pantalla actual
function act(metodo, ruta, datos, texto) { toast('Guardando…'); api(metodo, ruta, datos, function (err) { toast(err || texto || ''); refresh(); }); }
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
function btn(texto, a, extra, cls, off) { return '<button type="button" class="' + (cls || '') + '" data-a="' + a + '"' + (extra || '') + (off ? ' disabled' : '') + '>' + texto + '</button>'; }
function d(k, v) { return ' data-' + k + '="' + h(v) + '"'; }
function howto(title, lines) { var o = '<div class="howto"><b class="t">📢 Instrucciones · ' + h(title) + '</b><ul style="margin:0;padding-left:22px">'; for (var i = 0; i < lines.length; i++) o += '<li>' + lines[i] + '</li>'; return o + '</ul></div>'; }
function clock(ms) { ms = Math.max(0, ms); var s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
function ord(n) { return n + '.º lugar'; }
function topBar(back) { return '<div class="top">' + (back ? '<a href="' + back[0] + '">← ' + back[1] + '</a>' : '') + '<button type="button" onclick="location.reload()">↻ Refrescar</button></div>'; }
function foot() { return '<p class="center" style="margin-top:22px"><a class="btn" href="#/control">🎛️ Centro de control</a></p>'; }
function bingoName(n) { return String(n || '').replace(/^Los Juegos de /, 'El Bingo de '); }
function letra(st, v) { var hs = String(st.headers || 'BINGO'); for (var c = 0; c < 5; c++) if (v <= Math.floor(((c + 1) * st.values) / 5)) return hs.charAt(c); return hs.charAt(4); }
function conLetra(st, v) { return st.format === 'numbers' ? letra(st, v) + ' ' + v : String(v); }
function figName(id) { var all = LINES.concat(SHAPES, LETTERS); for (var i = 0; i < all.length; i++) if (all[i][0] === id) return all[i][1]; return id; }
function figPicker(sel) {
  var o = '<select id="fig">';
  var grp = function (name, list) { o += '<optgroup label="' + name + '">'; for (var i = 0; i < list.length; i++) o += '<option value="' + list[i][0] + '"' + (list[i][0] === sel ? ' selected' : '') + '>' + h(list[i][1]) + '</option>'; o += '</optgroup>'; };
  grp('Líneas', LINES); grp('Figuras', SHAPES); grp('Letras', LETTERS);
  return o + '</select>';
}

// ---------- Datos compartidos ----------
var S = { sala: null, draw: null, foldOpen: false, navMode: null };
function sala() { return S.sala && S.sala.length ? S.sala[0] : null; }

// ---------- Menú de juegos (igual al de abajo de cada panel) ----------
var GAMES = [['bingo', '🎱', 'Bingo'], ['rosco', '🎡', 'El Rosco'], ['festival', '🎤', 'El Festival'], ['objeto', '🗳️', 'El objeto más extraño']];
function festName() { var s = sala(); return 'El Festival de ' + ((s && V[s.theme]) || 'Frida'); }
function gameName(k) { return k === 'festival' ? festName() : k === 'rosco' ? 'El Rosco' : k === 'objeto' ? 'El objeto más extraño' : 'Bingo'; }
function gameIcon(k) { for (var i = 0; i < GAMES.length; i++) if (GAMES[i][0] === k) return GAMES[i][1]; return ''; }
// Cómo se elige el juego (pedido de Cote, 21 nov): «Manual», «Por sorteo» o «Por votación»
function howOf(g) { return g ? (g.how || (g.free ? 'manual' : 'sorteo')) : 'sorteo'; }
// Votación del juego: 30 s, gana el que pasa la mitad de los votos; si no, segunda vuelta entre los 2 primeros
var GVC = { bingo: '#ff2e93', rosco: '#9b6bff', festival: '#ffc400', objeto: '#19d6b0' };
function gvPct(n, t) { return t ? (n * 100) / t : 0; }
function gvFmt(p) { var r = Math.round(p); return (r === 50 && p !== 50 ? p.toFixed(1).replace('.', ',') : r) + '%'; }
function votos(n) { return n + (n === 1 ? ' voto' : ' votos'); }
function gvHtml() {
  var g = S.gv;
  if (!g) return '<p class="gvhelp">Cargando la votación…</p>';
  var opts = g.options && g.options.length ? g.options : ['bingo', 'rosco', 'festival', 'objeto'];
  var rows = '';
  for (var i = 0; i < opts.length; i++) {
    var k = opts[i]; var n = (g.counts || {})[k] || 0; var p = gvPct(n, g.total);
    var cls = g.phase === 'done' ? (k === g.winner ? 'win' : 'dim') : (g.phase === 'result' && g.runoff ? (g.runoff.indexOf(k) >= 0 ? 'sel' : 'dim') : '');
    rows += '<div class="gvrow ' + cls + '"><div class="bar" style="width:' + p.toFixed(1) + '%;background:' + GVC[k] + '"></div><b>' + gvFmt(p) + ' · ' + votos(n) + '</b><span>' + gameIcon(k) + ' ' + h(gameName(k)) + '</span></div>';
  }
  var cancel = '<div class="center">' + btn('✖ Cancelar votación', 'gvReset', '', '') + '</div>';
  if (g.phase === 'voting') return '<p class="gvnow">🗳️ ' + (g.round === 2 ? 'Segunda vuelta' : 'Votación abierta') + ' · quedan ' + clock(g.until - (new Date().getTime() + offset)) + ' · ' + votos(g.total) + '</p>' + rows + btn('🗳️ Votando…', 'none', '', 'big primary', true) + cancel;
  if (g.phase === 'result' && g.empty) return '<p class="gvnow">Nadie votó.</p>' + btn('🗳️ Repetir votación (30 s)', 'gvStart', '', 'big primary') + cancel;
  if (g.phase === 'result' && g.runoff) return '<p class="gvnow">Nadie superó el 50%. Segunda vuelta: ' + gameIcon(g.runoff[0]) + ' ' + h(gameName(g.runoff[0])) + ' y ' + gameIcon(g.runoff[1]) + ' ' + h(gameName(g.runoff[1])) + (g.tie2 ? ' (empate en el 2.º lugar: se sorteó)' : '') + '.</p>' + rows + btn('🗳️ Iniciar segunda vuelta (30 s)', 'gvStart', '', 'big primary') + cancel;
  if (g.phase === 'done' && g.winner) return '<p class="gvwin">🏆 Ganó ' + gameIcon(g.winner) + ' ' + h(gameName(g.winner)) + (g.tie ? ' (empate: se decidió por sorteo)' : '') + '</p>' + rows + btn('▶ Ir a ' + gameIcon(g.winner) + ' ' + h(gameName(g.winner)), 'gvGo', d('g', g.winner), 'big primary') + '<div class="center">' + btn('🗳️ Nueva votación (30 s)', 'gvStart', '', '') + '</div>';
  return '<p class="gvhelp">El público elige el próximo juego desde su celular, en 30 segundos. Gana el juego con más de la mitad de los votos; si ninguno lo logra, hay segunda vuelta entre los 2 primeros.</p>' + btn('🗳️ Iniciar votación (30 s)', 'gvStart', '', 'big primary');
}
// Menú de juegos (pedido de Cote, 21 nov): tres botones grandes, «Manual», «Por sorteo» y «Por votación», y nada más;
// al tocar uno se despliega lo de esa modalidad en su momento. En el lobby (lobby = true) no van las otras actividades.
function nav(current, inGame, lobby) {
  var g = S.draw;
  var folded = inGame && !S.foldOpen;
  if (folded) return '<button type="button" class="big" data-a="unfold">▸ Ver otros juegos y actividades</button>';
  var how = howOf(g);
  var full = g ? g.list.length >= g.total : false;
  var ready = !!g && how === 'sorteo' && !full && g.ready && (!g.last || g.ready.at > g.last.at);
  // Se despliega sola la modalidad que tiene algo a medio hacer: un sorteo iniciado o una votación abierta o con segunda vuelta
  if (!S.navMode && ready) S.navMode = 'sorteo';
  if (!S.navMode && how === 'votacion' && S.gv && (S.gv.phase === 'voting' || (S.gv.phase === 'result' && S.gv.runoff))) S.navMode = 'votacion';
  var open = S.navMode;
  var o = '<div class="modes' + (lobby ? ' lobby' : '') + '">' + btn('👆<br>Manual', 'drawMode', d('how', 'manual'), 'mode' + (open === 'manual' ? ' on' : '')) +
    btn('🎲<br>Por sorteo', 'drawMode', d('how', 'sorteo'), 'mode' + (open === 'sorteo' ? ' on' : '')) + btn('🗳️<br>Por votación', 'drawMode', d('how', 'votacion'), 'mode' + (open === 'votacion' ? ' on' : '')) + '</div>';
  var games = function (note) {
    var r = '<div class="row">';
    for (var k = 0; k < GAMES.length; k++) {
      var gk = GAMES[k][0];
      var played = note && g && g.played && g.played.indexOf(gk) >= 0;
      r += btn(GAMES[k][1] + '<br>' + h(gameName(gk)) + (played ? '<br><small style="color:#3fe08f">fuera del próximo sorteo</small>' : ''), 'game', d('g', gk), 'game' + (gk === current ? ' cur' : '') + (played ? ' played' : ''));
    }
    return r + '</div>';
  };
  if (open === 'manual') o += '<p class="center" style="color:#ffc400;font-weight:bold;margin:4px 0">👆 Toca el siguiente juego</p>' + games(false);
  if (open === 'votacion') o += '<div id="gvbox">' + gvHtml() + '</div>';
  if (open === 'sorteo' && g) {
    if (!g.list.length && !ready) {
      o += '<div class="plan"><div class="slots">';
      for (var i = 0; i < g.total; i++) o += '<span>' + (i + 1) + '.º · 🔒</span>';
      o += '</div><div class="count">¿Cuántos juegos vamos a sortear?<b>' + g.total + '</b>' + btn('−', 'total', d('n', g.total - 1), '', g.total <= 1) + btn('+', 'total', d('n', g.total + 1), '', g.total >= 10) + '</div></div>';
    }
    o += btn(full ? '✔ Ya se sortearon los ' + g.total + ' juegos' : ready ? '🎰 Girar la tómbola · ' + (g.list.length + 1) + '.º juego' : '🎲 Iniciar sorteo del ' + (g.list.length + 1) + '.º juego (de ' + g.total + ')', 'draw', '', 'big ' + (ready ? 'warn' : 'primary'), full);
    o += '<div class="center">' + btn('↩️ Deshacer', 'undo', '', '', !g.undoable) + '</div>';
    if (ready) o += '<p class="center" style="color:#ffc400;font-weight:bold;margin:4px 0">…o toca un juego para elegirlo directo, sin tómbola</p>' + games(true);
  }
  if (!lobby) {
    o += '<div class="sec">OTRAS ACTIVIDADES</div><div class="row">' +
      btn('⭐<br>Show', 'stage', d('s', 'show'), 'game') + btn('🎤<br>Karaoke', 'goKaraoke', '', 'game' + (current === 'karaoke' ? ' cur' : '')) +
      btn('📸<br>Instagram', 'stage', d('s', 'insta'), 'game') + btn('📱<br>QR en pantalla completa', 'stage', d('s', 'qr'), 'game') + '</div>';
  }
  return o;
}
var goTimer = null;
function toGame(k) {
  if (k === 'bingo') { var s = sala(); if (!s) { go('#/'); return; } api('GET', '/api/sessions/' + s.id + '/host/state', null, function (err, st) { if (!err && st && st.winConfirmed) go('#/ronda'); else if (!err && st && !st.started) go('#/figura'); else { api('POST', '/api/stage', { show: 'bingo' }); go('#/bingo'); } }); return; }
  if (k === 'rosco') { go('#/sorteoctl'); return; }
  go('#/' + k);
}

// ---------- Vistas ----------
var views = {};
var poll = null; var tick = null;

var manual = false;
views.bingo = function () {
  var load = function () {
    api('GET', '/api/current', null, function (err, r) {
      S.sala = r ? r.sessions : null;
      var s = sala();
      if (!s) { go('#/'); return; }
      api('GET', '/api/gamedraw', null, function (e1, g) { S.draw = g; });
      api('GET', '/api/sessions/' + s.id + '/host/state', null, function (e2, st) {
        if (e2 || !st || location.hash !== '#/bingo') return;
        if (!st.started && !st.winConfirmed) { go('#/figura'); return; } // el bingo empieza eligiendo la figura
        var o = topBar(['#/', 'Inicio']);
        if (st.winConfirmed) { o += nav('bingo', false) + foot(); render(o); return; } // con el ganador aceptado, solo lo que viene
        var mins = Math.max(0, Math.round((st.expires - new Date().getTime() - offset) / 60000));
        o += '<div class="panel"><h1>' + h(bingoName(st.name)) + '</h1><div class="muted">Ronda ' + st.round + ' · ' + st.players + ' participantes · ' + (st.players * st.cardsPerPlayer) + ' de ' + st.totalCards + ' cartones repartidos · quedan ' + Math.floor(mins / 60) + ' h ' + (mins % 60) + ' min</div><p style="margin:8px 0 0">Figura: <b>' + h(figName(st.patterns[0])) + '</b></p></div>';
        if (!st.drawn.length) o += howto('Bingo', BINGO_HOWTO);
        var n = st.drawn.length;
        o += '<div class="panel"><div class="balls"><span class="ball"><small>' + (n ? letra(st, st.drawn[n - 1]) : '') + '</small><b>' + (n ? st.drawn[n - 1] : '—') + '</b></span><span class="ball prev"><small>' + (n > 1 ? letra(st, st.drawn[n - 2]) : '') + '</small><b>' + (n > 1 ? st.drawn[n - 2] : '—') + '</b></span><div class="muted">VALOR ACTUAL · ANTERIOR</div></div>';
        // Ganadores
        var w = []; var seen = {};
        for (var j = 0; j < st.results.length; j++) { var rr = st.results[j]; if (rr.validated && !rr.dismissed && !seen[rr.cardNo]) { seen[rr.cardNo] = 1; w.push(rr); } }
        if (w.length) {
          o += '<div class="win"><h3>🏆 ' + (w.length === 1 ? '¡HAY UN GANADOR!' : '¡HAY ' + w.length + ' GANADORES!') + '</h3>';
          for (var k = 0; k < w.length; k++) o += '<b>' + h(w[k].name) + '<br><small>Cartón #' + (st.startNumber + w[k].cardNo - 1) + (w[k].place ? ' · 📍 ' + h(w[k].place) : '') + '</small></b>';
          var tieDone = st.tieWinner && new Date().getTime() + offset - st.tieWinner.at >= st.rollMs;
          if (w.length > 1 && !st.tieWinner) o += '<p>Hay un empate: primero desempata por sorteo.</p>' + btn('🎲 Desempatar por sorteo', 'tieBingo', '', 'big warn');
          else if (w.length > 1 && !tieDone) o += '<p>Sorteando el desempate en pantalla…</p>';
          else {
            if (st.tieWinner) o += '<p>Ganador del desempate: <b>' + h(st.tieWinner.name) + '</b></p>' + btn('🎲 Volver a desempatar', 'tieBingo', '');
            o += '<div class="row">' + btn('✔ Confirmar ganador', 'host', d('x', 'confirmwin'), 'half ok') + btn('▶ Seguir jugando', 'host', d('x', 'keepplaying'), 'half') + '</div>';
          }
          o += '</div>';
        }
        o += '<div class="center">' + btn(st.bigQr ? '📱 QR grande en pantalla: quitar' : '📱 Mostrar QR grande en pantalla', 'bigqr', d('on', st.bigQr ? '' : '1')) + '</div>';
        o += btn('Generar un número', 'host', d('x', 'draw'), 'big primary', w.length > 0);
        o += '<div class="center">' + btn('Selección manual', 'manual', '', manual ? 'on' : '') + '</div>';
        if (manual) {
          o += '<div class="grid75">';
          var per = Math.floor(st.values / 5);
          for (var c = 0; c < 5; c++) { o += '<span class="l">' + h(String(st.headers).charAt(c)) + '</span>'; for (var v = c * per + 1; v <= (c + 1) * per; v++) o += btn(v, 'pickNum', d('v', v), st.drawn.indexOf(v) >= 0 ? 'on' : '', st.drawn.indexOf(v) >= 0); }
          o += '</div>';
        }
        o += '</div><div class="panel"><h2>Orden de salida</h2><div class="chips">';
        for (var q = 0; q < st.drawn.length; q++) o += '<span>' + h(conLetra(st, st.drawn[q])) + '</span>';
        if (!st.drawn.length) o += '<span class="muted">Aún no se ha generado ningún valor.</span>';
        o += '</div></div>' + nav('bingo', st.drawn.length > 0) + foot();
        render(o);
      });
    });
  };
  load(); poll = setInterval(function () { if (!document.activeElement || document.activeElement.tagName !== 'SELECT') load(); }, 3000);
};

// Juegos: la sala parte aquí (sin bingo): arriba la sala y el QR de entrada; abajo el menú con las pestañas

    api('GET', '/api/current', null, function (err, r) {
      S.sala = r ? r.sessions : null; var s = sala();

      api('GET', '/api/gamedraw', null, function (e1, g) {
        S.draw = g;

          // Pedido de Cote (21 nov): al crear la sala, tres botones y nada más (Manual, Por sorteo, Por votación)
          render(topBar(['#/', 'Inicio']) + (cur ? '<a class="btn big primary" href="' + to + '">▶ Volver al juego en curso: ' + gameIcon(cur.game) + ' ' + h(gameName(cur.game)) + '</a>' : '') + nav('', !!cur, true) + foot());
        });
      });

views.sorteoctl = function () {
  if (S.fx !== location.hash) { S.fx = location.hash; api('POST', '/api/raffle/open', null); } // solo al entrar (no al refrescar)
  var load = function () {
    api('GET', '/api/gamedraw', null, function (e0, g) { S.draw = g; });
    api('GET', '/api/raffle', null, function (e1, r) {
      api('GET', '/api/people', null, function (e2, p) {
        if (!r || !p) return;
        var picked = r.picked || []; var full = picked.length >= 3;
        var free = 0; for (var i = 0; i < p.connected.length; i++) if (picked.indexOf(p.connected[i]) < 0) free++;
        var o = topBar(['#/', 'Inicio']) + '<h1>Sorteo de concursantes</h1><div class="panel">' +
          btn(full ? '✔ Cargar El Rosco con los 3' : '🎲 Sortear concursante (' + (picked.length + 1) + '.º de 3)', full ? 'loadRosco' : 'raffleDraw', '', 'big primary', !full && !free) +
          '<h2>Concursantes elegidos</h2>';
        for (var k = 0; k < picked.length; k++) o += '<div class="item"><b>' + (k + 1) + '. ' + h(picked[k]) + '</b><span class="r">' + btn('✏️ Editar', 'rename', d('n', picked[k])) + btn('Quitar', 'unpick', d('n', picked[k])) + '</span></div>';
        if (!picked.length) o += '<p class="muted">Todavía no has sorteado a nadie.</p>';
        if (picked.length && !full) o += btn('✔ Cargar El Rosco con ' + picked.length, 'loadRosco', '');
        o += btn('Empezar de nuevo', 'raffleReset', '') + '</div>';
        o += '<div class="panel"><b>▸ ' + p.connected.length + ' conectados ahora · ' + p.names.length + ' en la lista</b></div>';
        o += nav('rosco', false) + foot();
        render(o);
      });
    });
  };
  load(); poll = setInterval(load, 4000);
};

function stepOf(w) { var c = w.players[w.turn]; return !c.active || w.winner || w.tie ? 0 : w.runningSince ? 3 : w.onScreen ? 2 : 1; }
function roscoLeft(w) { var c = w.players[w.turn]; return w.runningSince ? c.remainingMs - (new Date().getTime() + offset - w.runningSince) : c.remainingMs; }
var W = null;
views.rosco = function () {
  var load = function () {
    api('GET', '/api/gamedraw', null, function (e0, g) { S.draw = g; });
    api('GET', '/api/wheels', null, function (e1, list) {
      if (!list || !list.length) { go('#/sorteoctl'); return; }
      api('GET', '/api/wheels/' + list[0].id, null, function (e2, w) {
        if (!w) return; W = w;
        var c = w.players[w.turn]; var step = stepOf(w);
        var started = !!w.runningSince; for (var i = 0; i < w.players.length; i++) for (var j = 0; j < w.players[i].status.length; j++) if (w.players[i].status[j] !== 'pending') started = true;
        var o = topBar(['#/', 'Inicio']);
        if (!started && !w.winAccepted) o += howto('El Rosco', ROSCO_HOWTO);
        o += '<div class="panel">';
        if (!w.winAccepted) {
          o += '<h1>' + h(w.name) + '</h1><div class="muted">' + (w.winner ? '🏆 Gana ' + h(w.winner.name) + ' (' + w.winner.hits + ' ✔ · ' + w.winner.misses + ' ✘)' : w.tie ? 'Empate' : 'Turno de ' + h(c.name)) + '</div>';
          o += '<div class="now"><small>Letra · reloj</small><b style="font-size:30px">' + h(c.active ? w.letters[c.current] : '—') + '</b> · <b id="rclock">' + clock(roscoLeft(w)) + '</b> <span class="muted">' + c.hits + ' ✔ · ' + c.misses + ' ✘</span></div>';
          var q = ((w.questions || [])[w.turn] || [])[c.current] || {};
          o += '<div class="q">' + (!c.active ? (w.tie ? (w.tie.rolling ? '<b>Sorteando el desempate…</b> Mira la pantalla.' : '<b>Hay un empate</b> entre ' + h(w.tie.names.join(' y ')) + '. Primero desempata por sorteo.') : 'Juego terminado.') :
            !w.runningSince ? '<span class="muted">Pulsa «Iniciar pregunta» para ver la pregunta de esta letra.</span>' : h(q.q || '') + (q.a ? '<div class="a">Respuesta: ' + h(q.a) + '</div>' : '')) + '</div>';
          if (w.tie && !w.tie.rolling) o += btn('🎲 Desempatar por sorteo', 'tieRosco', '', 'big warn');
          if (w.winner && !w.winAccepted) o += btn('✔ Aceptar ganador', 'wheel', d('x', 'acceptwin'), 'big ok');
          o += btn(w.onScreen ? '📺 Rosco en pantalla ✓' : '📺 Poner rosco en pantalla', 'roscoShow', '', 'big', step !== 1);
          o += btn(w.runningSince ? '⏱ Pregunta en curso' : '▶ Iniciar pregunta', 'wheel', d('x', 'start'), 'big primary', step !== 2);
          o += '<div class="row">' + btn('✔ Correcta', 'wheel', d('x', 'hit'), 'third ok', step !== 3) + btn('✘ Incorrecta', 'wheel', d('x', 'miss'), 'third bad', step !== 3) + btn('↷ Pasa', 'wheel', d('x', 'pass'), 'third warn', step !== 3) + '</div>';
          o += '<div class="row">' + btn('↶ Deshacer', 'wheel', d('x', 'undo'), '', !w.canUndo) + (w.players.length > 1 ? btn('Cambiar turno', 'wheel', d('x', 'turn')) : '') + btn('Reiniciar', 'roscoReset', '', 'bad') + (w.fromBank ? btn('↻ Preguntas nuevas', 'newQ') : '') + '</div>';
        } else {
          o += '<p style="background:#1f9d55;border-radius:12px;padding:10px;text-align:center;font-weight:bold">✔ Ganador aceptado</p>';
          if (!w.crowdWinner) o += btn('🏅 Mostrar ganador de la Trivia del Rosco', 'wheel', d('x', 'crowdwin'), 'big primary');
          else o += '<div class="now"><small>Ganó la Trivia del Rosco</small><b>' + h(w.crowdWinner.name) + '</b><br><span class="muted">' + w.crowdWinner.score + ' puntos · ' + w.crowdWinner.hits + ' aciertos</span></div>';
        }
        o += btn(w.rank ? '🏅 Recoger ranking (está en pantalla)' : '🏅 Desplegar ranking de la Trivia (top 10)', 'roscoRank', '', 'big' + (w.rank ? ' on' : ''));
        if (w.rank) { o += '<ol>'; for (var r = 0; r < w.rank.length; r++) o += '<li><b>' + h(w.rank[r].name) + '</b> · ' + w.rank[r].score + ' pts</li>'; o += '</ol>'; }
        o += '</div>' + nav('rosco', started && !w.winAccepted) + foot();
        render(o);
      });
    });
  };
  load(); poll = setInterval(load, 3000);
  tick = setInterval(function () { var e = $('rclock'); if (e && W) e.innerHTML = clock(roscoLeft(W)); }, 1000);
};

function votoView(want) {
  var mode = want === 'festival' ? 'karaoke' : 'objeto';
  if (S.fx !== location.hash) { S.fx = location.hash; api('POST', '/api/stage', { show: 'voto' }); } // solo al entrar (no al refrescar: no pisa un sorteo en pantalla)
  var checked = false;
  var load = function () {
    api('GET', '/api/current', null, function (e0, r0) { S.sala = r0 ? r0.sessions : null; });
    api('GET', '/api/gamedraw', null, function (e1, g) { S.draw = g; });
    api('GET', '/api/vote/host', null, function (err, st) {
      if (!st) return;
      if (!checked && st.mode !== mode && !st.players.length && st.phase === 'voting') { checked = true; api('POST', '/api/vote/host', { action: 'mode', mode: mode }, function () { load(); }); return; }
      checked = true;
      var isK = mode === 'karaoke'; var name = isK ? festName() : 'El objeto más extraño';
      var o = topBar(['#/', 'Inicio']);
      if (st.phase === 'winner' && st.mode === mode) { o += nav(want, false) + foot(); render(o); return; } // con ganador, solo lo que viene
      var startedV = st.signup || st.players.length > 0;
      if (st.phase === 'voting' && !startedV && st.mode === mode) o += howto(name, isK ? [st.max + ' participantes cantan. Si se inscriben más, sorteo.', 'Canciones cortas.', 'Todos votan desde las mesas: nota del 1 al 10.', 'Al terminar la votación, se muestran en pantalla <em>5 notas del público al azar</em>, que no determinan el promedio. El promedio se conoce al final del concurso.', 'Gana el mejor <em>promedio</em>.'] : ['Cada participante presenta su objeto.', 'Todos votan desde las mesas: nota del 1 al 10.', 'Gran final entre los dos primeros.']);
      o += '<div class="panel"><h1>' + (isK ? '🎤 ' : '🗳️ ') + h(name) + '</h1>';
      if (st.mode !== mode) o += '<p class="muted">Hay un concurso de «' + h(st.title) + '» en curso</p>' + btn('Empezar ' + h(name) + ' (borra el anterior)', 'voteReset', d('mode', mode), 'big primary');
      else if (st.phase === 'voting') {
        var next = null; var anyDone = false;
        for (var i = 0; i < st.players.length; i++) { if (!st.players[i].done && !next) next = st.players[i]; if (st.players[i].done) anyDone = true; }
        var voted = anyDone || st.onstage || st.open;
        if (!startedV) o += '<p>' + (isK ? '¿Cuántos participantes van a cantar?' : 'Cupos (máximo de participantes)') + ' <b style="font-size:28px">' + st.max + '</b> ' + btn('−', 'vote', d('x', 'max') + d('max', st.max - 1), '', st.max <= 2) + btn('+', 'vote', d('x', 'max') + d('max', st.max + 1), '', st.max >= 30) + '</p>';
        if (st.sample) { o += '<div class="now"><small>Notas al azar en pantalla (sin el promedio)</small>'; for (var sm = 0; sm < st.sample.length; sm++) o += '<b>' + st.sample[sm].note + '</b> <span class="muted">' + h(st.sample[sm].name) + '</span>  '; o += '</div>'; }
        if (st.open) o += '<div class="now"><small>🗳️ Votación abierta · ' + (st.counts[st.open.id] || 0) + ' votos</small><b>' + h(st.open.name) + '</b><br><span class="muted">' + h(st.open.thing) + '</span></div>' + btn('Cerrar votación', 'vote', d('x', 'close'), 'big primary');
        else if (st.signup) o += '<div class="now"><small>📲 Inscripciones abiertas</small>' + st.players.length + ' inscritos</div>' + btn('Cerrar', 'vote', d('x', 'signup'), 'big');
        else if (!st.players.length) o += btn('📲 Abrir inscripciones', 'vote', d('x', 'signup') + d('on', '1'), 'big primary');
        else if (st.overflow) o += btn('🎲 Sortear los ' + st.max + ' que cantan (se inscribieron ' + st.players.length + ')', 'vote', d('x', 'draw'), 'big warn');
        else if (next && st.onstage && st.onstage.id === next.id) o += '<div class="now"><small>' + (isK ? '🎤 En el escenario' : '🗳️ Presentando su objeto') + '</small><b>' + h(next.name) + '</b><br><span class="muted">' + h(next.thing) + '</span></div>' + btn('🗳️ Iniciar votación', 'vote', d('x', 'open') + d('id', next.id), 'big primary');
        else if (next) o += '<div class="now"><small>' + (voted ? 'Ya viene el siguiente participante' : 'Primer participante') + '</small><b>' + h(next.name) + '</b><br><span class="muted">' + h(next.thing) + '</span></div>' + btn('🎤 Iniciar participante', 'vote', d('x', 'present') + d('id', next.id), 'big primary');
        else if (st.players.length >= 2) o += btn('🏁 Pasar a los resultados', 'vote', d('x', 'results'), 'big primary');
        else o += '<p class="muted">Se necesitan al menos 2 participantes.</p>' + btn('📲 Abrir inscripciones otra vez', 'vote', d('x', 'signup') + d('on', '1'), 'big');
        if (st.players.length && !voted && !st.signup) o += '<div class="center">' + btn('Abrir inscripciones otra vez', 'vote', d('x', 'signup') + d('on', '1')) + '</div>';
        for (var k = 0; k < st.players.length; k++) { var p = st.players[k]; var on = st.open && st.open.id === p.id; var up = st.onstage && st.onstage.id === p.id; o += '<div class="item"><span class="r">' + (on ? '🗳️' : up ? '🎤' : p.done ? '<b style="color:#3fe08f">✔ ' + st.counts[p.id] + ' votos</b>' : btn('✕', 'vote', d('x', 'remove') + d('id', p.id))) + '</span><b>' + h(p.name) + '</b><br><span class="muted">' + h(p.thing) + '</span></div>'; }
      } else if (st.phase === 'results') {
        o += '<h2>Resultados</h2>';
        if (st.next) o += '<div class="now"><small>Viene · solo lo ves tú, hasta que lo reveles</small><b>' + ord(st.next.place) + ' · ' + h(st.next.name) + '</b></div>' + btn('Revelar ' + ord(st.next.place), 'vote', d('x', 'reveal'), 'big primary');
        else o += btn(isK ? '🥁 Redoble de tambores: los dos finalistas' : '⚔️ Gran final: abrir votación', 'vote', d('x', 'final'), 'big primary');
        for (var m = st.places.length - 1; m >= 0; m--) o += '<div class="item">' + ord(st.places[m].place) + ' · <b>' + h(st.places[m].name) + '</b></div>';
      } else if (st.phase === 'final') {
        if (isK) o += '<h2>🥁 Redoble de tambores</h2>' + btn('🏆 Revelar al gran ganador', 'vote', d('x', 'winner'), 'big ok');
        else if (st.final.open) o += '<h2>Gran final</h2><p>Recibiendo votos…</p>' + btn('Cerrar votación', 'vote', d('x', 'closefinal'), 'big primary');
        else o += '<h2>Gran final</h2>' + btn('🏆 Revelar quién ganó', 'vote', d('x', 'winner'), 'big ok') + btn('Reabrir votación', 'vote', d('x', 'final'), 'big');
      }
      o += '</div>' + nav(want, startedV && st.phase !== 'winner') + '<p class="center">' + btn('🗑 Nuevo concurso (borra este)', 'voteReset', d('mode', mode), 'bad') + '</p>' + foot();
      render(o);
    });
  };
  load(); poll = setInterval(load, 3000);
}
views.festival = function () { votoView('festival'); };
views.objeto = function () { votoView('objeto'); };

views.karaoke = function () {
  if (S.fx !== location.hash) { S.fx = location.hash; api('POST', '/api/stage', { show: 'karaoke' }); } // solo al entrar (no al refrescar)
  var load = function () {
    api('GET', '/api/gamedraw', null, function (e0, g) { S.draw = g; });
    api('GET', '/api/karaoke/cola', null, function (err, k) {
      if (!k) return;
      var o = topBar(['#/', 'Inicio']) + '<div class="panel"><h1>Karaoke</h1><div class="muted">' + h(k.name) + ' · ' + k.total + ' por cantar</div>';
      if (!k.list.length) o += '<p class="muted">Cuando alguien pida una canción, aparecerá aquí.</p>';
      for (var i = 0; i < k.list.length; i++) {
        var p = k.list[i];
        o += '<div class="item">' + (k.edit && p.id ? '<span class="r">' + btn('▲', 'kar', d('x', 'subir') + d('id', p.id), '', i === 0) + btn('▼', 'kar', d('x', 'bajar') + d('id', p.id), '', i === k.list.length - 1) + btn('✔ Ya cantó', 'kar', d('x', 'cantado') + d('id', p.id), 'ok') + '</span>' : '') +
          '<small style="color:#ffc400">' + (i === 0 ? '🎤 Ahora canta' : i === 1 ? 'Sigue' : (i + 1) + '.') + '</small><br><b>' + h(p.name) + '</b><br><span class="muted">' + h(p.song) + (p.artist ? ' · ' + h(p.artist) : '') + '</span></div>';
      }
      o += '<p>' + btn(k.phone ? '✔ Pedir canciones desde el celular: abierto' : 'Pedir canciones desde el celular: cerrado', 'karPhone', d('on', k.phone ? '' : '1'), k.phone ? 'on' : '') + '</p>';
      o += '<p class="muted">' + (k.edit ? '«Ya cantó», Subir y Bajar también se pueden usar en la app del equipo.' : 'El orden y «Ya cantó» se manejan en la app del equipo. Esta pantalla solo muestra la lista.') + '</p></div>' + nav('karaoke', false) + foot();
      render(o);
    });
  };
  load(); poll = setInterval(load, 5000);
};

views.control = function () {
  var load = function () {
    api('GET', '/api/current', null, function (e0, r) {
      S.sala = r ? r.sessions : null;
      api('GET', '/api/stage', null, function (e1, stg) {
        var show = stg ? stg.show : '';
        var o = topBar(['#/', 'Inicio']) + '<h1>Centro de control</h1><div class="panel"><h2>Sala de juegos abierta</h2>';
        // Ir directo a la sala en juego o crear una (pedido de Cote, 21 nov)
        o += S.sala && S.sala.length ? '<a class="create open" href="#/juegos">▶<br>Ir a la sala en juego: ' + h(S.sala[0].name) + '</a>' : '<a class="create" href="#/nuevo">🎮<br>Crear sala de juegos</a>';
        if (S.sala && S.sala.length) for (var i = 0; i < S.sala.length; i++) o += '<div class="item"><span class="r">' + btn('Cerrar', 'closeSala', d('sid', S.sala[i].id), 'bad') + '</span><b>' + h(S.sala[i].name) + '</b><br><span class="muted">Ronda ' + S.sala[i].round + '</span></div>';
        else o += '<p class="muted">No hay ninguna sala abierta.</p>';
        o += '</div><div class="panel"><h2>En pantalla</h2><p class="muted">La pantalla cambia sola al activar un bingo, lanzar un sorteo o cargar un rosco. Aquí puedes cambiarla a mano.</p><div class="row">';
        for (var k = 0; k < STAGES.length; k++) o += btn(STAGES[k][1], 'stage', d('s', STAGES[k][0]), 'half' + (show === STAGES[k][0] ? ' on' : ''));
        o += '</div></div>';
        render(o);
      });
    });
  };
  load(); poll = setInterval(load, 4000);
};

// ---------- Acciones ----------
var A = {};
A.login = function () {
  toast('Entrando…');
  api('POST', '/api/login', { user: $('user').value, pass: $('pass').value }, function (err, r) {
    if (err) { toast(err); return; }
    token = r.token; try { window.localStorage.setItem('adminToken', token); } catch (e) { /* modo privado */ }
    toast(''); go('#/');
  });
};
A.logout = function () { token = ''; try { window.localStorage.removeItem('adminToken'); } catch (e) { /* nada */ } go('#/login'); };
A.crear = function (el) {
  var v = el.getAttribute('data-v'); var name = 'Los Juegos de ' + V[v];
  toast('Creando los cartones…');
  api('POST', '/api/projects', { name: name, theme: v, count: $('count').value, format: 'numbers', values: 75, headers: 'BINGO', freeCenter: false, startNumber: 1 }, function (err, p) {
    if (err) { toast(err); return; }
    // La sala ya no parte con el bingo (pedido de Cote, 21 nov): se abre de inmediato y se va a Juegos
    api('POST', '/api/projects/' + p.id + '/session', { name: name, theme: v, password: '', cardsPerPlayer: 1, isPublic: true, showName: true, patterns: ['linea'] }, function (e2) {
      if (e2) { toast(e2); api('DELETE', '/api/projects/' + p.id); return; } // si la sala no se abrió, no queda un proyecto suelto
      toast(''); go('#/juegos');
    });
  });
};
A.host = function (el) { var s = sala(); if (s) act('POST', '/api/sessions/' + s.id + '/host/' + el.getAttribute('data-x'), {}); };
A.bigqr = function (el) { var s = sala(); if (s) act('POST', '/api/sessions/' + s.id + '/host/bigqr', { on: !!el.getAttribute('data-on') }); };
A.manual = function () { manual = !manual; refresh(); };
A.pickNum = function (el) { var s = sala(); if (s) act('POST', '/api/sessions/' + s.id + '/host/draw', { value: Number(el.getAttribute('data-v')) }); };
A.tieBingo = function () { var s = sala(); if (s) act('POST', '/api/raffle/tiebreak', { sid: s.id }); };
A.figura = function () {
  var s = sala(); if (!s) return;
  api('POST', '/api/sessions/' + s.id + '/host/patterns', { patterns: [$('fig').value] }, function (err) { if (err) { toast(err); if (/ya empez/.test(err)) go('#/bingo'); return; } api('POST', '/api/stage', { show: 'bingo' }); go('#/bingo'); });
};
A.ronda = function () { var s = sala(); if (s) api('POST', '/api/sessions/' + s.id + '/host/restart', { patterns: [$('fig').value] }, function (err) { if (err) toast(err); else go('#/bingo'); }); };
A.drawMode = function (el) {
  var how = el.getAttribute('data-how');
  clearTimeout(goTimer);
  if (S.navMode === how) { S.navMode = null; refresh(); return; } // tocar la desplegada la vuelve a plegar
  S.navMode = how;
  if (howOf(S.draw) === how) { refresh(); return; }
  if (S.draw) { S.draw.how = how; S.draw.free = how === 'manual'; S.draw.ready = null; } // se despliega al instante
  refresh();
  act('POST', '/api/gamedraw/mode', { how: how });
};
A.gvStart = function () { clearTimeout(goTimer); api('POST', '/api/gamevote/start', null, function (err, r) { if (err) { toast(err); return; } S.gv = r; toast('🗳️ Votación abierta: 30 segundos para votar desde el celular'); refresh(); }); };
A.gvReset = function () { clearTimeout(goTimer); api('POST', '/api/gamevote/reset', null, function (err, r) { if (err) { toast(err); return; } S.gv = r; toast('Votación cancelada'); refresh(); }); };
A.gvGo = function (el) { clearTimeout(goTimer); toGame(el.getAttribute('data-g')); };
A.unfold = function () { S.foldOpen = true; refresh(); };
A.total = function (el) { act('POST', '/api/gamedraw/total', { total: Number(el.getAttribute('data-n')) }); };
A.undo = function () { clearTimeout(goTimer); act('POST', '/api/gamedraw/undo', null, '↩️ Sorteo de juegos: se volvió al paso anterior'); };
A.draw = function () {
  var g = S.draw; if (!g || howOf(g) !== 'sorteo') return;
  var ready = g.ready && (!g.last || g.ready.at > g.last.at);
  if (!ready) { act('POST', '/api/gamedraw/ready', null, 'En pantalla: los juegos que pueden salir. Ahora gira la tómbola o elige un juego directo.'); return; }
  api('POST', '/api/gamedraw', null, function (err, r) {
    if (err) { toast(err); return; }
    toast('🎲 Se está sorteando en pantalla… Salió: ' + gameIcon(r.last.game) + ' ' + gameName(r.last.game));
    S.draw = r; refresh();
    goTimer = setTimeout(function () { toGame(r.last.game); }, 6000); // cuando termina la tómbola en pantalla, el panel pasa a ese juego
  });
};
A.game = function (el) {
  var k = el.getAttribute('data-g'); var g = S.draw;
  // «Manual»: el juego empieza de cero, sin número de la noche
  if (g && howOf(g) === 'manual') { api('POST', '/api/gamedraw/free', { game: k }, function (err) { if (err) { toast(err); return; } toGame(k); }); return; }
  var ready = g && howOf(g) === 'sorteo' && g.list.length < g.total && g.ready && (!g.last || g.ready.at > g.last.at);
  if (ready) { api('POST', '/api/gamedraw/pick', { game: k }, function (err) { if (err) { toast(err); return; } toast('Siguiente juego: ' + gameName(k)); toGame(k); }); return; }
  toGame(k);
};
A.stage = function (el) { var s = el.getAttribute('data-s'); act('POST', '/api/stage', { show: s }, s === 'qr' ? 'QR en pantalla completa' : 'En pantalla'); };
A.goKaraoke = function () { go('#/karaoke'); };
A.raffleDraw = function () { act('POST', '/api/raffle/draw', null, 'Sorteando en pantalla…'); };
A.raffleReset = function () { act('POST', '/api/raffle/reset', null); };
A.unpick = function (el) { act('POST', '/api/raffle/remove', { name: el.getAttribute('data-n') }); };
A.rename = function (el) { var from = el.getAttribute('data-n'); var to = window.prompt('Corrige el nombre:', from); if (to === null || to === from) return; act('POST', '/api/people/rename', { from: from, to: to }, 'Nombre corregido'); };
A.loadRosco = function () { api('GET', '/api/raffle', null, function (e, r) { if (!r) return; api('POST', '/api/wheels', { name: 'El Rosco', players: r.picked }, function (err) { if (err) toast(err); else go('#/rosco'); }); }); };
A.wheel = function (el) { if (W) act('POST', '/api/wheels/' + W.id + '/act', { action: el.getAttribute('data-x') }); };
A.roscoShow = function () { if (W) act('POST', '/api/wheels/' + W.id + '/act', { action: 'show', on: true }); };
A.roscoRank = function () { if (W) act('POST', '/api/wheels/' + W.id + '/act', { action: 'rank', on: !W.rank }); };
A.tieRosco = function () { if (W) act('POST', '/api/wheels/' + W.id + '/tiebreak', null); };
A.roscoReset = function () { if (W && window.confirm('¿Reiniciar el rosco? Se borran aciertos, fallos y relojes.')) act('POST', '/api/wheels/' + W.id + '/act', { action: 'reset' }); };
A.newQ = function () { if (W && window.confirm('¿Cambiar todas las preguntas por otras del banco? El rosco se reinicia.')) act('POST', '/api/wheels/' + W.id + '/newquestions', null); };
A.vote = function (el) {
  var b = { action: el.getAttribute('data-x') };
  if (el.getAttribute('data-max')) b.max = Number(el.getAttribute('data-max'));
  if (el.getAttribute('data-id')) b.id = el.getAttribute('data-id');
  if (el.getAttribute('data-on')) b.on = true;
  act('POST', '/api/vote/host', b);
};
A.voteReset = function (el) {
  if (!window.confirm('¿Borrar este concurso y empezar uno nuevo?')) return;
  var mode = el.getAttribute('data-mode');
  api('POST', '/api/vote/host', { action: 'reset' }, function (err) { if (err) { toast(err); return; } act('POST', '/api/vote/host', { action: 'mode', mode: mode }); });
};
A.kar = function (el) { act('POST', '/api/karaoke/accion', { accion: el.getAttribute('data-x'), id: el.getAttribute('data-id') }, el.getAttribute('data-x') === 'cantado' ? 'Marcado: ya cantó' : ''); };
A.karPhone = function (el) { act('POST', '/api/karaoke/config', { phone: !!el.getAttribute('data-on') }); };
A.closeSala = function (el) { if (window.confirm('¿Cerrar la sala de juegos? Se borran los participantes y los juegos de la noche.')) act('POST', '/api/sessions/' + el.getAttribute('data-sid') + '/host/close', {}, 'Sala cerrada'); };

document.onclick = function (e) {
  var t = e.target || e.srcElement;
  while (t && t !== document && !(t.getAttribute && t.getAttribute('data-a'))) t = t.parentNode;
  if (!t || t === document || t.disabled) return;
  var f = A[t.getAttribute('data-a')];
  if (f) { if (e.preventDefault) e.preventDefault(); f(t); }
};

// Votación del juego: se lee cada segundo mientras está abierta (reloj y votos) y, si el ganador sale mientras el
// panel mira, el panel pasa solo a ese juego (como el sorteo)
var gvT = null; var gvLast = '';
function gvPoll() {
  clearTimeout(gvT);
  if (!token || howOf(S.draw) !== 'votacion') { gvT = setTimeout(gvPoll, 2000); return; }
  api('GET', '/api/gamevote', null, function (err, r) {
    if (r) {
      var prev = S.gv; S.gv = r;
      var box = $('gvbox'); var html = gvHtml();
      if (box && (html !== gvLast || box.innerHTML === '')) { box.innerHTML = html; gvLast = html; }
      if (!box && !S.navMode && (r.phase === 'voting' || (r.phase === 'result' && r.runoff)) && document.querySelector('.modes')) refresh(); // se despliega sola
      if (prev && prev.id === r.id && prev.phase === 'voting' && r.phase === 'done' && r.winner) {
        toast('🗳️ Ganó ' + gameIcon(r.winner) + ' ' + gameName(r.winner) + '. En unos segundos pasamos al juego…');
        clearTimeout(goTimer);
        goTimer = setTimeout(function () { toGame(r.winner); }, 8000);
      }
    }
    gvT = setTimeout(gvPoll, r && r.phase === 'voting' ? 1000 : 2500);
  });
}
gvPoll();

// ---------- Rutas ----------
var refresh = function () {};
function route() {
  clearInterval(poll); clearInterval(tick); poll = null; tick = null;
  var parts = (location.hash || '#/').replace(/^#\/?/, '').split('/');
  var name = parts[0] || 'home';
  if (!token && name !== 'login') { go('#/login'); return; }
  S.foldOpen = false; // como en la plataforma completa: al cambiar de vista, el menú vuelve a plegarse si hay un juego en curso
  S.navMode = null; // al entrar a otra vista, el menú parte con los tres botones
  S.fx = ''; // acciones que cada vista hace una sola vez al entrar
  var v = views[name] || views.home;
  refresh = function () { clearInterval(poll); clearInterval(tick); v(parts[1]); };
  window.scrollTo(0, 0);
  v(parts[1]);
}
window.onhashchange = route;
if (token) api('GET', '/api/me', null, function (err, r) { if (!err && r && r.admin) route(); else { token = ''; go('#/login'); } });
else go('#/login');
</script>
