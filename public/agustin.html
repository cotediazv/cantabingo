<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#120d1d">
<title>Agustín, el pirata</title>
<style>
  html, body { margin: 0; height: 100%; background: #120d1d; overflow: hidden; }
  body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font-family: 'Trebuchet MS', Verdana, Arial, sans-serif; }
  #c { position: absolute; display: block; }
  #pad { display: none; }
  body.playing #pad { display: block; }
  .zone { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; gap: 12px; align-items: flex-end; z-index: 2; }
  #lz { left: calc(14px + env(safe-area-inset-left)); }
  #rz { right: calc(14px + env(safe-area-inset-right)); }
  .b { width: var(--b); height: var(--b); border-radius: 50%; box-sizing: border-box; background: rgba(255,255,255,.16); border: 3px solid rgba(255,255,255,.6); color: #fff; display: flex; align-items: center; justify-content: center; flex-direction: column; font-weight: 900; font-size: calc(var(--b) * .38); line-height: 1; text-shadow: 0 2px 3px rgba(0,0,0,.6); }
  .b small { font-size: calc(var(--b) * .15); margin-top: 3px; letter-spacing: .5px; }
  .b.on { background: rgba(255,210,77,.55); border-color: #ffd24d; }
  #atk { width: calc(var(--b) * 1.25); height: calc(var(--b) * 1.25); font-size: calc(var(--b) * .46); }
  #jmp { margin-bottom: calc(var(--b) * .55); }
  :root { --b: min(17vmin, 96px); }
  body.portrait { --b: min(21vw, 104px); }
  body.portrait .zone { bottom: calc(5vh + env(safe-area-inset-bottom)); }
  #back { display: none; position: fixed; top: calc(10px + env(safe-area-inset-top)); left: calc(10px + env(safe-area-inset-left)); z-index: 3; padding: 8px 14px; border-radius: 20px; background: rgba(18,12,32,.7); border: 2px solid rgba(255,255,255,.6); color: #fff; font-weight: 800; font-size: 16px; text-decoration: none; }
  body.title #back { display: block; }
  #tip { display: none; position: fixed; left: 0; right: 0; text-align: center; color: #ffe7a8; font-size: 15px; font-weight: 700; }
  body.portrait #tip { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="back" href="/#/kids">← KRB Kids</a>
<div id="tip">Gira el celular para verlo más grande</div>
<div id="pad">
  <div class="zone" id="lz"><div class="b" id="bl">◀</div><div class="b" id="br">▶</div></div>
  <div class="zone" id="rz"><div class="b" id="jmp">▲<small>SALTA</small></div><div class="b" id="atk">⚔<small>ESPADA</small></div></div>
</div>
<script>
// «Agustín, el pirata»: Agustín, un pirata con tatuajes, va a buscar a su amada al castillo.
// En cada etapa pelea con sus compañeros de curso que no quieren hacer nada en el colegio.
// Todo se dibuja con canvas (sin imágenes ni sonido). Teclado o botones en pantalla.
(() => {
  'use strict';
  const W = 960, H = 540, G = 468; // G: altura del suelo
  const FONT = "'Trebuchet MS', 'Segoe UI', Verdana, Arial, sans-serif";
  const OUT = '#1c1724';
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const tip = document.getElementById('tip');
  const TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
  let scale = 1, dpr = 1;

  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, k) => a + (b - a) * k;
  const overlap = (a, b) => a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1;

  // ---------- Pantalla ----------
  function layout() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const portrait = TOUCH && vh > vw;
    const areaH = portrait ? Math.max(vh * 0.55, vh - Math.min(vh * 0.4, 300)) : vh;
    scale = Math.min(vw / W, areaH / H);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cw = Math.round(W * scale), ch = Math.round(H * scale);
    const top = Math.round((areaH - ch) / 2);
    cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
    cv.style.left = Math.round((vw - cw) / 2) + 'px'; cv.style.top = top + 'px';
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    document.body.classList.toggle('portrait', portrait);
    tip.style.top = Math.max(8, top - 30) + 'px';
  }
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 250));
  layout();

  // ---------- Controles ----------
  const K = { left: false, right: false, jump: false, attack: false };
  let jumpBuf = 0, atkBuf = 0;
  const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump', KeyW: 'jump', Space: 'jump', KeyZ: 'jump', KeyX: 'attack', KeyJ: 'attack', KeyK: 'attack', Enter: 'attack' };
  window.addEventListener('keydown', (e) => {
    const k = KEYMAP[e.code];
    if (!k) return;
    e.preventDefault();
    if (!e.repeat) {
      if (k === 'jump') jumpBuf = 0.15;
      if (k === 'attack') atkBuf = 0.15;
      if (k === 'jump' || k === 'attack') advance();
    }
    K[k] = true;
  });
  window.addEventListener('keyup', (e) => { const k = KEYMAP[e.code]; if (k) K[k] = false; });
  const allUp = () => { for (const k in K) K[k] = false; document.querySelectorAll('.b.on').forEach((b) => b.classList.remove('on')); };
  window.addEventListener('blur', allUp);
  document.addEventListener('visibilitychange', allUp);

  const lz = document.getElementById('lz'), bl = document.getElementById('bl'), br = document.getElementById('br');
  let lzId = null;
  function lzSet(e) {
    const r = lz.getBoundingClientRect();
    const left = e.clientX < r.left + r.width / 2;
    K.left = left; K.right = !left;
    bl.classList.toggle('on', left); br.classList.toggle('on', !left);
  }
  function lzOff() { lzId = null; K.left = K.right = false; bl.classList.remove('on'); br.classList.remove('on'); }
  lz.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); lzId = e.pointerId; try { lz.setPointerCapture(e.pointerId); } catch (_) { /* nada */ } lzSet(e); });
  lz.addEventListener('pointermove', (e) => { if (e.pointerId === lzId) lzSet(e); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((t) => lz.addEventListener(t, (e) => { if (e.pointerId === lzId) lzOff(); }));
  function hold(el, k) {
    let id = null;
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault(); e.stopPropagation(); id = e.pointerId;
      try { el.setPointerCapture(id); } catch (_) { /* nada */ }
      K[k] = true; if (k === 'jump') jumpBuf = 0.15; else atkBuf = 0.15;
      el.classList.add('on');
    });
    const up = (e) => { if (e.pointerId !== id) return; id = null; K[k] = false; el.classList.remove('on'); };
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((t) => el.addEventListener(t, up));
  }
  hold(document.getElementById('jmp'), 'jump');
  hold(document.getElementById('atk'), 'attack');
  document.addEventListener('pointerdown', (e) => { if (e.target.closest && e.target.closest('#pad, #back')) return; advance(); });
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  function goFull() {
    if (!TOUCH) return;
    try {
      const d = document.documentElement;
      const p = d.requestFullscreen ? d.requestFullscreen({ navigationUI: 'hide' }) : null;
      if (p && p.then) p.then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (_) { /* nada */ } }).catch(() => {});
    } catch (_) { /* nada */ }
  }

  // ---------- Frases ----------
  const LAZY = ['¡Qué lata!', '¡No quiero hacer nada!', '¡Mañana hago la tarea!', '¡No me molestes!', '¿Estudiar? ¡Ni loco!', '¡Qué flojera!', '¡Yo vine a dormir!', '¡No hice la tarea!', '¡Que estudie otro!', '¡Paso de la tarea!'];
  const WAKE = ['¿Ah? ¿Qué pasó?', '¡Me despertaste!', '¡Estaba durmiendo!'];
  const DOWN = ['¡Ya, ya! ¡Voy a estudiar!', '¡Está bien, haré la tarea!', '¡Me rindo!', '¡Ay! ¡Ya voy a clases!', '¡Ok, abro el cuaderno!'];
  const BOSS_IN = '¡Aquí nadie pasa! ¡Y nadie estudia!';
  const BOSS_CHARGE = ['¡Fuera de aquí!', '¡Ahí voy!'];
  const BOSS_THROW = ['¡Toma, bolitas de papel!', '¡Toma tu tarea!'];
  const BOSS_DOWN = '¡Me rindo! ¡Mañana hago todas las tareas!';

  // ---------- Etapas ----------
  const desk = (x) => ({ x, y: G - 62, w: 104, k: 'desk' });
  const STAGES = [
    {
      name: 'La sala de clases', th: 'sala', w: 3000, exit: 2900, say: '¡Voy a buscar a mi amada al castillo!',
      plats: [260, 560, 900, 1180, 1500, 1760, 2080, 2380, 2640].map(desk),
      floorCoins: [700, 1640, 2480],
      waves: [
        { x: 380, list: [{ t: 'flojo', from: 'R' }, { t: 'dormilon', at: 640 }, { t: 'flojo', from: 'R', d: 1.4 }] },
        { x: 1250, list: [{ t: 'flojo', from: 'R' }, { t: 'tirador', from: 'R', d: 0.8 }, { t: 'flojo', from: 'L', d: 1.5 }] },
        { x: 2000, list: [{ t: 'dormilon', at: 470 }, { t: 'dormilon', at: 790 }, { t: 'flojo', from: 'R' }, { t: 'tirador', from: 'R', d: 1 }, { t: 'flojo', from: 'L', d: 1.2 }] },
      ],
    },
    {
      name: 'El patio del colegio', th: 'patio', w: 3400, exit: 3300, say: '¡Ahora a cruzar el patio!',
      plats: [
        { x: 300, y: G - 46, w: 130, k: 'bench' }, { x: 820, y: G - 46, w: 130, k: 'bench' }, { x: 975, y: G - 140, w: 150, k: 'kiosk' },
        { x: 1420, y: G - 46, w: 130, k: 'bench' }, { x: 2050, y: G - 46, w: 130, k: 'bench' }, { x: 2205, y: G - 140, w: 150, k: 'kiosk' },
        { x: 2700, y: G - 46, w: 130, k: 'bench' }, { x: 3050, y: G - 46, w: 130, k: 'bench' },
      ],
      floorCoins: [600, 1750, 2900],
      waves: [
        { x: 420, list: [{ t: 'flojo', from: 'R' }, { t: 'flojo', from: 'R', d: 1 }, { t: 'flojo', from: 'L', d: 1.4 }] },
        { x: 1350, list: [{ t: 'tirador', from: 'R' }, { t: 'flojo', from: 'L', d: 0.6 }, { t: 'tirador', from: 'R', d: 1.2 }, { t: 'flojo', from: 'R', d: 1 }] },
        { x: 2350, list: [{ t: 'dormilon', at: 520 }, { t: 'flojo', from: 'R' }, { t: 'tirador', from: 'R', d: 1 }, { t: 'flojo', from: 'L', d: 1 }, { t: 'flojo', from: 'R', d: 1.2 }] },
      ],
    },
    {
      name: 'El camino al castillo', th: 'camino', w: 3400, exit: 3300, say: '¡Ya falta poco para el castillo!',
      plats: [
        { x: 350, y: G - 56, w: 110, k: 'rock' }, { x: 1000, y: G - 56, w: 110, k: 'rock' }, { x: 1700, y: G - 56, w: 110, k: 'rock' },
        { x: 1830, y: G - 150, w: 140, k: 'plank' }, { x: 2500, y: G - 56, w: 110, k: 'rock' }, { x: 2630, y: G - 150, w: 140, k: 'plank' },
        { x: 3000, y: G - 56, w: 110, k: 'rock' },
      ],
      floorCoins: [700, 1350, 2200],
      waves: [
        { x: 500, list: [{ t: 'flojo', from: 'R' }, { t: 'tirador', from: 'R', d: 0.8 }, { t: 'flojo', from: 'L', d: 1 }, { t: 'tirador', from: 'R', d: 1.4 }] },
        { x: 1450, list: [{ t: 'dormilon', at: 420 }, { t: 'dormilon', at: 650 }, { t: 'dormilon', at: 840 }, { t: 'flojo', from: 'R', d: 0.5 }, { t: 'flojo', from: 'L', d: 1.5 }] },
        { x: 2350, list: [{ t: 'flojo', from: 'R' }, { t: 'flojo', from: 'L', d: 0.6 }, { t: 'tirador', from: 'R', d: 1 }, { t: 'flojo', from: 'R', d: 1 }, { t: 'tirador', from: 'L', d: 1 }, { t: 'flojo', from: 'R', d: 1 }] },
      ],
    },
    {
      name: 'El castillo', th: 'castillo', w: 2700, exit: 0, say: '¡Llegué al castillo! ¡Ya voy, mi amada!',
      plats: [
        { x: 300, y: G - 72, w: 140, k: 'ledge' }, { x: 860, y: G - 72, w: 140, k: 'ledge' }, { x: 1380, y: G - 72, w: 140, k: 'ledge' },
        { x: 1870, y: G - 100, w: 140, k: 'ledge' }, { x: 2180, y: G - 100, w: 140, k: 'ledge' },
      ],
      floorCoins: [650, 1200],
      waves: [
        { x: 350, list: [{ t: 'flojo', from: 'R' }, { t: 'dormilon', at: 600 }, { t: 'tirador', from: 'R', d: 1 }, { t: 'flojo', from: 'L', d: 1 }] },
        { x: 1050, list: [{ t: 'flojo', from: 'R' }, { t: 'flojo', from: 'L', d: 0.5 }, { t: 'tirador', from: 'R', d: 1 }, { t: 'flojo', from: 'R', d: 1 }, { t: 'tirador', from: 'L', d: 1 }] },
        { x: 1740, boss: true, list: [] },
      ],
    },
  ];
  const BALCONY = { x: 2560, y: 238, amX: 2620 };

  // ---------- Estado del juego ----------
  let state = 'title', stT = 0;
  let stageIdx = 0, S = STAGES[0];
  let camX = 0, lock = null, lockQ = [], spawnT = 0, shake = 0, freeze = 0, talkCd = 0;
  let enemies = [], balls = [], parts = [], pickups = [];
  let coinsTotal = 0, coinsStage = 0, uid = 1, bossE = null, rescue = null, amT = 2, amBub = null;
  let GOD = false;
  const ATK = 0.3;
  const P = { x: 120, y: G, vx: 0, vy: 0, face: 1, onG: true, coy: 0, hp: 5, maxHp: 5, inv: 0, hurt: 0, atk: 0, atkCd: 0, ph: 0, hitSet: new Set(), bub: null, landV: 0 };

  const SKINS = ['#f6d2a8', '#e8b987', '#c98e5d', '#8d5a3b', '#f1c9a0', '#dca878'];
  const HAIRS = ['#2b1d14', '#5a3a1e', '#a0632b', '#151515', '#d9a441', '#7a3b1a'];
  function makeLook() {
    const girl = Math.random() < 0.45;
    return {
      skin: pick(SKINS), hairC: pick(HAIRS), girl,
      hair: girl ? pick(['long', 'pony', 'curly']) : pick(['short', 'spiky', 'curly', 'short']),
      tie: pick(['#c0262d', '#1f6fbf', '#2e8b57']),
      bag: Math.random() < 0.5 ? pick(['#e94b3c', '#2a9d8f', '#f4a261', '#6a4c93', '#ffbe0b']) : null,
      glasses: Math.random() < 0.2, s: 1,
    };
  }
  const BOSS_LOOK = { skin: '#e8b987', hairC: '#2b1d14', hair: 'short', girl: false, tie: '#c0262d', bag: null, glasses: false, cap: '#d62828', s: 1.45 };

  function mkEnemy(t, x, wave) {
    const e = { id: uid++, t, x, y: G, vx: 0, vy: 0, face: -1, s: 1, hp: 2, maxHp: 2, state: 'walk', st: 0, cd: rand(0.4, 1), lazy: rand(3, 6), flash: 0, ph: Math.random() * 6, look: makeLook(), wave, active: false, bub: null, spd: rand(70, 95), walk: false, angry: false };
    if (t === 'dormilon') { e.state = 'sleep'; e.spd = rand(120, 140); }
    if (t === 'tirador') { e.spd = 90; e.cd = rand(1, 1.8); }
    if (t === 'boss') { e.look = BOSS_LOOK; e.s = 1.45; e.hp = e.maxHp = 12; e.spd = 88; e.angry = true; }
    return e;
  }

  function setState(s) {
    state = s; stT = 0;
    document.body.classList.toggle('playing', TOUCH && (s === 'play' || s === 'intro'));
    document.body.classList.toggle('title', s === 'title');
    if (s !== 'play') { jumpBuf = 0; atkBuf = 0; }
  }

  function startStage(i) {
    stageIdx = i; S = STAGES[i];
    S.waves.forEach((w) => { w.done = false; });
    Object.assign(P, { x: 120, y: G, vx: 0, vy: 0, face: 1, onG: true, hp: P.maxHp, inv: 0, hurt: 0, atk: 0, atkCd: 0, bub: null });
    camX = 0; lock = null; lockQ = []; enemies = []; balls = []; parts = []; pickups = [];
    coinsStage = 0; bossE = null; rescue = null; amT = 2; amBub = null;
    S.waves.forEach((w, wi) => w.list.forEach((s) => { if (s.at) enemies.push(mkEnemy(s.t, w.x + s.at, wi)); }));
    for (const p of S.plats) {
      pickups.push({ k: 'coin', x: p.x + p.w * 0.3, y: p.y - 36 }, { k: 'coin', x: p.x + p.w * 0.7, y: p.y - 36 });
    }
    for (const x of S.floorCoins) for (let j = 0; j < 3; j++) pickups.push({ k: 'coin', x: x + j * 40, y: G - 28 });
    if (i === 3) pickups.push({ k: 'heart', x: 1660, y: G - 18 }, { k: 'heart', x: 1600, y: G - 18 });
    setState('intro');
  }
  function toPlay() { setState('play'); P.bub = { txt: S.say, t: 2.8 }; }
  function nextStage() { if (stageIdx + 1 < STAGES.length) startStage(stageIdx + 1); }
  function clearStage() { coinsTotal += coinsStage; coinsStage = 0; setState('clear'); }

  function advance() {
    if (state === 'title' && stT > 0.3) { goFull(); setState('story'); }
    else if (state === 'story' && stT > 0.4) { coinsTotal = 0; startStage(0); }
    else if (state === 'intro' && stT > 0.3) toPlay();
    else if (state === 'dead' && stT > 0.6) startStage(stageIdx);
    else if (state === 'clear' && stT > 0.9) nextStage();
    else if (state === 'end' && stT > 2) setState('title');
  }

  // ---------- Partículas ----------
  function stars(x, y, n) { for (let i = 0; i < n; i++) parts.push({ k: 'star', x, y, vx: rand(-230, 230), vy: rand(-330, -60), g: 700, life: rand(0.35, 0.65), r: rand(5, 9), rot: rand(0, 6), col: pick(['#ffd34d', '#ffffff', '#ffb703']) }); }
  function dust(x, y, n) { for (let i = 0; i < n; i++) parts.push({ k: 'dust', x: x + rand(-14, 14), y: y - rand(0, 6), vx: rand(-60, 60), vy: rand(-50, -10), g: 0, life: rand(0.3, 0.55), r: rand(6, 11) }); }
  function powTxt(x, y) { parts.push({ k: 'txt', x, y, vx: 0, vy: -70, g: 0, life: 0.55, max: 0.55, txt: pick(['¡PAF!', '¡ZAS!', '¡PUM!', '¡TOING!']), col: pick(['#ffd34d', '#ff6b6b', '#6be3ff']) }); }
  function paperBits(x, y) { for (let i = 0; i < 6; i++) parts.push({ k: 'paper', x, y, vx: rand(-150, 150), vy: rand(-260, -60), g: 900, life: rand(0.4, 0.7), r: rand(3, 5), rot: rand(0, 6) }); }
  function sparkle(x, y) { for (let i = 0; i < 6; i++) parts.push({ k: 'spark', x, y, vx: rand(-160, 160), vy: rand(-160, 160), g: 0, life: rand(0.2, 0.4), r: rand(2, 4) }); }
  function hearts(x, y, n) { for (let i = 0; i < n; i++) parts.push({ k: 'heart', x: x + rand(-30, 30), y: y + rand(-10, 10), vx: rand(-40, 40), vy: rand(-120, -60), g: 0, life: rand(1, 1.8), r: rand(12, 22), col: pick(['#ff4d7d', '#ff7aa8', '#e8305f']) }); }
  function zzz(x, y) { parts.push({ k: 'z', x, y, vx: rand(10, 30), vy: -38, g: 0, life: 1.4, max: 1.4 }); }
  function updParts(dt) {
    for (const p of parts) { p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.rot !== undefined) p.rot += dt * 6; }
    parts = parts.filter((p) => p.life > 0);
  }

  function say(e, list, chance, force) {
    if (!force && (talkCd > 0 || Math.random() > chance)) return;
    e.bub = { txt: Array.isArray(list) ? pick(list) : list, t: 2.1 };
    talkCd = 1.3;
  }

  // ---------- Cajas de choque ----------
  const pBox = () => ({ x1: P.x - 16, x2: P.x + 16, y1: P.y - 92, y2: P.y });
  function eBox(e) {
    if (e.state === 'sleep' || (e.state === 'down' && e.st > 0.25)) return { x1: e.x - 52, x2: e.x + 52, y1: e.y - 34, y2: e.y };
    const s = e.s;
    return { x1: e.x - 21 * s, x2: e.x + 21 * s, y1: e.y - 112 * s, y2: e.y };
  }
  function punchBox(e) { const s = e.s, f = e.face; return { x1: f > 0 ? e.x : e.x - 66 * s, x2: f > 0 ? e.x + 66 * s : e.x, y1: e.y - 92 * s, y2: e.y - 30 * s }; }
  function chargeBox(e) { const s = e.s; return { x1: e.x - 26 * s, x2: e.x + 26 * s, y1: e.y - 66 * s, y2: e.y }; }
  const arenaL = () => (lock ? lock.x : camX);

  // ---------- Agustín ----------
  function hurtP(fromX, power) {
    if (P.inv > 0 || state !== 'play' || GOD) return;
    P.hp--; P.inv = 1.4; P.hurt = 0.32; P.atk = 0;
    const dir = P.x < fromX ? -1 : 1;
    P.vx = dir * 330 * power; P.vy = -300; P.onG = false;
    shake = 0.22; stars(P.x, P.y - 70, 6);
    if (P.hp <= 0) {
      P.hp = 0; P.inv = 0; balls = [];
      for (const e of enemies) if (e.state !== 'down' && e.state !== 'sleep' && e.state !== 'drop') { e.state = 'yawn'; e.st = 99; e.bub = null; }
      setState('dying');
    }
  }

  function updPlayer(dt, ctl, forceMv) {
    const p = P;
    p.inv = Math.max(0, p.inv - dt);
    p.atkCd -= dt; jumpBuf -= dt; atkBuf -= dt;
    if (p.bub) { p.bub.t -= dt; if (p.bub.t <= 0) p.bub = null; }
    let mv = forceMv || 0;
    if (ctl && p.hurt <= 0) mv = (K.right ? 1 : 0) - (K.left ? 1 : 0);
    if (p.hurt > 0) { p.hurt -= dt; p.vx *= Math.pow(0.05, dt); }
    else {
      const sp = (ctl ? 275 : 190) * (p.atk > 0 && p.onG ? 0.4 : 1);
      p.vx += (mv * sp - p.vx) * Math.min(1, dt * 16);
      if (mv && p.atk <= 0) p.face = mv;
    }
    p.coy = p.onG ? 0.09 : p.coy - dt;
    if (ctl && jumpBuf > 0 && p.coy > 0 && p.hurt <= 0) { p.vy = -700; p.onG = false; p.coy = 0; jumpBuf = 0; dust(p.x, p.y, 3); }
    if (ctl && (atkBuf > 0 || K.attack) && p.atk <= 0 && p.atkCd <= 0 && p.hurt <= 0) { p.atk = ATK; p.atkCd = ATK + 0.05; atkBuf = 0; p.hitSet = new Set(); }
    if (p.atk > 0) {
      p.atk -= dt;
      const ph = 1 - p.atk / ATK;
      if (ph > 0.12 && ph < 0.62) swordHits();
    }
    const g = (p.vy < 0 && !K.jump && ctl) ? 3400 : 1800;
    p.vy = Math.min(p.vy + g * dt, 1100);
    const oy = p.y;
    p.x += p.vx * dt; p.y += p.vy * dt;
    const wasG = p.onG, vyNow = p.vy;
    p.onG = false;
    if (p.vy >= 0) {
      if (p.y >= G) { p.y = G; p.vy = 0; p.onG = true; }
      else for (const pl of S.plats) if (oy <= pl.y + 1 && p.y >= pl.y && p.x > pl.x - 8 && p.x < pl.x + pl.w + 8) { p.y = pl.y; p.vy = 0; p.onG = true; break; }
    }
    if (p.onG && !wasG && vyNow > 550) dust(p.x, p.y, 4);
    const minX = lock ? lock.x + 24 : 24, maxX = lock ? lock.x + W - 24 : S.w - 24;
    p.x = clamp(p.x, minX, maxX);
    if (p.onG && Math.abs(p.vx) > 30) p.ph += dt * 13;
  }

  function swordHits() {
    const f = P.face;
    const box = { x1: f > 0 ? P.x + 4 : P.x - 100, x2: f > 0 ? P.x + 100 : P.x - 4, y1: P.y - 118, y2: P.y - 6 };
    for (const e of enemies) {
      if (e.state === 'down' || e.state === 'enter' || e.state === 'drop' || P.hitSet.has(e.id)) continue;
      if (overlap(box, eBox(e))) hitEnemy(e);
    }
    for (const b of balls) if (!b.dead && overlap(box, { x1: b.x - b.r, x2: b.x + b.r, y1: b.y - b.r, y2: b.y + b.r })) { b.dead = true; sparkle(b.x, b.y); paperBits(b.x, b.y); }
  }

  function hitEnemy(e) {
    P.hitSet.add(e.id);
    e.hp--; e.flash = 0.12; freeze = 0.045;
    const hx = e.x - P.face * 10, hy = e.y - (e.state === 'sleep' ? 22 : 62 * e.s);
    stars(hx, hy, 5); powTxt(hx, hy - 34);
    if (e.state === 'sleep') wake(e);
    if (e.hp <= 0) { defeat(e); return; }
    if (e.t === 'boss') { if (e.state !== 'charge' && e.state !== 'drop') e.x += P.face * 8; return; }
    e.state = 'hurt'; e.st = 0.34; e.vx = P.face * 240;
  }

  function wake(e) {
    e.state = 'wake'; e.st = 0.6; e.vy = -320; e.y = G - 1; e.angry = true; e.active = true;
    say(e, WAKE, 1, true);
  }

  function defeat(e) {
    e.state = 'down'; e.st = 0; e.vx = P.face * 220; e.vy = -280; e.y = Math.min(e.y, G - 1);
    if (e.t === 'boss') { say(e, BOSS_DOWN, 1, true); shake = 0.45; e.vx = P.face * 160; }
    else say(e, DOWN, 0.8, true);
    const n = e.t === 'boss' ? 10 : 2;
    for (let i = 0; i < n; i++) pickups.push({ k: 'coin', x: e.x, y: e.y - 70, vx: rand(-110, 110), vy: rand(-480, -300), fall: true });
    if (e.t !== 'boss' && P.hp < P.maxHp && Math.random() < 0.3) pickups.push({ k: 'heart', x: e.x, y: e.y - 70, vx: rand(-40, 40), vy: -380, fall: true });
  }

  // ---------- Compañeros de curso ----------
  function updEnemy(e, dt) {
    e.ph += dt * 9; e.flash = Math.max(0, e.flash - dt);
    if (e.bub) { e.bub.t -= dt; if (e.bub.t <= 0) e.bub = null; }
    if (e.y < G || e.vy < 0) {
      e.vy += 1700 * dt; e.y += e.vy * dt;
      if (e.y >= G) {
        e.y = G; e.vy = 0;
        if (e.state === 'drop') { e.state = 'intro'; e.st = 2.2; shake = 0.45; dust(e.x - 30, G, 5); dust(e.x + 30, G, 5); say(e, BOSS_IN, 1, true); }
      }
    }
    const dx = P.x - e.x, adx = Math.abs(dx);
    if (e.state === 'down') {
      e.st += dt; e.x += e.vx * dt; e.vx *= Math.pow(0.04, dt);
      if (e.t !== 'boss' && e.st > 1.8) e.dead = true;
      return;
    }
    if (e.state === 'sleep') {
      if (Math.random() < dt * 1.1) zzz(e.x - e.face * 40, e.y - 40);
      if (e.active && adx < 230) wake(e);
      return;
    }
    if (e.state === 'drop') return;
    if (e.state === 'wake') { e.st -= dt; e.face = dx >= 0 ? 1 : -1; if (e.st <= 0) e.state = 'walk'; return; }
    if (e.state === 'hurt') {
      e.st -= dt; e.x += e.vx * dt; e.vx *= Math.pow(0.01, dt);
      if (e.st <= 0) { e.state = 'walk'; e.cd = rand(0.3, 0.7); }
      clampE(e); return;
    }
    if (e.state === 'enter') {
      e.x += e.face * e.spd * 1.3 * dt; e.walk = true;
      const L = arenaL();
      if (e.x > L + 70 && e.x < L + W - 70) { e.state = 'walk'; say(e, LAZY, 0.55); }
      return;
    }
    if (e.state === 'yawn' && e.st > 50) return; // Agustín se cansó: los flojos vuelven a no hacer nada
    if (e.t === 'boss') aiBoss(e, dt, dx, adx);
    else if (e.t === 'tirador') aiThrow(e, dt, dx, adx);
    else aiMelee(e, dt, dx, adx);
    clampE(e);
  }
  function clampE(e) { if (lock && e.state !== 'enter') e.x = clamp(e.x, lock.x + 20, lock.x + W - 20); }

  function aiMelee(e, dt, dx, adx) {
    e.cd -= dt; e.lazy -= dt; e.walk = false;
    switch (e.state) {
      case 'walk':
        e.face = dx >= 0 ? 1 : -1;
        if (e.lazy <= 0) { e.state = 'yawn'; e.st = 1.1; e.lazy = rand(4, 7); say(e, LAZY, 0.7); break; }
        if (adx > 60) { e.x += e.face * e.spd * dt; e.walk = true; }
        else if (e.cd <= 0 && P.y > e.y - 75) { e.state = 'windup'; e.st = 0.42; }
        break;
      case 'yawn': e.st -= dt; if (e.st <= 0) e.state = 'walk'; break;
      case 'windup': e.st -= dt; if (e.st <= 0) { e.state = 'punch'; e.st = 0.16; e.hit = false; } break;
      case 'punch':
        e.st -= dt;
        if (!e.hit && overlap(punchBox(e), pBox())) { e.hit = true; hurtP(e.x, 1); }
        if (e.st <= 0) { e.state = 'recover'; e.st = 0.5; }
        break;
      case 'recover': e.st -= dt; if (e.st <= 0) { e.state = 'walk'; e.cd = rand(0.6, 1.3); } break;
      default: e.state = 'walk';
    }
  }

  function aiThrow(e, dt, dx, adx) {
    e.cd -= dt; e.walk = false;
    const L = arenaL();
    switch (e.state) {
      case 'walk': {
        e.face = dx >= 0 ? 1 : -1;
        let mv = 0;
        if (adx < 240) mv = -e.face; else if (adx > 420) mv = e.face;
        const nx = e.x + mv * e.spd * dt;
        if (mv && nx > L + 40 && nx < L + W - 40) { e.x = nx; e.walk = true; }
        if (e.cd <= 0) { e.state = 'windup'; e.st = 0.55; }
        break;
      }
      case 'windup': e.st -= dt; e.face = dx >= 0 ? 1 : -1; if (e.st <= 0) { throwBall(e, P.x + P.vx * 0.3); e.state = 'recover'; e.st = 0.45; } break;
      case 'recover': e.st -= dt; if (e.st <= 0) { e.state = 'walk'; e.cd = rand(1.9, 2.8); if (Math.random() < 0.3) say(e, LAZY, 0.6); } break;
      case 'yawn': e.st -= dt; if (e.st <= 0) e.state = 'walk'; break;
      default: e.state = 'walk';
    }
  }

  function aiBoss(e, dt, dx, adx) {
    e.walk = false; e.cd -= dt;
    const L = arenaL();
    switch (e.state) {
      case 'intro': e.st -= dt; e.face = dx >= 0 ? 1 : -1; if (e.st <= 0) { e.state = 'walk'; e.sp = rand(1.4, 2.2); } break;
      case 'walk':
        e.face = dx >= 0 ? 1 : -1; e.sp -= dt;
        if (e.sp <= 0) {
          // ataque especial cada 2 a 3 segundos, aunque Agustín esté cerca
          e.sp = rand(2.4, 3.4);
          if (Math.random() < 0.55) { e.state = 'cwind'; e.st = 0.85; say(e, BOSS_CHARGE, 1, true); }
          else { e.state = 'vwind'; e.st = 0.7; say(e, BOSS_THROW, 1, true); }
          break;
        }
        if (adx > 95) { e.x += e.face * e.spd * dt; e.walk = true; }
        else if (e.cd <= 0) { e.state = 'windup'; e.st = 0.5; }
        break;
      case 'windup': e.st -= dt; if (e.st <= 0) { e.state = 'punch'; e.st = 0.2; e.hit = false; } break;
      case 'punch':
        e.st -= dt;
        if (!e.hit && overlap(punchBox(e), pBox())) { e.hit = true; hurtP(e.x, 1.2); }
        if (e.st <= 0) { e.state = 'recover'; e.st = 0.6; }
        break;
      case 'recover': e.st -= dt; e.sp -= dt; if (e.st <= 0) { e.state = 'walk'; e.cd = rand(0.8, 1.3); } break;
      case 'cwind': e.st -= dt; e.face = dx >= 0 ? 1 : -1; if (e.st <= 0) { e.state = 'charge'; e.st = 2.4; e.vx = e.face * 470; } break;
      case 'charge':
        e.st -= dt; e.x += e.vx * dt; e.walk = true;
        if (Math.random() < dt * 18) dust(e.x - e.face * 24, G, 1);
        if (overlap(chargeBox(e), pBox())) hurtP(e.x, 1.4);
        if (e.x < L + 50 || e.x > L + W - 50 || e.st <= 0) {
          e.x = clamp(e.x, L + 50, L + W - 50);
          e.state = 'dizzy'; e.st = 1.7; shake = 0.3; dust(e.x + e.face * 30, G - 40, 6);
          say(e, '¡Ay, mi cabeza!', 1, true);
        }
        break;
      case 'dizzy': e.st -= dt; if (e.st <= 0) e.state = 'walk'; break;
      case 'vwind':
        e.st -= dt; e.face = dx >= 0 ? 1 : -1;
        if (e.st <= 0) { [-130, 0, 130].forEach((o) => throwBall(e, P.x + o)); e.state = 'recover'; e.st = 0.7; }
        break;
      default: e.state = 'walk';
    }
  }

  // ---------- Bolitas de papel ----------
  function throwBall(e, tx) {
    const sx = e.x + e.face * 14 * e.s, sy = e.y - 100 * e.s;
    const T = clamp(Math.abs(tx - sx) / 420, 0.55, 1.15);
    const g = 900;
    balls.push({ x: sx, y: sy, vx: (tx - sx) / T, vy: ((P.y - 48) - sy - 0.5 * g * T * T) / T, g, rot: 0, r: e.t === 'boss' ? 11 : 9 });
  }
  function updBalls(dt) {
    for (const b of balls) {
      if (b.dead) continue;
      b.vy += b.g * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.rot += dt * 8;
      if (overlap({ x1: b.x - b.r, x2: b.x + b.r, y1: b.y - b.r, y2: b.y + b.r }, pBox())) { hurtP(b.x - b.vx * 0.05, 0.7); paperBits(b.x, b.y); b.dead = true; }
      else if (b.y > G - 4) { paperBits(b.x, G - 4); b.dead = true; }
      else if (b.x < camX - 120 || b.x > camX + W + 120) b.dead = true;
    }
    balls = balls.filter((b) => !b.dead);
  }

  // ---------- Monedas y corazones ----------
  function updPickups(dt) {
    for (const c of pickups) {
      if (c.fall) {
        c.vy += 1400 * dt; c.x += c.vx * dt; c.y += c.vy * dt;
        const floor = c.k === 'coin' ? G - 13 : G - 18;
        if (c.y > floor) { c.y = floor; c.vy = -c.vy * 0.35; c.vx *= 0.6; if (Math.abs(c.vy) < 70) { c.vy = 0; c.vx = 0; c.fall = false; } }
        if (lock) c.x = clamp(c.x, lock.x + 20, lock.x + W - 20);
      }
      if (c.vy < -100) continue;
      if (Math.abs(c.x - P.x) < 30 && Math.abs(c.y - (P.y - 46)) < 56) {
        c.taken = true;
        if (c.k === 'coin') { coinsStage++; sparkle(c.x, c.y); }
        else { P.hp = Math.min(P.maxHp, P.hp + 1); hearts(c.x, c.y, 3); }
      }
    }
    pickups = pickups.filter((c) => !c.taken);
  }

  // ---------- Oleadas ----------
  function startWave(i) {
    const wv = S.waves[i];
    lock = { x: wv.x, i };
    lockQ = wv.list.filter((s) => s.from).map((s) => Object.assign({}, s));
    spawnT = 0.5;
    for (const e of enemies) if (e.wave === i) e.active = true;
    if (wv.boss) { const b = mkEnemy('boss', wv.x + 600, i); b.active = true; b.y = -170; b.state = 'drop'; enemies.push(b); bossE = b; }
  }
  function spawnNext() {
    const s = lockQ.shift(), R = s.from === 'R';
    const e = mkEnemy(s.t, R ? lock.x + W + 50 : lock.x - 50, lock.i);
    e.active = true; e.state = 'enter'; e.face = R ? -1 : 1;
    enemies.push(e);
    spawnT = lockQ.length ? (lockQ[0].d || 0.9) : 0;
  }
  function separate() {
    const l = enemies.filter((e) => e.state !== 'down' && e.state !== 'sleep' && e.state !== 'enter' && e.state !== 'drop');
    for (let i = 0; i < l.length; i++) for (let j = i + 1; j < l.length; j++) {
      const a = l[i], b = l[j], d = b.x - a.x, min = 36 * (a.s + b.s) / 2 + 6;
      if (Math.abs(d) < min) { const push = (min - Math.abs(d)) / 2 * (d >= 0 ? 1 : -1); a.x -= push; b.x += push; }
    }
  }

  function updPlay(dt) {
    if (freeze > 0) { freeze -= dt; return; }
    talkCd -= dt;
    updPlayer(dt, true);
    for (const e of enemies) updEnemy(e, dt);
    enemies = enemies.filter((e) => !e.dead);
    separate();
    updBalls(dt); updPickups(dt);
    if (state !== 'play') return;
    if (lock) {
      if (lockQ.length) {
        spawnT -= dt;
        const awake = enemies.filter((e) => e.wave === lock.i && e.state !== 'down' && e.state !== 'sleep').length;
        if (spawnT <= 0 && awake < 3) spawnNext();
      }
      if (!lockQ.length && !enemies.some((e) => e.wave === lock.i && e.state !== 'down')) {
        const wv = S.waves[lock.i];
        wv.done = true;
        if (wv.boss) startRescue(); else lock = null;
      }
    } else {
      const ni = S.waves.findIndex((w) => !w.done);
      if (ni >= 0 && P.x - W * 0.42 >= S.waves[ni].x) startWave(ni);
      else if (ni < 0 && S.exit && P.x >= S.exit) clearStage();
    }
    // la amada llama a Agustín desde el balcón
    if (S.th === 'castillo') {
      amT -= dt;
      if (amBub) { amBub.t -= dt; if (amBub.t <= 0) amBub = null; }
      if (amT <= 0 && camX > BALCONY.amX - W + 40) { amBub = { txt: '¡Agustín!', t: 1.8 }; amT = rand(5, 8); }
    }
  }
  function updCam(dt) {
    const tx = lock ? lock.x : clamp(P.x - W * 0.42, 0, S.w - W);
    camX += (tx - camX) * Math.min(1, dt * 6);
  }

  // ---------- Final: Agustín encuentra a su amada ----------
  function startRescue() {
    coinsTotal += coinsStage; coinsStage = 0; balls = [];
    setState('rescue');
    rescue = { t: 0, phase: 0, am: { x: BALCONY.amX, y: BALCONY.y, face: -1, ph: 0, walk: false }, path: [[BALCONY.x - 10, BALCONY.y], [BALCONY.x - 190, G]], hug: 0 };
    amBub = null;
  }
  function updRescue(dt) {
    const r = rescue, am = r.am;
    r.t += dt; talkCd -= dt;
    for (const e of enemies) {
      e.flash = Math.max(0, e.flash - dt);
      if (e.bub) { e.bub.t -= dt; if (e.bub.t <= 0) e.bub = null; }
      if (e.state === 'down') { e.st += dt; e.x += e.vx * dt; e.vx *= Math.pow(0.04, dt); if (e.y < G || e.vy < 0) { e.vy += 1700 * dt; e.y = Math.min(G, e.y + e.vy * dt); } if (e.t !== 'boss' && e.st > 1.8) e.dead = true; }
    }
    enemies = enemies.filter((e) => !e.dead);
    let mv = 0;
    am.walk = false;
    if (r.t > 1.4 && r.phase === 0) {
      const tg = r.path[0];
      const ddx = tg[0] - am.x, ddy = tg[1] - am.y, d = Math.hypot(ddx, ddy), st = 150 * dt;
      am.walk = true; am.face = ddx < 0 ? -1 : 1;
      if (d <= st) { am.x = tg[0]; am.y = tg[1]; r.path.shift(); if (!r.path.length) r.phase = 1; }
      else { am.x += ddx / d * st; am.y += ddy / d * st; }
      if (!amBub && r.t > 1.6 && r.t < 2) amBub = { txt: '¡Agustín, viniste por mí!', t: 2.4 };
    } else if (r.phase === 1) {
      const d = am.x - P.x;
      if (Math.abs(d) > 62) {
        am.walk = true; am.face = d > 0 ? -1 : 1; am.x -= Math.sign(d) * 150 * dt;
        mv = Math.sign(d);
      } else { r.phase = 2; r.hug = 0; P.face = d > 0 ? 1 : -1; am.face = -P.face; P.bub = { txt: '¡Te encontré, mi amada!', t: 3 }; }
    } else if (r.phase === 2) {
      r.hug += dt;
      if (Math.random() < dt * 9) hearts((P.x + am.x) / 2, P.y - 120, 1);
      if (r.hug > 3.6) setState('end');
    }
    am.ph += dt * 10;
    if (amBub) { amBub.t -= dt; if (amBub.t <= 0) amBub = null; }
    updPlayer(dt, false, mv);
    if (r.phase < 2 && mv === 0 && P.onG) P.face = am.x > P.x ? 1 : -1;
  }

  // ---------- Bucle ----------
  function update(dt) {
    stT += dt;
    shake = Math.max(0, shake - dt);
    switch (state) {
      case 'intro': updParts(dt); updCam(dt); if (stT > 2.2) toPlay(); break;
      case 'play': updPlay(dt); updParts(dt); updCam(dt); break;
      case 'dying': updPlayer(dt, false); for (const e of enemies) { e.ph += dt * 4; if (e.bub) { e.bub.t -= dt; if (e.bub.t <= 0) e.bub = null; } } updParts(dt); if (stT > 1.6) setState('dead'); break;
      case 'dead': updParts(dt); break;
      case 'clear': updPlayer(dt, false, 1); updParts(dt); if (stT > 2.6) nextStage(); break;
      case 'rescue': updRescue(dt); updParts(dt); updCam(dt); break;
      case 'end': if (rescue) rescue.am.ph += dt * 2; if (Math.random() < dt * 5) hearts(rand(120, 840), H - 40, 1); updParts(dt); break;
      default: break;
    }
  }

  // ================= DIBUJO =================
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function line(x1, y1, x2, y2, w, c) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
  function limb(x1, y1, x2, y2, w, c) { line(x1, y1, x2, y2, w + 4, OUT); line(x1, y1, x2, y2, w, c); }
  function circ(x, y, r, fill, stroke, lw) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
  }
  function ell(x, y, rx, ry, fill, stroke, lw, rot) {
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }

      const gw = ctx.createLinearGradient(0, 100, 0, 250); gw.addColorStop(0, '#1b2350'); gw.addColorStop(1, '#3b3f7a');
      fillStroke(gw, 4);
      circ(bx + 180, 140, 14, '#fff3c4'); circ(bx + 186, 136, 12, '#2a2f66');
      for (const [sx, sy] of [[130, 190], [150, 120], [195, 210], [170, 230]]) circ(bx + sx, sy, 1.6, '#fff');
      ctx.fillStyle = '#4b4566'; ctx.fillRect(bx + 104, 250, 112, 10);
      ctx.fillStyle = '#9b1d2e'; ctx.beginPath(); ctx.moveTo(bx + 445, 70); ctx.lineTo(bx + 515, 70); ctx.lineTo(bx + 515, 250); ctx.lineTo(bx + 480, 226); ctx.lineTo(bx + 445, 250); ctx.closePath(); fillStroke('#a3192f', 3);
      ctx.fillStyle = '#e9b44c'; ctx.fillRect(bx + 438, 62, 84, 10);
      ctx.beginPath(); ctx.moveTo(bx + 462, 160); ctx.lineTo(bx + 462, 132); ctx.lineTo(bx + 471, 145); ctx.lineTo(bx + 480, 126); ctx.lineTo(bx + 489, 145); ctx.lineTo(bx + 498, 132); ctx.lineTo(bx + 498, 160); ctx.closePath(); fillStroke('#e9b44c', 2);
      for (const tx of [0, 320]) {
        const x = bx + tx;
        ctx.fillStyle = '#2a2438'; ctx.fillRect(x - 6, 214, 12, 30); ctx.fillRect(x - 12, 210, 24, 8);
        const fl = Math.sin(t * 13 + k + tx) * 3;
        const rg = ctx.createRadialGradient(x, 196, 4, x, 196, 70); rg.addColorStop(0, 'rgba(255,190,80,.45)'); rg.addColorStop(1, 'rgba(255,190,80,0)');
        ctx.fillStyle = rg; ctx.fillRect(x - 70, 126, 140, 140);
        ctx.beginPath(); ctx.moveTo(x - 10, 208); ctx.quadraticCurveTo(x - 12, 190, x + fl, 172); ctx.quadraticCurveTo(x + 12, 190, x + 10, 208); ctx.closePath(); ctx.fillStyle = '#ff8a2a'; ctx.fill();
        ctx.beginPath(); ctx.moveTo(x - 5, 208); ctx.quadraticCurveTo(x - 6, 196, x + fl * 0.5, 186); ctx.quadraticCurveTo(x + 6, 196, x + 5, 208); ctx.closePath(); ctx.fillStyle = '#ffe066'; ctx.fill();
      }
    }
    ctx.fillStyle = '#2f2b42'; ctx.fillRect(0, G, W, H - G);
    ctx.fillStyle = '#4a4563'; ctx.fillRect(0, G, W, 6);
    ctx.fillStyle = '#25213a'; for (let x = -(cx % 96); x < W; x += 96) ctx.fillRect(x, G + 6, 3, H - G);
    const tx = BALCONY.x - cx;
    if (tx < W + 50) {
      ctx.fillStyle = '#4b4566'; ctx.fillRect(tx, BALCONY.y, 200, G - BALCONY.y); ctx.strokeStyle = OUT; ctx.lineWidth = 3; ctx.strokeRect(tx, BALCONY.y, 200, G - BALCONY.y);
      const n = 10, sx = tx - 4, dy = (G - BALCONY.y) / n, dx = 190 / n;
      ctx.fillStyle = '#5d5682';
      for (let i = 0; i < n; i++) { ctx.fillRect(sx - (i + 1) * dx, BALCONY.y + i * dy, dx + 2, G - BALCONY.y - i * dy); ctx.strokeRect(sx - (i + 1) * dx, BALCONY.y + i * dy, dx + 2, G - BALCONY.y - i * dy); }
      rr(tx - 8, BALCONY.y - 4, 216, 14, 3); fillStroke('#6a6290', 2.5);
    }
    for (const p of S.plats) platLedge(p);
  }
  function balconyRail() {
    const tx = BALCONY.x - camX;
    if (tx > W + 50) return;
    ctx.fillStyle = '#6a6290';
    for (let i = 8; i < 200; i += 20) { ctx.fillRect(tx + i, BALCONY.y - 34, 7, 32); ctx.strokeStyle = OUT; ctx.lineWidth = 1.6; ctx.strokeRect(tx + i, BALCONY.y - 34, 7, 32); }
    rr(tx - 4, BALCONY.y - 40, 208, 9, 3); fillStroke('#7d73a8', 2);
  }
  function platLedge(p) {
    const x = p.x - camX;
    if (x < -160 || x > W + 60) return;
    ctx.fillStyle = '#3a3552';
    for (const ox of [16, p.w - 34]) { ctx.beginPath(); ctx.moveTo(x + ox, p.y + 14); ctx.lineTo(x + ox + 18, p.y + 14); ctx.lineTo(x + ox + 9, p.y + 40); ctx.closePath(); fillStroke('#3a3552', 2); }
    rr(x, p.y, p.w, 16, 3); fillStroke('#7d73a8', 2.5);
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(x + 4, p.y + 3, p.w - 8, 4);
  }

  function drawBg() {
    if (S.th === 'sala') bgSala();
    else if (S.th === 'patio') bgPatio();
    else if (S.th === 'camino') bgCamino();
    else bgCastillo();
  }

  // ---------- Personajes en el mundo ----------
  function surfaceBelow(x, y) {
    let best = G;
    for (const p of S.plats) if (x > p.x - 8 && x < p.x + p.w + 8 && p.y >= y - 1 && p.y < best) best = p.y;
    return best;
  }
  function orbit(x, y, r, n, t) {
    for (let i = 0; i < n; i++) { const a = t * 4 + i * Math.PI * 2 / n; starPath(x + Math.cos(a) * r, y + Math.sin(a) * r * 0.35, 5, t * 3); fillStroke('#ffd34d', 1.5); }
  }
  function drawEnemy(e) {
    const x = e.x - camX;
    if (x < -160 || x > W + 160) return;
    let pose = 'idle', mood = e.angry ? 'angry' : 'bored', lie = 0, lean = 0, walk = e.walk;
    switch (e.state) {
      case 'sleep': lie = 1; mood = 'closed'; pose = 'lie'; break;
      case 'down': lie = Math.min(1, e.st / 0.3); mood = 'dizzy'; pose = 'lie'; break;
      case 'hurt': pose = 'hurt'; mood = 'ouch'; lean = -0.2; break;
      case 'windup': pose = e.t === 'tirador' ? 'throwwind' : 'windup'; mood = 'angry'; lean = -0.08; break;
      case 'punch': pose = 'punch'; mood = 'angry'; lean = 0.1; break;
      case 'recover': pose = e.t === 'tirador' ? 'throw' : 'recover'; break;
      case 'yawn': pose = 'yawn'; mood = 'yawn'; break;
      case 'wake': pose = 'hurt'; mood = 'ouch'; break;
      case 'cwind': case 'intro': pose = 'stomp'; mood = 'angry'; break;
      case 'charge': pose = 'charge'; mood = 'angry'; lean = 0.3; walk = true; break;
      case 'dizzy': pose = 'dizzy'; mood = 'dizzy'; break;
      case 'vwind': pose = 'throwwind'; mood = 'angry'; break;
      default: break;
    }
    const shx = e.state === 'cwind' ? Math.sin(e.ph * 6) * 2.5 : 0;
    const gs = Math.sin(e.ph * 0.25);
    const o = { pose, mood, lie, lean, walk, ph: e.ph, gum: e.t === 'boss' && e.state === 'walk' && gs > 0.5 ? (gs - 0.5) * 18 : 0 };
    const fade = e.state === 'down' && e.t !== 'boss' && e.st > 1.3 ? 1 - (e.st - 1.3) / 0.5 : 1;
    ctx.globalAlpha = clamp(fade, 0, 1);
    drawKid(x + shx, e.y, e.face, e.look, o);
    if (e.flash > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.55; drawKid(x + shx, e.y, e.face, e.look, o); ctx.globalCompositeOperation = 'source-over'; }
    ctx.globalAlpha = 1;
    const t = performance.now() / 1000;
    if (e.state === 'down' && lie >= 1) orbit(x - e.face * 48 * e.s, e.y - 34 * e.s, 16 * e.s, 3, t);
    if (e.state === 'dizzy') orbit(x + e.face * 2 * e.s, e.y - 128 * e.s, 20 * e.s, 3, t);
    if (e.state === 'windup' || e.state === 'cwind' || e.state === 'vwind') T('!', x + e.face * 4, e.y - 140 * e.s, 34, '#ff4d4d');
  }
  function drawPlayer() {
    const x = P.x - camX;
    const sit = state === 'dying' || state === 'dead';
    const hug = rescue && rescue.phase === 2;
    const o = { walk: P.onG && Math.abs(P.vx) > 30, ph: P.ph, air: !P.onG, atk: P.atk > 0 ? 1 - P.atk / ATK : -1, hurt: P.hurt > 0, sit, hug };
    if (P.inv > 0 && state === 'play' && Math.floor(P.inv * 12) % 2 === 0) ctx.globalAlpha = 0.4;
    drawAgustin(x, P.y, P.face, o);
    ctx.globalAlpha = 1;
    if (sit) orbit(x + P.face * 4, P.y - 70, 20, 3, performance.now() / 1000);
  }
  function drawAmadaWorld() {
    const t = performance.now() / 1000;
    if (rescue) { drawAmada(rescue.am.x - camX, rescue.am.y, rescue.am.face, { walk: rescue.am.walk, ph: rescue.am.ph, hug: rescue.phase === 2, t }); return; }
    const x = BALCONY.amX - camX;
    if (x > W + 60) return;
    drawAmada(x, BALCONY.y, -1, { wave: camX > BALCONY.amX - W + 40, t });
  }
  function bubble(x, y, txt) {
    ctx.font = `800 17px ${FONT}`;
    const w = Math.min(ctx.measureText(txt).width + 22, W - 20), h = 34;
    const bx = clamp(x - w / 2, 10, W - 10 - w), by = clamp(y - h, 6, H - h - 6);
    const tx = clamp(x, bx + 16, bx + w - 16);
    ctx.beginPath(); ctx.moveTo(tx - 8, by + h - 1); ctx.lineTo(tx, by + h + 11); ctx.lineTo(tx + 8, by + h - 1); ctx.closePath(); fillStroke('#fff', 2.5);
    rr(bx, by, w, h, 13); fillStroke('#fff', 2.5);
    ctx.fillStyle = '#fff'; ctx.fillRect(tx - 6, by + h - 4, 12, 4);
    ctx.fillStyle = OUT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, bx + w / 2, by + h / 2 + 1);
  }
  function drawParts() {
    for (const p of parts) {
      const x = p.x - camX, a = clamp(p.life * 2.5, 0, 1);
      ctx.globalAlpha = a;
      if (p.k === 'star') { starPath(x, p.y, p.r, p.rot); ctx.fillStyle = p.col; ctx.fill(); }
      else if (p.k === 'dust') { circ(x, p.y, p.r * (1.6 - p.life), 'rgba(235,225,210,.8)'); }
      else if (p.k === 'paper') { ctx.save(); ctx.translate(x, p.y); ctx.rotate(p.rot); ctx.fillStyle = '#fff'; ctx.fillRect(-p.r, -p.r, p.r * 2, p.r * 2); ctx.restore(); }
      else if (p.k === 'spark') { circ(x, p.y, p.r, '#fff7c2'); }
      else if (p.k === 'heart') { ctx.globalAlpha = clamp(p.life, 0, 1); heartPath(x, p.y, p.r); fillStroke(p.col, 2); }
      else if (p.k === 'z') { ctx.globalAlpha = clamp(p.life, 0, 1); T('Z', x, p.y, 16 + (p.max - p.life) * 14, '#fff', 'center', 3, '#3a4a8a'); }
      else if (p.k === 'txt') { const k = 1 - p.life / p.max; T(p.txt, x, p.y, 26 + Math.min(k * 60, 8), p.col, 'center', 5); }
    }
    ctx.globalAlpha = 1;
  }

  function drawWorld() {
    ctx.save();
    if (shake > 0) ctx.translate(rand(-6, 6) * Math.min(1, shake * 4), rand(-4, 4) * Math.min(1, shake * 4));
    drawBg();
    const now = performance.now() / 1000;
    for (const c of pickups) {
      const x = c.x - camX;
      if (x < -30 || x > W + 30) continue;
      const bob = c.fall ? 0 : Math.sin(now * 3 + c.x) * 3;
      if (c.k === 'coin') coin(x, c.y + bob, 11, now + c.x);
      else { heartPath(x, c.y - 12 + bob, 26); fillStroke('#ff3b5c', 2.5); }
    }
    const lying = enemies.filter((e) => e.state === 'down' || e.state === 'sleep');
    const standing = enemies.filter((e) => e.state !== 'down' && e.state !== 'sleep');
    for (const e of enemies) if (e.y > 0) shadow(e.x - camX, G, (e.state === 'sleep' || e.state === 'down' ? 48 : 24) * e.s);
    const sy = P.onG ? P.y : surfaceBelow(P.x, P.y);
    shadow(P.x - camX, sy, 22 * clamp(1 - (sy - P.y) / 300, 0.5, 1));
    for (const e of lying) drawEnemy(e);
    if (S.th === 'castillo') { drawAmadaWorld(); if (!rescue || rescue.phase === 0) balconyRail(); }
    for (const e of standing) drawEnemy(e);
    drawPlayer();
    for (const b of balls) paperBall(b.x - camX, b.y, b.r, b.rot);
    drawParts();
    for (const e of enemies) if (e.bub) bubble(e.x - camX, e.y - (e.state === 'sleep' || e.state === 'down' ? 56 : 132 * e.s), e.bub.txt);
    if (P.bub) bubble(P.x - camX, P.y - 136, P.bub.txt);
    if (amBub && S.th === 'castillo') { const ax = rescue ? rescue.am.x : BALCONY.amX, ay = rescue ? rescue.am.y : BALCONY.y; bubble(ax - camX, ay - 120, amBub.txt); }
    ctx.restore();
  }

  // ---------- HUD ----------
  function drawHUD() {
    for (let i = 0; i < P.maxHp; i++) { heartPath(26 + i * 36, 14, 30); fillStroke(i < P.hp ? '#ff3b5c' : 'rgba(255,255,255,.35)', 2.5); }
    const label = `Etapa ${stageIdx + 1} de ${STAGES.length} · ${S.name}`;
    ctx.font = `800 17px ${FONT}`;
    const lw = ctx.measureText(label).width + 28;
    rr(W / 2 - lw / 2, 12, lw, 30, 15); ctx.fillStyle = 'rgba(20,14,35,.72)'; ctx.fill();
    T(label, W / 2, 28, 17, '#fff', 'center', 0, null, 800);
    coin(W - 120, 30, 13, 0);
    T(`${coinsTotal + coinsStage}`, W - 100, 31, 28, '#ffd34d', 'left', 5);
    if (bossE && lock && S.waves[lock.i].boss && bossE.state !== 'down' && bossE.state !== 'drop') {
      const bw = 340, bx = W / 2 - bw / 2;
      T('EL MÁS FLOJO DEL CURSO', W / 2, 62, 18, '#ffd34d', 'center', 4);
      rr(bx, 76, bw, 16, 8); ctx.fillStyle = 'rgba(20,14,35,.8)'; ctx.fill();
      rr(bx + 3, 79, (bw - 6) * bossE.hp / bossE.maxHp, 10, 5); ctx.fillStyle = '#ff4d4d'; ctx.fill();
      rr(bx, 76, bw, 16, 8); ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.stroke();
    }
    if (state === 'play' && !lock && (stT % 1) < 0.65) {
      T('¡SIGUE!', W - 110, 250, 30, '#ffd34d', 'center', 6);
      ctx.beginPath(); ctx.moveTo(W - 60, 228); ctx.lineTo(W - 28, 250); ctx.lineTo(W - 60, 272); ctx.closePath(); fillStroke('#ffd34d', 3);
    }
  }

  // ---------- Pantallas ----------
  function band(y, h, a) { ctx.fillStyle = `rgba(18,12,32,${a == null ? 0.82 : a})`; ctx.fillRect(0, y, W, h); }
  function pulse(t) { return 0.6 + 0.4 * Math.abs(Math.sin(t * 3)); }
  const TAP = TOUCH ? 'Toca la pantalla' : 'Presiona Espacio';

  function drawTitle(t) {
    const g = ctx.createLinearGradient(0, 0, 0, 360); g.addColorStop(0, '#2b1b4d'); g.addColorStop(0.55, '#d8566b'); g.addColorStop(1, '#ffc078');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, 360);
    circ(560, 330, 70, '#ffe39a');
    const sg = ctx.createLinearGradient(0, 330, 0, H); sg.addColorStop(0, '#2c6ea6'); sg.addColorStop(1, '#16385f');
    ctx.fillStyle = sg; ctx.fillRect(0, 330, W, H - 330);
    ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 2;
    for (let i = 0; i < 14; i++) { const x = (i * 131 + t * 20) % (W + 60) - 30, y = 352 + (i % 5) * 26; ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 12, y - 6, x + 24, y); ctx.stroke(); }
    ctx.fillStyle = '#3c7d3a'; ctx.beginPath(); ctx.moveTo(600, 400); ctx.quadraticCurveTo(760, 300, 960, 330); ctx.lineTo(960, 420); ctx.closePath(); ctx.fill();
    castle(800, 352, 0.62, true, t);
    ship(470, 410, 0.75, t);
    ctx.fillStyle = '#e9c98b'; ctx.beginPath(); ctx.moveTo(0, 470); ctx.quadraticCurveTo(300, 440, 560, 480); ctx.lineTo(560, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
    shadow(200, 500, 44);
    drawAgustin(200, 500, 1, { s: 2.2, hero: true, atk: -1, ph: 0 });
    T('AGUSTÍN', 640, 82, 92, '#ffd34d', 'center', 12);
    T('EL PIRATA', 640, 160, 50, '#fff', 'center', 9);
    T('En busca de su amada', 640, 212, 26, '#fff3d6', 'center', 6);
    ctx.save(); ctx.globalAlpha = pulse(t);
    rr(640 - 130, 430, 260, 70, 35); fillStroke('#ffd34d', 4);
    T('▶  JUGAR', 640, 466, 34, OUT, 'center', 0);
    ctx.restore();
    T(TOUCH ? 'Toca la pantalla para empezar' : 'Presiona Espacio o haz clic para empezar', 640, 520, 17, '#fff', 'center', 4);
  }

  function drawStory(t) {
    ctx.fillStyle = '#1b1430'; ctx.fillRect(0, 0, W, H);
    rr(70, 40, 820, 460, 22); fillStroke('#f3e2b8', 5);
    rr(84, 54, 792, 432, 16); ctx.strokeStyle = '#b9935a'; ctx.lineWidth = 2; ctx.stroke();
    T('LA HISTORIA', 480, 92, 40, '#7a3e12', 'center', 0);
    shadow(170, 370, 30);
    drawAgustin(170, 370, 1, { s: 1.5, atk: -1, ph: 0 });
    const paras = [
      'Agustín es un pirata con tatuajes.',
      'Tiene que ir a buscar a su amada al castillo.',
      'En cada etapa lo esperan sus compañeros de curso, que no quieren hacer nada en el colegio.',
      '¡Pelea con ellos y llega al castillo!',
    ];
    let y = 150;
    ctx.fillStyle = '#4a2c12'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    for (const p of paras) {
      for (const ln of wrap(p, 560, 25)) { ctx.font = `800 25px ${FONT}`; ctx.fillStyle = '#4a2c12'; ctx.fillText(ln, 290, y); y += 33; }
      y += 10;
    }
    const ctl = TOUCH ? ['◀ ▶  caminar', '▲  saltar', '⚔  espada'] : ['← →  caminar', '↑ o Espacio  saltar', 'X  espada'];
    ctx.font = `800 20px ${FONT}`;
    const gap = 30, ws = ctl.map((c) => ctx.measureText(c).width + 28);
    let x = 480 - (ws.reduce((a, b) => a + b, 0) + gap * 2) / 2;
    ctl.forEach((c, i) => { rr(x, 404, ws[i], 36, 18); ctx.fillStyle = '#7a3e12'; ctx.fill(); T(c, x + ws[i] / 2, 423, 20, '#fff', 'center', 0, null, 800); x += ws[i] + gap; });
    ctx.save(); ctx.globalAlpha = pulse(t); T(`${TAP} para empezar`, 480, 468, 20, '#7a3e12', 'center', 0); ctx.restore();
  }

  function drawOverlay(t) {
    if (state === 'intro') {
      const a = stT < 1.9 ? 1 : clamp(1 - (stT - 1.9) / 0.3, 0, 1);
      ctx.globalAlpha = a;
      band(176, 190);
      T(`ETAPA ${stageIdx + 1}`, W / 2, 232, 68, '#ffd34d', 'center', 10);
      T(S.name, W / 2, 300, 40, '#fff', 'center', 8);
      T(`de ${STAGES.length}`, W / 2, 344, 18, '#cfc6e8', 'center', 0);
      ctx.globalAlpha = 1;
    } else if (state === 'clear') {
      band(180, 180);
      T('¡ETAPA SUPERADA!', W / 2, 240, 60, '#ffd34d', 'center', 10);
      T(`Monedas de oro: ${coinsTotal}`, W / 2, 304, 28, '#fff', 'center', 6);
      ctx.save(); ctx.globalAlpha = pulse(t); T(TAP + ' para seguir', W / 2, 340, 18, '#cfc6e8', 'center', 0); ctx.restore();
    } else if (state === 'dead') {
      ctx.fillStyle = 'rgba(18,12,32,.62)'; ctx.fillRect(0, 0, W, H);
      T('¡AY, NO!', W / 2, 200, 76, '#ff6b6b', 'center', 11);
      T('Esta vez ganaron los flojos.', W / 2, 270, 30, '#fff', 'center', 6);
      ctx.save(); ctx.globalAlpha = pulse(t); T(`${TAP} para intentarlo de nuevo`, W / 2, 330, 24, '#ffd34d', 'center', 5); ctx.restore();
    } else if (state === 'end') {
      ctx.fillStyle = 'rgba(18,12,32,.45)'; ctx.fillRect(0, 0, W, H);
      band(60, 150, 0.85);
      fitT('¡Agustín encontró a su amada!', W / 2, 110, 46, W - 60, '#ffd34d', 'center', 9);
      T('FIN', W / 2, 172, 48, '#fff', 'center', 8);
      T(`Monedas de oro: ${coinsTotal}`, W / 2, 236, 24, '#fff', 'center', 5);
      if (stT > 2) { ctx.save(); ctx.globalAlpha = pulse(t); T(`${TAP} para jugar otra vez`, W / 2, 268, 20, '#ffd34d', 'center', 5); ctx.restore(); }
    }
  }

  function draw() {
    const t = performance.now() / 1000;
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (state === 'title') { drawTitle(t); return; }
    if (state === 'story') { drawStory(t); return; }
    drawWorld();
    if (state !== 'end') drawHUD();
    drawOverlay(t);
  }

  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setState('title');

  // Para probar el juego desde la consola (no lo usa el juego)
  window.__ag = {
    get state() { return state; }, get P() { return P; }, get enemies() { return enemies; }, get stage() { return stageIdx; },
    get camX() { return camX; }, get lock() { return lock; }, get rescue() { return rescue; }, K,
    start(i) { coinsTotal = 0; startStage(i); toPlay(); }, god(v) { GOD = !!v; }, setState,
  };
})();
</script>
