<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Programación KRB">
<meta name="theme-color" content="#0c0b12">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Programación KRB</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root { --noche: #0c0b12; --panel: #17151f; --panel2: #201d2a; --linea: #2f2b3b; --texto: #f3f0f7; --suave: #a7a1b5; --foco: #f4bf5a; --mal: #ff7a6e; --bien: #6fd49a;
  --MK: #47b8e6; --FRIDA: #e0338f; --TOB: #e5413a; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--noche); color: var(--texto); font: 500 15px/1.4 Manrope, system-ui, sans-serif; }
body { padding: env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom)); }
h1, h2, h3 { font-family: 'Big Shoulders Display', sans-serif; text-transform: uppercase; letter-spacing: .02em; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 12px 16px; }
.top { position: sticky; top: 0; z-index: 5; background: var(--noche); border-bottom: 1px solid var(--linea); }
.top .wrap { display: flex; align-items: center; gap: 10px; padding-top: 10px; padding-bottom: 10px; }
.top h1 { font-size: 22px; color: var(--foco); flex: 1; }
.mes { display: flex; align-items: center; gap: 6px; }
.mes b { font-family: 'Big Shoulders Display'; font-size: 20px; text-transform: uppercase; min-width: 140px; text-align: center; }
.btn { background: var(--panel2); border: 1px solid var(--linea); border-radius: 8px; padding: 8px 12px; }
.btn.foco { background: var(--foco); color: #1a1408; border-color: var(--foco); font-weight: 800; }
.btn.chico { padding: 4px 9px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; background: #12101a; border-top: 1px solid var(--linea); padding-bottom: env(safe-area-inset-bottom); }
.tabs button { flex: 1; background: none; border: 0; padding: 12px 2px; color: var(--suave); font-weight: 800; font-size: 12px; }
.chk { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--linea); }
.chk input { width: 20px; height: 20px; flex: none; }
.paso h3 { font-size: 18px; color: var(--foco); margin: 0 0 6px; }
.tabs button.on { color: var(--foco); box-shadow: inset 0 3px 0 var(--foco); }
.semana { margin: 18px 0 6px; display: flex; align-items: center; gap: 10px; }
.semana h2 { font-size: 15px; color: var(--suave); flex: 1; }
.dia { background: var(--panel); border: 1px solid var(--linea); border-radius: 12px; margin: 10px 0; overflow: hidden; }
.dia > header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--panel2); }
.dia > header h3 { font-size: 20px; flex: 1; }
.tag { font: 700 11px 'JetBrains Mono', monospace; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: var(--linea); color: var(--suave); }
.tag.mal { background: #4a1f1c; color: var(--mal); }
.locs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.loc { padding: 12px 14px 14px; border-top: 1px solid var(--linea); border-left: 4px solid var(--c); }
@media (min-width: 700px) { .loc { border-top: 0; border-right: 1px solid var(--linea); } }
.loc h4 { margin: 0 0 8px; display: flex; align-items: center; gap: 8px; font: 800 17px 'Big Shoulders Display'; text-transform: uppercase; color: var(--c); }
.loc h4 span { flex: 1; }
.loc.cerrado { opacity: .55; }
.grupo { margin-top: 10px; }
.grupo > label { display: block; font: 700 11px 'JetBrains Mono', monospace; text-transform: uppercase; color: var(--suave); margin-bottom: 4px; }
.fila { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.campo { display: flex; flex-direction: column; gap: 2px; flex: 1 1 130px; min-width: 0; }
.campo small { color: var(--suave); font-size: 11px; }
select, input[type=text], input[type=number], textarea { width: 100%; background: #0f0d16; border: 1px solid var(--linea); border-radius: 7px; padding: 8px 9px; min-width: 0; }
select:focus, input:focus, textarea:focus { outline: 2px solid var(--foco); outline-offset: -1px; }
.vacio { color: var(--suave); }
.chips { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 6px; }
.chip { border: 1px solid var(--linea); background: #0f0d16; border-radius: 99px; padding: 5px 11px; font-size: 13px; }
.chip.on { background: var(--c, var(--foco)); border-color: var(--c, var(--foco)); color: #fff; font-weight: 800; }
.pagos { margin-top: 10px; font: 500 12px 'JetBrains Mono', monospace; color: var(--suave); }
.pagos .falta { color: var(--mal); font-weight: 700; }
.panel { background: var(--panel); border: 1px solid var(--linea); border-radius: 12px; padding: 14px; margin: 12px 0; }
.panel h2 { font-size: 20px; margin-bottom: 8px; color: var(--foco); }
.panel p { margin: 6px 0; color: var(--suave); }
textarea.salida { font: 500 13px/1.45 'JetBrains Mono', monospace; min-height: 220px; white-space: pre; }
.faltan { color: var(--mal); margin: 0; padding-left: 18px; }
.ok { color: var(--bien); }
table { width: 100%; border-collapse: collapse; }
td, th { padding: 4px; text-align: left; font-size: 13px; }
td input[type=checkbox] { width: 20px; height: 20px; }
tr[data-p] td:nth-child(n+3):nth-child(-n+6), tr[data-p] td:last-child { width: 1%; text-align: center; }
th { font: 700 11px 'JetBrains Mono', monospace; text-transform: uppercase; color: var(--suave); }
.aviso { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--foco); color: #1a1408; font-weight: 800; padding: 8px 16px; border-radius: 99px; z-index: 9; opacity: 0; transition: opacity .2s; pointer-events: none; }
.aviso.on { opacity: 1; }
.login { max-width: 360px; margin: 18vh auto; padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
.login h1 { color: var(--foco); font-size: 34px; }
ol.pasos li { margin: 6px 0; }
code { font-family: 'JetBrains Mono', monospace; background: #0f0d16; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="aviso" id="aviso"></div>
<script>
(function () {
  var TOKEN = ''; try { TOKEN = localStorage.getItem('progToken') || ''; } catch (e) {}
  var S = { vista: 'mes', mes: '', data: null };
  try { S.vista = localStorage.getItem('progVista') || 'mes'; } catch (e) {}
  var LOCS = ['MK', 'TOB', 'FRIDA'];
  var NL = { MK: 'Mercado Kennedy', TOB: 'Tobalaba', FRIDA: 'Frida Kahlo' };
  var DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  var ROLN = { ent: 'Entretención', cam: 'Cámara', edi: 'Edición' };
  var $app = document.getElementById('app');
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var plata = function (n) { return '$' + Number(n || 0).toLocaleString('es-CL'); };
  function aviso(t) { var a = document.getElementById('aviso'); a.textContent = t; a.classList.add('on'); clearTimeout(aviso.t); aviso.t = setTimeout(function () { a.classList.remove('on'); }, 1800); }
  function api(met, url, body) {
    return fetch(url, { method: met, headers: { 'Content-Type': 'application/json', 'x-prog': TOKEN }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (r.status === 401 && url !== '/api/prog/login') { TOKEN = ''; login(); throw new Error('Entra de nuevo'); } if (!r.ok) throw new Error(j.error || 'Error'); return j; }); });
  }
  function mesActual() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function moverMes(n) { var p = S.mes.split('-').map(Number); var d = new Date(p[0], p[1] - 1 + n, 1); S.mes = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); try { localStorage.setItem('progMes', S.mes); } catch (e) {} cargar(); }

  function login() {
    $app.innerHTML = '<form class="login"><h1>Programación KRB</h1><p class="vacio">Cartelera y turnos de los locales</p>' +
      '<input type="text" name="u" placeholder="Usuario" autocomplete="username" autocapitalize="none"><input type="password" name="p" placeholder="Clave" autocomplete="current-password" style="width:100%;background:#0f0d16;border:1px solid var(--linea);border-radius:7px;padding:8px 9px">' +
      '<button class="btn foco">Entrar</button><p class="faltan" id="err"></p></form>';
    $app.querySelector('form').onsubmit = function (e) {
      e.preventDefault();
      api('POST', '/api/prog/login', { user: this.u.value.trim(), pass: this.p.value }).then(function (j) { TOKEN = j.token; try { localStorage.setItem('progToken', TOKEN); } catch (x) {} cargar(); })
        .catch(function (x) { document.getElementById('err').textContent = x.message; });
    };
  }

  function marco(contenido) {
    var tabs = [['mes', 'Programación'], ['prellenar', 'Prellenar'], ['shows', 'Shows'], ['archivos', 'Archivos'], ['equipo', 'Equipo'], ['glosa', 'GLOSA']];
    return '<div class="top"><div class="wrap"><h1>Programación</h1><div class="mes"><button class="btn chico" data-mes="-1">◀</button><b>' + esc(S.data.nombre) + '</b><button class="btn chico" data-mes="1">▶</button></div></div></div>' +
      '<div class="wrap" id="cont">' + contenido + '</div>' +
      '<nav class="tabs">' + tabs.map(function (t) { return '<button data-vista="' + t[0] + '" class="' + (S.vista === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</nav>';
  }
  function cargar() {
    if (!TOKEN) return login();
    if (!S.mes) { try { S.mes = localStorage.getItem('progMes') || ''; } catch (e) {} S.mes = S.mes || mesActual(); }
    api('GET', '/api/prog/mes?m=' + S.mes).then(function (d) { S.data = d; pintar(); }).catch(function (e) { if (TOKEN) aviso(e.message); });
  }
  function pintar() {
    var y = window.scrollY;
    var html = S.vista === 'archivos' ? '<div id="arch"><p class="vacio">Armando los archivos…</p></div>' + vistaImportar() : S.vista === 'shows' ? vistaShows() : S.vista === 'prellenar' ? vistaPrellenar() : S.vista === 'equipo' ? vistaEquipo() : S.vista === 'glosa' ? vistaGlosa() : vistaMes();
    $app.innerHTML = marco(html);
    $app.querySelectorAll('[data-vista]').forEach(function (b) { b.onclick = function () { S.vista = b.dataset.vista; try { localStorage.setItem('progVista', S.vista); } catch (e) {} window.scrollTo(0, 0); pintar(); }; });
    $app.querySelectorAll('[data-mes]').forEach(function (b) { b.onclick = function () { moverMes(Number(b.dataset.mes)); }; });
    if (S.vista === 'mes' || S.vista === 'shows') enlazarMes();
    if (S.vista === 'prellenar') enlazarPrellenar();
    if (S.vista === 'archivos') { cargarArchivos(); enlazarImportar(); }
    if (S.vista === 'equipo') enlazarEquipo();
    if (S.vista === 'glosa') enlazarGlosa();
    window.scrollTo(0, y);
  }

  // ---------- Programación del mes ----------
  function personasDe(rol) { return S.data.personas.filter(function (p) { return p.roles.indexOf(rol) >= 0; }).map(function (p) { return p.nombre; }); }
  function selPersona(f, l, campo, valor, rol, etiqueta) {
    var pref = personasDe(rol); var otros = S.data.personas.map(function (p) { return p.nombre; }).filter(function (n) { return pref.indexOf(n) < 0; });
    if (valor && pref.indexOf(valor) < 0 && otros.indexOf(valor) < 0) pref.push(valor);
    var o = function (n) { return '<option' + (n === valor ? ' selected' : '') + '>' + esc(n) + '</option>'; };
    return '<div class="campo"><small>' + etiqueta + '</small><select data-f="' + f + '" data-l="' + l + '" data-k="' + campo + '" class="' + (valor ? '' : 'vacio') + '"><option value="">—</option>' +
      pref.sort().map(o).join('') + (otros.length ? '<optgroup label="Otras personas">' + otros.sort().map(o).join('') + '</optgroup>' : '') + '<option value="+">＋ Otra persona…</option></select></div>';
  }
  // ---------- Prellenar el mes: semana tipo y preguntas en orden (Cote, 23 nov) ----------
  var CAMPOS = [['dj', 'DJ', 'ent'], ['extra', 'Técnico o capacitación', 'ent'], ['cantante', 'Animador cantante', 'ent'], ['animador', 'Animador', 'ent'],
    ['camH', 'Cámara en vivo', 'cam'], ['camHx', 'Entre paréntesis, junto a la de en vivo', 'cam'], ['camV', 'Cámara vertical', 'cam'], ['camVx', 'Entre paréntesis, junto a la vertical', 'cam'], ['editor', 'Editor', 'edi']];
  var NOMBRE_CAMPO = {}; CAMPOS.forEach(function (c) { NOMBRE_CAMPO[c[0]] = c[0] === 'dj' ? 'DJ' : c[1].toLowerCase(); });
  var SLOTS = [['4|MK', 'Jueves · Mercado Kennedy'], ['5|MK', 'Viernes · Mercado Kennedy'], ['5|TOB', 'Viernes · Tobalaba'], ['5|FRIDA', 'Viernes · Frida Kahlo'], ['6|MK', 'Sábado · Mercado Kennedy'], ['6|FRIDA', 'Sábado · Frida Kahlo'], ['0|FRIDA', 'Domingo · Frida Kahlo']];
  function selPT(clave, campo, valor, rol, etiqueta) {
    return selPersona('', '', campo, valor, rol, etiqueta).replace('data-f="" data-l=""', 'data-pt="' + clave + '"');
  }
  function fechasDe(wds) { return S.data.fechas.filter(function (x) { return !x.cortesia && wds.indexOf(x.wd) >= 0; }); }
  function etqDia(x) { return DIAS[x.wd] + ' ' + Number(x.fecha.slice(8)); }
  function vistaPrellenar() {
    var d = S.data; var A = d.asist || {}; var P = d.plantilla || {};
    var h = '<div class="panel"><h2>Prellenar ' + esc(d.nombre) + '</h2><p>Revisa los pasos en orden, toca «Prellenar el mes» y después ajusta lo que quieras en la pestaña Programación. El prellenado <b>solo llena lo vacío</b>: nunca borra lo que ya marcaste. Cuando esté aprobado, se envía a la GLOSA.</p></div>';
    // Paso 1: días que no se trabaja este mes
    var cer = A.cerrados || d.fechas.filter(function (x) { return x.cerrado; }).map(function (x) { return x.fecha; });
    h += '<div class="panel paso"><h3>1 · Días que no se trabaja</h3><p>¿Hay días de ' + esc(d.nombre) + ' en que no se va a trabajar (feriados u otros)? Márcalos. Esos días quedan cerrados en todos los locales y esa semana no corre la regla de los tres días.</p>' +
      fechasDe([4, 5, 6, 0]).map(function (x) { return '<label class="chk"><input type="checkbox" data-si="cerrados" value="' + x.fecha + '"' + (cer.indexOf(x.fecha) >= 0 ? ' checked' : '') + '>' + etqDia(x) + '</label>'; }).join('') + '</div>';
    // Paso 2: semana tipo
    h += '<div class="panel paso"><h3>2 · Semana tipo</h3><p>Con esto se llena cada día. Confírmala o cámbiala antes de partir el mes. Los cantantes que se reparten (viernes en Kennedy y viernes y sábado en Frida) van vacíos.</p>' +
      '<details><summary class="btn chico" style="display:inline-block;margin:6px 0">Ver y cambiar la semana tipo</summary>' +
      SLOTS.map(function (s) {
        var c = P[s[0]] || {}; var l = s[0].split('|')[1];
        return '<div class="loc" style="--c:var(--' + l + ');background:var(--panel2);border-radius:10px;margin:8px 0"><h4><span>' + s[1] + '</span></h4><div class="fila">' +
          CAMPOS.map(function (k) { return selPT(s[0], k[0], c[k[0]], k[2], k[1]); }).join('') +
          '<div class="campo" style="flex:0 1 110px"><small>Horario de cámara</small><input type="text" value="' + esc(c.camNota) + '" data-pt="' + s[0] + '" data-k="camNota"></div></div></div>';
      }).join('') + '</details></div>';
    // Pasos de las personas
    var n = 3;
    (d.pasos || []).forEach(function (p) {
      var sel = A[p.tipo === 'fijo' ? 'no' + p.id : p.id] || [];
      h += '<div class="panel paso"><h3>' + (n++) + ' · ' + esc(p.nombre) + '</h3>';
      if (p.tipo === 'fijo') {
        h += '<p>Los turnos de ' + esc(p.nombre) + ' según la semana tipo. Desmarca los días que no hace.</p>';
        var items = [];
        d.fechas.forEach(function (x) {
          if (x.cortesia) return;
          LOCS.forEach(function (l) {
            var c = P[x.wd + '|' + l]; if (!c || !x.locales[l].abierto) return;
            CAMPOS.forEach(function (k) { if (c[k[0]] === p.nombre && k[0] !== 'camHx' && k[0] !== 'camVx') items.push({ id: x.fecha + '|' + l + '|' + k[0], t: etqDia(x) + ' · ' + NL[l] + ' · ' + NOMBRE_CAMPO[k[0]] }); });
          });
        });
        h += items.map(function (it) { return '<label class="chk"><input type="checkbox" data-no="no' + p.id + '" value="' + it.id + '"' + (sel.indexOf(it.id) >= 0 ? '' : ' checked') + '>' + esc(it.t) + '</label>'; }).join('') || '<p class="vacio">No tiene turnos en la semana tipo.</p>';
        if (p.id === 'Oscar') {
          var doms = A.domOscar || [];
          h += '<p style="margin-top:10px">Domingos en Frida: marca los que hace Oscar como DJ (los otros, el de la semana tipo).</p>' +
            fechasDe([0]).filter(function (x) { return x.locales.FRIDA.abierto; }).map(function (x) { return '<label class="chk"><input type="checkbox" data-si="domOscar" value="' + x.fecha + '"' + (doms.indexOf(x.fecha) >= 0 ? ' checked' : '') + '>' + etqDia(x) + '</label>'; }).join('');
        }
      } else if (p.tipo === 'viernes') {
        h += '<p>Marca los dos viernes que dio ' + esc(p.nombre) + '. Va como animador cantante en Mercado Kennedy.</p>' +
          fechasDe([5]).map(function (x) { return '<label class="chk"><input type="checkbox" data-si="' + p.id + '" value="' + x.fecha + '"' + (sel.indexOf(x.fecha) >= 0 ? ' checked' : '') + '>' + etqDia(x) + '</label>'; }).join('');
      } else {
        h += '<p>Marca los días que tiene disponibles ' + esc(p.nombre) + '. Los cantantes que quedan se reparten parejo entre Priss y Kony.</p>' +
          fechasDe([5, 6]).map(function (x) { return '<label class="chk"><input type="checkbox" data-si="' + p.id + '" value="' + x.fecha + '"' + (sel.indexOf(x.fecha) >= 0 ? ' checked' : '') + '>' + etqDia(x) + '</label>'; }).join('');
      }
      h += '</div>';
    });
    h += '<div class="panel"><div class="fila"><button class="btn" id="asave">Guardar respuestas</button><button class="btn foco" id="aprell">Prellenar el mes</button></div><div id="ares"></div></div>';
    return h;
  }
  function leerAsist() {
    var a = {};
    (S.data.pasos || []).forEach(function (p) { a[p.tipo === 'fijo' ? 'no' + p.id : p.id] = []; }); a.domOscar = []; a.cerrados = [];
    document.querySelectorAll('[data-no]').forEach(function (c) { if (!c.checked) a[c.dataset.no].push(c.value); });
    document.querySelectorAll('[data-si]').forEach(function (c) { if (c.checked) a[c.dataset.si].push(c.value); });
    return a;
  }
  function enlazarPrellenar() {
    var guardarA = function () { return api('POST', '/api/prog/asist', { mes: S.mes, asist: leerAsist() }).then(function (j) { S.data.asist = j.asist; return api('GET', '/api/prog/mes?m=' + S.mes); }).then(function (d) { S.data = d; }); };
    document.getElementById('asave').onclick = function () { guardarA().then(function () { aviso('Respuestas guardadas'); pintar(); }).catch(function (e) { aviso(e.message); }); };
    document.getElementById('aprell').onclick = function () {
      if (!confirm('¿Prellenar ' + S.data.nombre + '? Solo se llena lo que está vacío.')) return;
      guardarA().then(function () { return api('POST', '/api/prog/prellenar', { mes: S.mes }); }).then(function (j) {
        document.getElementById('ares').innerHTML = '<p class="ok">✔ Listo: ' + j.celdas + ' locales y días prellenados; ' + j.repartidos + ' cantantes repartidos entre Priss y Kony.</p>' +
          (j.sinNadie.length ? '<p>Quedaron sin cantante (nadie disponible), para completar a mano:</p><ul class="faltan">' + j.sinNadie.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') +
          '<p>Revisa y ajusta en la pestaña Programación. Los avisos de lo obligado (Oscar, Fer y Matías) salen en Archivos.</p>';
        return api('GET', '/api/prog/mes?m=' + S.mes).then(function (d) { S.data = d; });
      }).catch(function (e) { aviso(e.message); });
    };
    document.querySelectorAll('select[data-pt], input[data-pt]').forEach(function (el) {
      el.onchange = function () {
        var v = el.value;
        if (v === '+') { v = (prompt('Nombre corto de la persona:') || '').trim(); if (!v) { pintar(); return; } }
        var c = Object.assign({}, S.data.plantilla[el.dataset.pt] || {});
        if (v) c[el.dataset.k] = v.trim(); else delete c[el.dataset.k];
        api('POST', '/api/prog/plantilla', { clave: el.dataset.pt, celda: c }).then(function (j) { S.data.plantilla = j.plantilla; aviso('Semana tipo guardada'); }).catch(function (e) { aviso(e.message); });
      };
    });
  }
  var TIPOS_LOC = { MK: { 4: ['standup'], 5: ['piano'], 6: ['tributo', 'otro'] }, TOB: { 5: ['otro'] }, FRIDA: { 5: ['doble', 'otro'], 6: ['doble', 'otro'], 0: ['bingo'] } };

        return '<tr data-t="' + i + '"><td><select data-tk="persona">' + opt([['*', 'Todos']].concat(codigos.concat(codigos.indexOf(t.persona) < 0 && t.persona !== '*' ? [t.persona] : []).map(function (c) { return [c, c]; })), t.persona) + '</select></td>' +
          '<td><select data-tk="rol">' + opt([['ent', 'Entretención'], ['cam', 'Cámara'], ['edi', 'Edición']], t.rol) + '</select></td>' +
          '<td><select data-tk="local">' + opt([['*', 'Todos'], ['MK', 'Kennedy'], ['TOB', 'Tobalaba'], ['FRIDA', 'Frida']], t.local) + '</select></td>' +
          '<td><select data-tk="dia">' + opt([['*', 'Todos'], ['4', 'Jueves'], ['5', 'Viernes'], ['6', 'Sábado'], ['0', 'Domingo']], t.dia) + '</select></td>' +
          '<td><input type="number" data-tk="monto" value="' + t.monto + '" step="5000" min="0"></td><td><button class="btn chico" data-tdel="' + i + '">✕</button></td></tr>';
      }).join('') + '</table><div class="fila" style="margin-top:8px"><button class="btn chico" id="tadd">＋ Tarifa</button><button class="btn foco chico" id="tsave">Guardar tarifas</button></div></div>';
    var hor = '<div class="panel"><h2>Horarios de la cartelera</h2><p>Lo que va bajo el nombre de cada local en la cartelera.</p>' + LOCS.map(function (l) { return '<div class="campo" style="margin:8px 0"><small>' + NL[l] + '</small><textarea rows="5" data-h="' + l + '">' + esc(d.horarios[l] || '') + '</textarea></div>'; }).join('') + '<button class="btn foco chico" id="hsave">Guardar horarios</button></div>';
    return pers + tar + hor;
  }
  function leerPersonas() { return Array.prototype.map.call(document.querySelectorAll('tr[data-p]'), function (tr) { return { nombre: tr.querySelector('[data-pk=nombre]').value, codigo: tr.querySelector('[data-pk=codigo]').value, roles: Array.prototype.filter.call(tr.querySelectorAll('[data-pr]'), function (c) { return c.checked; }).map(function (c) { return c.dataset.pr; }) }; }); }
  function leerTarifas() { return Array.prototype.map.call(document.querySelectorAll('tr[data-t]'), function (tr) { var o = {}; tr.querySelectorAll('[data-tk]').forEach(function (e) { o[e.dataset.tk] = e.value; }); return o; }); }
  function enlazarEquipo() {
    document.getElementById('padd').onclick = function () { S.data.personas = leerPersonas(); S.data.personas.push({ nombre: '', codigo: '', roles: [] }); pintar(); };
    document.querySelectorAll('[data-pdel]').forEach(function (b) { b.onclick = function () { S.data.personas = leerPersonas(); S.data.personas.splice(Number(b.dataset.pdel), 1); pintar(); }; });
    document.getElementById('psave').onclick = function () { api('POST', '/api/prog/personas', { personas: leerPersonas() }).then(function (j) { S.data.personas = j.personas; aviso('Equipo guardado'); cargar(); }).catch(function (e) { aviso(e.message); }); };
    document.getElementById('tadd').onclick = function () { S.data.tarifas = leerTarifas(); S.data.tarifas.push({ persona: '*', rol: 'ent', local: '*', dia: '*', monto: 0 }); pintar(); };
    document.querySelectorAll('[data-tdel]').forEach(function (b) { b.onclick = function () { S.data.tarifas = leerTarifas(); S.data.tarifas.splice(Number(b.dataset.tdel), 1); pintar(); }; });
    document.getElementById('tsave').onclick = function () { api('POST', '/api/prog/tarifas', { tarifas: leerTarifas() }).then(function (j) { S.data.tarifas = j.tarifas; aviso('Tarifas guardadas'); cargar(); }).catch(function (e) { aviso(e.message); }); };
    document.getElementById('hsave').onclick = function () { var b = {}; document.querySelectorAll('[data-h]').forEach(function (t) { b[t.dataset.h] = t.value; }); api('POST', '/api/prog/horarios', b).then(function () { aviso('Horarios guardados'); cargar(); }).catch(function (e) { aviso(e.message); }); };
  }

  // ---------- GLOSA ----------
  function vistaGlosa() {
    var g = S.data.glosa; var u = g.ultimo;
    var h = '<div class="panel"><h2>Enviar ' + esc(S.data.nombre) + ' a la GLOSA</h2>';
    if (!g.url) h += '<p>Primero conecta la GLOSA (abajo).</p>';
    else h += '<p>Escribe la hoja TURNOS con lo de este mes y llena la pestaña del mes: semanas de jueves a domingo, presupuesto neto solo los días con actividad (los demás en cero), montos de los shows y el mes en B8. Si falta la pestaña del mes, se crea duplicando la del mes anterior.</p><div class="fila"><button class="btn foco" id="genv">Enviar y llenar el mes</button><button class="btn" id="gcmp">Comparar con la GLOSA</button><button class="btn" id="gtraer">Traer los shows de la GLOSA</button></div>';
    h += '<p id="gest">' + (u ? estadoTxt(u) : '') + '</p><div id="gres"></div></div>';
    h += '<div class="panel"><h2>Conectar la GLOSA</h2><ol class="pasos">' +
      '<li>Abre la planilla <b>GLOSA KRB STAGE OFICIAL 2026</b> con la cuenta dueña (la de Kennedy).</li>' +
      '<li>Extensiones → Apps Script. A la izquierda, junto a «Archivos», toca <b>＋ → Secuencia de comandos</b> y llámalo <code>Programacion</code>.</li>' +
      '<li>Borra lo que traiga, pega el script (botón de abajo) y guarda con el disquete. No toques el archivo de llenarMes.</li>' +
      '<li>Arriba a la derecha: <b>Implementar → Nueva implementación</b>. En el engranaje elige <b>Aplicación web</b>. Ejecutar como: <b>Yo</b>. Quién tiene acceso: <b>Cualquier persona</b>. Toca Implementar y acepta los permisos.</li>' +
      '<li>Copia la <b>URL de la aplicación web</b> (termina en /exec) y pégala aquí.</li></ol>' +
      '<p><b>Actualizar el script</b> (cuando Code 3 lo pida): copia el script, ábrelo en Apps Script en el archivo <code>Programacion</code>, borra todo, pega y guarda. Después <b>Implementar → Administrar implementaciones</b>, toca el lápiz, en Versión elige <b>Nueva versión</b> y toca Implementar. La URL no cambia.</p>' +
      '<div class="fila"><button class="btn foco chico" id="gscript">Copiar el script</button></div>' +
      '<div class="fila" style="margin-top:10px"><div class="campo"><small>URL de la aplicación web</small><input type="text" id="gurl" value="' + esc(g.url) + '" placeholder="https://script.google.com/macros/s/…/exec"></div><button class="btn chico" id="gsave">Guardar</button></div></div>';
    return h;
  }
  function estadoTxt(u) {
    if (u.estado === 'enviando') return 'Enviando ' + u.mes + '… (puede tardar unos minutos)';
    if (u.estado === 'listo') return '<span class="ok">✔ ' + u.mes + ' enviado a la GLOSA' + (u.creada ? ' (se creó la pestaña del mes)' : '') + '.</span>' + (u.aviso ? ' <span class="faltan">' + esc(u.aviso) + '</span>' : '');
    if (u.estado === 'error') return '<span class="faltan">No se pudo enviar ' + esc(u.mes) + ': ' + esc(u.error) + '</span>';
    return '';
  }
  function seguir() { api('GET', '/api/prog/glosa/estado').then(function (u) { var e = document.getElementById('gest'); if (e) e.innerHTML = estadoTxt(u); if (u.estado === 'enviando') setTimeout(seguir, 3000); else S.data.glosa.ultimo = u; }); }
  function enlazarGlosa() {
    var $ = function (id) { return document.getElementById(id); };
    $('gscript').onclick = function () { fetch('/api/prog/glosa/script', { headers: { 'x-prog': TOKEN } }).then(function (r) { return r.text(); }).then(function (t) { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { navigator.clipboard.writeText(t); } catch (e) { document.execCommand('copy'); } document.execCommand('copy'); ta.remove(); aviso('Script copiado'); }); };
    $('gsave').onclick = function () { api('POST', '/api/prog/glosa', { url: $('gurl').value }).then(function (j) { S.data.glosa.url = j.url; aviso('Guardado'); pintar(); }).catch(function (e) { aviso(e.message); }); };
    if ($('genv')) $('genv').onclick = function () {
      if (!confirm('¿Enviar ' + S.data.nombre + ' a la GLOSA? Se reemplaza lo que haya en la hoja TURNOS y se llena la pestaña del mes.')) return;
      api('POST', '/api/prog/glosa/enviar', { mes: S.mes }).then(function (u) { $('gest').innerHTML = estadoTxt(u); setTimeout(seguir, 3000); }).catch(function (e) { aviso(e.message); });
    };
    if ($('gcmp')) $('gcmp').onclick = function () {
      $('gres').innerHTML = '<p>Leyendo la GLOSA…</p>';
      api('GET', '/api/prog/glosa/leer?m=' + S.mes).then(function (r) {
        var h = '<p>La hoja TURNOS tiene <b>' + esc(r.pestana || '(sin pestaña)') + '</b>.' + (r.mismoMes ? '' : ' <span class="faltan">No es el mes que estás viendo.</span>') + '</p>';
        if (!r.soloGlosa.length && !r.soloAca.length) h += '<p class="ok">✔ Igual a la plataforma (' + r.iguales + ' líneas).</p>';
        else h += (r.soloAca.length ? '<p>Solo en la plataforma:</p><ul class="faltan">' + r.soloAca.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') + (r.soloGlosa.length ? '<p>Solo en la GLOSA:</p><ul>' + r.soloGlosa.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '');
        $('gres').innerHTML = h;
      }).catch(function (e) { $('gres').innerHTML = '<p class="faltan">' + esc(e.message) + '</p>'; });
    };
    if ($('gtraer')) $('gtraer').onclick = function () { api('POST', '/api/prog/glosa/traer').then(function (j) { aviso(j.shows + ' shows traídos (' + j.mes + ')'); cargar(); }).catch(function (e) { aviso(e.message); }); };
    if (S.data.glosa.ultimo && S.data.glosa.ultimo.estado === 'enviando') seguir();
  }

  cargar();
})();
</script>
</body>
</html>
