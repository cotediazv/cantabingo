<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<!--
  Pantalla de los locales, versión liviana (pedido de Cote, 21 nov): la misma pantalla vertical, escrita para navegadores
  antiguos (el Chrome del decodificador de Kennedy y el iPad viejo con iOS 9.3.5). JavaScript antiguo (ES5, sin flechas,
  sin let/const, sin plantillas `...`), XMLHttpRequest y CSS sin grid ni flex, sin «inset» ni «aspect-ratio».
  Sigue las mismas reglas que la pantalla completa (vertical.js): el video de la cartelera, la información del local
  (sala light), el karaoke o los juegos de la sala completa del local.
  Dirección: /pv.html?p=<pantalla>&girar=1 (girar: la pantalla de pie recibe la imagen horizontal y se entrega girada 90°
  a la derecha; solo se gira si la ventana está horizontal, así en el iPad de pie se ve derecha).
  Las pantallas antiguas llegan solas aquí desde #/vertical/<pantalla> (ver el aviso al comienzo de index.html).
-->
<style>

  * { box-sizing: border-box; -webkit-box-sizing: border-box; }

  #cv.th-tobalaba { background: #3b0508; background: -webkit-linear-gradient(290deg, #2a0406, #8f1d1d 55%, #2a0406); background: linear-gradient(160deg, #2a0406, #8f1d1d 55%, #2a0406); }

  #view { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #cv.wide #view { left: 50%; width: 56.25rem; margin-left: -28.125rem; }

  .lv-bigqr .qrw { width: 34rem; }
  /* Karaoke a pantalla completa */
  .kf-now { position: absolute; left: 3rem; right: 3rem; top: 16rem; height: 31rem; padding: 3rem 2.4rem; text-align: center; }
  .kf-now small { display: block; font-size: 3.2rem; color: #ffc400; font-weight: 700; }
  .kf-now b { display: block; margin-top: 1.4rem; font-size: 7rem; line-height: 1.1; font-weight: 700; }
  .kf-now span { display: block; margin-top: 1.2rem; font-size: 3.8rem; }

  .kf-bottom { position: absolute; left: 3rem; right: 3rem; top: 50rem; bottom: 6rem; white-space: nowrap; }

  .g-sub { font-size: 2.8rem; color: #ffd76a; font-weight: 600; }
  .ball { position: absolute; left: 50%; top: 15rem; width: 32rem; height: 32rem; margin-left: -16rem; border-radius: 50%; background: #fff; color: #1a1a1a; text-align: center; border: 1.4rem solid #ffc400; }
  .ball small { display: block; margin-top: 3.4rem; font-size: 5rem; font-weight: 700; color: #c4175e; }
  .ball b { display: block; font-size: 13rem; line-height: 1; font-weight: 700; }
  .prev { top: 49rem; }
  .prev span { display: inline-block; width: 7rem; height: 7rem; margin: 0 .6rem; border-radius: 50%; background: rgba(255, 255, 255, .9); color: #1a1a1a; font-size: 2.6rem; line-height: 7rem; font-weight: 700; }
  .rows { margin: 0; padding: 0; list-style: none; text-align: left; }
  .rows li { margin: 0 0 1.2rem; padding: 1.2rem 2rem; border-radius: 1.6rem; background: rgba(8, 6, 26, .72); font-size: 3.2rem; line-height: 1.15; white-space: nowrap; overflow: hidden; }
  .rows li em { display: inline-block; width: 4.6rem; font-style: normal; color: #ffc400; font-weight: 700; }
  .rows li i { float: right; font-style: normal; color: #ffc400; font-weight: 700; margin-left: 1.4rem; }
  .rows li.top { font-size: 3.8rem; }
  .bar { position: relative; overflow: hidden; }
  .bar u { position: absolute; left: 0; top: 0; bottom: 0; opacity: .5; text-decoration: none; }
  .bar span, .bar i { position: relative; }
  .big { font-size: 7rem; font-weight: 700; line-height: 1.1; }
  .mid { font-size: 4rem; font-weight: 600; line-height: 1.2; }
  .clock { font-size: 5rem; font-weight: 700; color: #ffc400; }
  .qr-foot { bottom: 6rem; }
  .qr-foot .qrw { width: 20rem; }
  .qr-foot .qrp { margin-top: 1rem; color: #fff; font-size: 2.2rem; }
  /* Botón «Pantalla completa» (pedido de Cote, 21 nov): aparece al tocar la pantalla y se esconde solo a los 8 s */
  #fs { position: absolute; right: 2rem; top: 2rem; z-index: 50; margin: 0; padding: 1.4rem 2.4rem; border: .3rem solid #ffc400; border-radius: 1.6rem; background: #000; background: rgba(0, 0, 0, .78); color: #fff; font-family: 'Fredoka', 'Trebuchet MS', Arial, sans-serif; font-size: 2.8rem; font-weight: 700; line-height: 1.1; -webkit-appearance: none; cursor: pointer; }
  #diag { position: fixed; left: 0; right: 0; bottom: 0; z-index: 99; margin: 0; padding: 8px; font: 12px/1.35 monospace; background: #fff; color: #000; white-space: pre-wrap; word-wrap: break-word; max-height: 45%; overflow: auto; }
</style>

<body>
<div id="cv">
  <video id="vid" class="hide" muted loop autoplay playsinline webkit-playsinline preload="auto"></video>
  <div id="tap" class="hide">▶ Toca la pantalla para iniciar el video</div>
  <button id="fs" class="hide" type="button">📺 Pantalla completa</button>
  <div id="view"></div>
  <div id="marks"></div>
</div>
<script src="gameintro.js"></script>
<script>
(function () {
  'use strict';
  // ---------- Utilidades (ES5) ----------
  function $(id) { return document.getElementById(id); }
  function h(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function query() { var o = {}; var q = location.search.replace(/^\?/, '').split('&'); for (var i = 0; i < q.length; i++) { if (!q[i]) continue; var kv = q[i].split('='); o[decodeURIComponent(kv[0])] = decodeURIComponent((kv[1] || '').replace(/\+/g, ' ')); } return o; }
  var Q = query();
  var errs = [];
  window.onerror = function (m, f, l) { errs.push(String(m) + (f ? ' · ' + String(f).split('/').pop() + ':' + l : '')); };
  var SCREENS = { kennedy: ['kennedy', true], 'kennedy-h': ['kennedy', false], frida: ['frida', true], 'frida-h': ['frida', false], 'tobalaba-v': ['tobalaba', true], tobalaba: ['tobalaba', false] };
  var P = SCREENS[Q.p] ? Q.p : 'kennedy';
  var VENUE = SCREENS[P][0];
  var NAMES = { kennedy: 'Mercado Kennedy', frida: 'Frida Kahlo', tobalaba: 'Tobalaba' }; // nombre del local (pedido de Cote, 21 nov)
  var SHORT = { kennedy: 'Mercado Kennedy', frida: 'Frida', tobalaba: 'Tobalaba' }; // en los juegos también «Mercado Kennedy» (pedido de Cote, 21 nov)
  var FIG = { linea: 'Línea (cualquiera)', horizontal: 'Línea horizontal', vertical: 'Línea vertical', diagonal: 'Diagonal', 'dos-lineas': 'Dos líneas', esquinas: 'Cuatro esquinas', sello: 'Sello (2×2 en una esquina)', cruz: 'Cruz', marco: 'Marco', cuadro: 'Cuadro central', diamante: 'Diamante', piramide: 'Pirámide', 'piramide-inv': 'Pirámide invertida', reloj: 'Reloj de arena', corazon: 'Corazón', estrella: 'Estrella', lleno: 'Cartón lleno' };
  var GAMES = { bingo: ['🎱', 'Bingo'], rosco: ['🎡', 'El Rosco'], festival: ['🎤', 'El Festival de ' + SHORT[VENUE]], objeto: ['🗳️', 'El objeto más extraño'] };
  var GVC = { bingo: '#ff2e93', rosco: '#9b6bff', festival: '#ffc400', objeto: '#19d6b0' };
  var offset = 0;
  var cv = $('cv'); var view = $('view'); var vid = $('vid'); var tap = $('tap');
  function now() { return new Date().getTime() + offset; }
  function origin() { return location.protocol + '//' + location.host; }
  function qrImg(url) { return '<img alt="Código QR" src="/api/qr?text=' + encodeURIComponent(url) + '">'; }
  function clock(ms) { var s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function cap(t) { return String(t || '').toLowerCase().replace(/(^|[\s:(«"\-])([a-záéíóúñü])/g, function (m, a, b) { return a + b.toUpperCase(); }); }
  var DAYS = { LUNES: 'Lunes', MARTES: 'Martes', MIERCOLES: 'Miércoles', 'MIÉRCOLES': 'Miércoles', JUEVES: 'Jueves', VIERNES: 'Viernes', SABADO: 'Sábado', 'SÁBADO': 'Sábado', DOMINGO: 'Domingo' };
  function day(d) { return DAYS[String(d || '').toUpperCase()] || String(d || ''); }
  function showHtml(t) {
    var m = String(t || '').match(/^(.*?)\s*\(([^()]+)\)\s*$/);
    return m ? '<span class="lv-sh">' + h(cap(m[1])) + '</span><span class="lv-by"><small>por</small> ' + h(cap(m[2])) + '</span>' : '<span class="lv-sh">' + h(cap(t)) + '</span>';
  }
  function votos(n) { return n + (n === 1 ? ' voto' : ' votos'); }
  function pct(n, t) { return t ? (n * 100) / t : 0; }
  function fmtPct(p) { var r = Math.round(p); return (r === 50 && p !== 50 ? p.toFixed(1).replace('.', ',') : r) + '%'; }
  function dec(x) { return x == null ? '' : String(Number(x).toFixed(1)).replace('.', ','); }
  function get(url, cb) {
    var x = new XMLHttpRequest();
    x.open('GET', url + (url.indexOf('?') < 0 ? '?' : '&') + '_=' + new Date().getTime(), true);
    x.timeout = 15000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      var r = null;
      try { r = JSON.parse(x.responseText); } catch (e) { r = null; }
      if (r && r.now) offset = r.now - new Date().getTime();
      cb(x.status >= 200 && x.status < 300 ? r : null);
    };
    x.ontimeout = function () { cb(null); };
    x.send(null);
  }
  // Achica la letra de un texto de una línea hasta que quepa (nunca se corta)
  function fitLine(el) {
    if (!el) return;
    if (el.getAttribute('data-fs') === null) el.setAttribute('data-fs', el.style.fontSize || ''); // tamaño pedido en el diseño
    el.style.fontSize = el.getAttribute('data-fs');
    var fs = parseFloat(window.getComputedStyle(el).fontSize) || 20;
    for (var i = 0; i < 80 && el.scrollWidth > el.clientWidth + 1 && fs > 6; i++) { fs *= 0.95; el.style.fontSize = fs.toFixed(1) + 'px'; }
  }
  // Achica todo un recuadro (su tamaño de letra base) hasta que su contenido quepa en el alto
  function fitBox(el) {
    if (!el) return;
    var base = parseFloat(document.documentElement.style.fontSize) || 10;
    var f = 1;
    el.style.fontSize = base + 'px';
    for (var i = 0; i < 40 && el.scrollHeight > el.clientHeight + 1 && f > 0.4; i++) { f -= 0.04; el.style.fontSize = (base * f).toFixed(2) + 'px'; }
  }
  function fitAll() {
    var els = view.querySelectorAll('.fit');
    for (var i = 0; i < els.length; i++) fitLine(els[i]);
    var boxes = view.querySelectorAll('.fitbox');
    for (var j = 0; j < boxes.length; j++) fitBox(boxes[j]);
  }

  // ---------- Tamaño y giro ----------
  function layout() {
    var W = window.innerWidth; var H = window.innerHeight;
    var rot = Q.girar === '1' && W > H;
    var cw = rot ? H : W; var ch = rot ? W : H;
    cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
    cv.className = (rot ? 'rot ' : '') + 'th-' + VENUE + (cw > ch * 0.75 ? ' wide' : '');
    document.documentElement.style.fontSize = Math.min(ch / 100, cw / 56.25).toFixed(3) + 'px';
    fitAll();
  }
  window.onresize = layout;
  layout();
  $('marks').innerHTML = '<img src="krb-stage.svg" alt="KRB Stage">' + (VENUE === 'kennedy' ? '<i></i><img src="logo-kennedy.png" alt="Mercado Kennedy">' : '');

  // ---------- Temporizadores de cada vista ----------
  var viewTimers = []; var stageTimers = [];
  function every(list, ms, f) { list.push(setInterval(f, ms)); }
  function clearList(list) { while (list.length) clearInterval(list.pop()); }

  // ---------- Video de la cartelera ----------
  var ver = 0; var playCheck = null;
  var vTicks = 0; var vStuck = 0; var vFixes = 0; var lastGesture = 0; var autoOk = false; var lastOk = 0; // vigilante del video (más abajo)
  function play() {
    var clean = !lastGesture; // todavía nadie tocó ni apretó nada: si parte, es que aquí el video parte solo
    try { var pr = vid.play(); if (pr && pr.then) pr.then(function () { if (clean) autoOk = true; }, function () {}); } catch (e) { /* nada */ }
    clearTimeout(playCheck);
    playCheck = setTimeout(function () { if (cur === 'video' && vid.paused) tap.className = ''; }, 3000); // iPad antiguo: hay que tocar
  }
  function onTouch() { if (cur === 'video') { tap.className = 'hide'; play(); } }
  document.addEventListener('click', onTouch, false);
  document.addEventListener('touchend', onTouch, false);
  vid.addEventListener('playing', function () { tap.className = 'hide'; }, false);

  // ---------- Pantalla completa (pedido de Cote, 21 nov) ----------
  // Donde el navegador lo permite (decodificador, iPad nuevos), toda la página pasa a pantalla completa. En el iPad viejo
  // (iOS 9) eso no existe: el botón abre el video en la pantalla completa del iPad. El botón aparece al tocar la pantalla
  // (o mover el mouse o apretar una tecla del control) y se esconde solo a los 8 segundos, para no quedar a la vista del público.
  var fsBtn = $('fs'); var fsHide = null; var fsFirst = true;
  var IOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement || document.webkitCurrentFullScreenElement || document.mozFullScreenElement || document.msFullscreenElement || null; }
  function fsReq() { var el = document.documentElement; return el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen || el.mozRequestFullScreen || el.msRequestFullscreen || null; }
  function pageFsOk() {
    var en = document.fullscreenEnabled || document.webkitFullscreenEnabled || document.mozFullScreenEnabled || document.msFullscreenEnabled;
    return !!fsReq() && (en === true || (en === undefined && !IOS));
  }
  // La pantalla completa del video de Apple (iPad viejo) muestra el video sin girar: con la página girada no sirve
  // (pedido de Cote: el video tiene que verse girado). La de página (decodificador) sí mantiene el giro.
  function videoFsOk() { return cur === 'video' && !!vid.webkitEnterFullscreen && !/(^| )rot( |$)/.test(cv.className); }
  var embedded = false; // dentro de otra página (ej. las pantallas incrustadas en krbstage.cl) el botón no va
  try { embedded = window.self !== window.top; } catch (e) { embedded = true; }
  function fsCan() { return !embedded && !fsEl() && (pageFsOk() || videoFsOk()); }
  function fsShow() {
    clearTimeout(fsHide);
    if (!fsCan()) { fsBtn.className = 'hide'; return; }
    fsBtn.className = '';
    fsHide = setTimeout(function () { fsBtn.className = 'hide'; }, 8000);
  }
  fsBtn.onclick = function (e) {
    if (e && e.stopPropagation) e.stopPropagation();
    clearTimeout(fsHide); fsBtn.className = 'hide';
    if (cur === 'video' && vid.paused) onTouch(); // si el navegador pedía tocar para partir, este toque lo parte
    if (pageFsOk()) { try { fsReq().call(document.documentElement); return; } catch (x) { /* sigue con el video */ } }
    if (videoFsOk()) {
      try { if (vid.paused) play(); vid.webkitEnterFullscreen(); } catch (x2) { tap.className = ''; } // si el video aún no carga: tocar y volver a intentar
    }
  };
  document.addEventListener('touchstart', fsShow, false);
  document.addEventListener('mousemove', fsShow, false);
  document.addEventListener('keydown', function () { onTouch(); fsShow(); if (!fsBtn.className) { try { fsBtn.focus(); } catch (x) { /* nada */ } } }, false); // una tecla del control también parte el video
  window.addEventListener('resize', function () { if (!fsBtn.className && !fsCan()) fsBtn.className = 'hide'; }, false); // si se gira el iPad con el botón a la vista
  var fsEv = ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'];
  for (var fe = 0; fe < fsEv.length; fe++) document.addEventListener(fsEv[fe], fsShow, false);
  vid.addEventListener('webkitendfullscreen', function () { if (cur === 'video') play(); }, false); // al volver de la pantalla completa del iPad, el video sigue

  // ---------- Vigilante del video (pedido de Cote, 21 nov) ----------
  // Cada 10 s revisa que el video esté avanzando. Si se detuvo, lo vuelve a partir; si lleva 20 s congelado (sin avanzar),
  // lo vuelve a cargar; si aun así no se recupera, recarga la página, pero solo donde el video parte solo (en el iPad viejo
  // una recarga volvería a pedir el toque). Si todo anda bien no hace nada: sin parpadeos ni descargas de más.
  vid.addEventListener('timeupdate', function () { if (vid.currentTime > 0) vTicks++; }, false); // solo avances reales (volver a cargar avisa en 0)
  vid.addEventListener('playing', function () { if (!lastGesture) autoOk = true; }, false); // partió sin que nadie tocara: aquí el video parte solo
  function wasTouched() { lastGesture = new Date().getTime(); }
  document.addEventListener('touchstart', wasTouched, false);
  document.addEventListener('mousedown', wasTouched, false);
  document.addEventListener('keydown', wasTouched, false);
  setInterval(function () {
    var moved = vTicks > 0; vTicks = 0;
    if (cur !== 'video' || !vid.getAttribute('src')) { vStuck = 0; vFixes = 0; return; }
    var broken = !!vid.error; // el video quedó con error (se cortó la red o el servidor): se trata como congelado
    if (vid.paused && !broken) { vStuck = 0; play(); return; } // se detuvo: a seguir (si el navegador pide un toque, queda el aviso para tocar)
    if (moved && !broken) { vStuck = 0; vFixes = 0; return; }
    if (++vStuck < 2) return;
    vStuck = 0; vFixes++;
    try {
      if (vFixes === 1) vid.load(); // 1.º: volver a cargar el mismo video (sin descargarlo de nuevo)
      else if (vFixes === 2) { var clean = vid.src.replace(/[?&]r=\d+$/, ''); vid.src = clean + (clean.indexOf('?') < 0 ? '?' : '&') + 'r=' + new Date().getTime(); } // 2.º: bajarlo de nuevo, una vez
      else if (autoOk && !fsEl() && reloadOk() && serverOk()) { reloadMark(); location.reload(); return; } // 3.º: recargar la página (como máximo cada 30 min y solo si el servidor acaba de responder)
      else if (vFixes % 6 === 0) vid.load(); // y después, de vez en cuando, sin descargar de más
    } catch (e) { /* nada */ }
    play();
  }, 10000);
  // Solo se recarga la página si el servidor respondió hace menos de 10 s: recargar con el servidor o internet caídos
  // dejaría la pantalla en una página de error, sin nada que la recupere
  function serverOk() { return new Date().getTime() - lastOk < 10000; }
  function reloadOk() { try { return new Date().getTime() - (+window.localStorage.getItem('pvReloadAt') || 0) > 30 * 60 * 1000; } catch (e) { return true; } }
  function reloadMark() { try { window.localStorage.setItem('pvReloadAt', String(new Date().getTime())); } catch (e) { /* nada */ } }

  // ---------- Vistas ----------
  var cur = '';
  function go(want) {
    cur = want;
    clearList(viewTimers); clearList(stageTimers);
    tap.className = 'hide';
    if (want !== 'video') { try { if (vid.webkitDisplayingFullscreen && vid.webkitExitFullscreen) vid.webkitExitFullscreen(); } catch (e) { /* nada */ } } // empieza un juego: sale de la pantalla completa del video
    if (!fsBtn.className && !fsCan()) fsBtn.className = 'hide';
    if (fsFirst) { fsFirst = false; fsShow(); } // al abrir la página, el botón se ve unos segundos
    $('marks').className = want === 'video' || want === 'logo' ? 'hide' : ''; // sobre el video no van los logos
    if (want === 'video') { view.innerHTML = ''; vid.className = ''; play(); return; }
    vid.className = 'hide';
    try { vid.pause(); } catch (e) { /* nada */ }
    if (want === 'logo') { view.innerHTML = '<img class="logo-big" src="krb-stage.svg" alt="KRB Stage">'; return; }
    if (want === 'karaoke') { lightJoin(function (url) { if (cur === 'karaoke') viewKaraoke(VENUE, url, viewTimers); }); return; }
    if (want === 'sala') { viewSala(); return; }
    viewInfo(want === 'info-qr' ? 'qr' : want === 'info-show' ? 'show' : want === 'info-kar' ? 'kar' : '');
  }

  // del karaoke de la sala light (Karaoke y QR grande y lista); con los demás, sin QR
  var QR_ONLY_KAR = { kennedy: true };

  function lightJoin(cb) {

  }

  // Información del local (como el fondo vertical de la sala light): lo de esta noche, un recuadro que va cambiando y el QR
  function viewInfo(focus) {

    if (focus === 'qr' || !withQr) { $('lvfoot').className = 'lv-qr hide'; view.querySelector('.lv-card').style.bottom = '6rem'; }
    lightJoin(function (url) { var b = $('lvqr'); if (b && withQr) b.innerHTML = qrImg(url); paint(); });
    function slides() {
      var out = []; var i;

        if (list.length) { s += '<h2>🎤 Próximos en cantar</h2><ol class="lv-list">'; for (i = 0; i < list.length && i < 4; i++) s += '<li><b>' + h(list[i].name) + '</b><span>' + h(list[i].song) + '</span></li>'; s += '</ol>'; }
        return [s];
      }
      if (list.length) {
        var a = list[0];
        var k = '<h2>🎤 Karaoke</h2><div class="lv-now"><small>Ahora canta</small><b>' + h(a.name) + '</b><span>' + h(a.song) + (a.artist ? ' · ' + h(a.artist) : '') + '</span></div>';
        if (list.length > 1) { k += '<ol class="lv-list" start="2">'; for (i = 1; i < list.length && i < 3; i++) k += '<li><b>' + h(list[i].name) + '</b><span>' + h(list[i].song) + '</span></li>'; k += '</ol>'; }

      if (cart && (cart.current || cart.next)) {

      }
      var blocks = (cart && cart.blocks) || []; var week = (cart && cart.week) || []; var month = (cart && cart.month) || [];
      if (cart && !blocks.length) {
        for (i = 0; i < week.length; i++) {

        out.push(ws + '</ul>');
      }
      if (month.length) {

        for (i = 0; i < month.length && i < 6; i++) ms += '<li><em>' + h(cap(month[i].day)) + '</em><b>' + showHtml(month[i].show) + '</b></li>';
        out.push(ms + '</ul>');

      if (focus === 'show') {

        for (i = 0; i < out.length; i++) if (out[i].indexOf('<h2>⏱️') === 0 || out[i].indexOf('<h2>🕗') === 0) keep.push(out[i]);
        if (keep.length) return keep;

      if (!out.length) out.push('<h2>🎶 Bienvenidos</h2><div class="lv-now"><b>KRB Stage</b><span>Música, shows y karaoke</span></div>');

    function paint() {

  // Karaoke a pantalla completa: quién canta, los que vienen y el QR para pedir canciones
  function viewKaraoke(venue, joinUrl, timers) {
    var last = '';

      var list = st.list || []; var a = list[0];

    load();

  // ---------- Juegos de la sala completa del local ----------
  function viewSala() {
    var stage = '';
    view.innerHTML = '';
    function loop() {
      get('/api/stage', function (r) {
        if (!r || cur !== 'sala') return;
        if (r.show === stage) return;
        stage = r.show;
        clearList(stageTimers);
        view.innerHTML = '';
        if (stage === 'bingo') sBingo();
        else if (stage === 'rueda') sRosco();
        else if (stage === 'sorteo') sRaffle();
        else if (stage === 'voto') sVote();
        else if (stage === 'juego') sDraw();
        else if (stage === 'votojuego') sGameVote();
        else if (stage === 'karaoke') viewKaraoke(VENUE, origin() + '/#/jugar', stageTimers);
        else if (stage === 'qr') sQr();
        else if (stage === 'show') sShow();
        else if (stage === 'insta') sInsta();
        else sQr();
      });
    }
    loop();
    every(viewTimers, 2500, loop);
  }
  var JOIN = function () { return origin() + '/#/jugar'; };
  function qrFoot(text) { return '<div class="abs qr-foot"><div class="qrw">' + qrImg(JOIN()) + '</div><div class="qrp">' + h(text || 'Escanea el código QR con tu celular') + '</div></div>'; }
  function sQr() {
    view.innerHTML = '<div class="abs" style="top:8rem"><b class="big" style="display:block">📱</b><b class="mid fit" style="display:block">Escanea el código QR con tu celular</b></div>' +
      '<div class="abs" style="top:30rem"><div class="qrw" style="width:40rem">' + qrImg(JOIN()) + '</div></div>' +
      '<div class="abs mid" style="top:78rem">pon tu nombre, apellido y participa</div>';
    fitAll();
  }
  function letra(st, v) { var hs = String(st.headers || 'BINGO'); for (var c = 0; c < 5; c++) if (v <= Math.floor(((c + 1) * (st.values || 75)) / 5)) return hs.charAt(c); return hs.charAt(4); }
  function sBingo() {
    var sid = ''; var last = '';
    function paint(st) {
      var sig = JSON.stringify([st.drawn, st.bigQr, st.celebrate, st.results, st.patterns, st.round]);
      if (sig === last) return;
      last = sig;
      var title = String(st.name || '').replace(/^Los Juegos de /, 'El Bingo de ');
      var pid = (st.patterns || [])[0] || '';

      var drawn = st.drawn || [];

        var names = []; var seen = {};

  function sRaffle() {

  }
  function sVote() {
    var last = ''; var st = null;
    function paint() {
      var s = st;
      var sig = JSON.stringify([s.rev, s.phase, Math.floor(now() / 1000)]);
      if (sig === last) return;
      last = sig;
      var left = s.clockUntil ? clock(s.clockUntil - now()) : '';
      var o = '<div class="abs g-title fit">' + h(s.title) + '</div><div class="abs" style="top:16rem">';
      var thing = function (p) { return p && p.thing ? '<div class="mid fit" style="color:#ffd76a">' + h(p.thing) + '</div>' : ''; };
      if (s.phase === 'winner' && s.winner) o += '<div class="big gold">🏆 ¡Ganó!</div><b class="big fit" style="display:block">' + h(s.winner.name) + '</b>' + thing(s.winner) + (s.winner.score != null ? '<div class="mid">Nota ' + dec(s.winner.score) + '</div>' : '');
      else if (s.phase === 'final' && s.final && s.final.drum) o += '<div class="big gold">🥁</div><div class="mid">¡Redoble de tambores!</div>';
      else if (s.phase === 'final' && s.final) { o += '<div class="mid gold">Gran final</div>'; for (var f = 0; f < (s.final.players || []).length; f++) o += '<b class="big fit" style="display:block;font-size:5.4rem">' + h(s.final.players[f].name) + '</b>'; if (left && s.final.open) o += '<div class="clock">' + left + '</div>'; }
      else if (s.phase === 'results') { o += '<div class="mid gold">🏆 Resultados</div><ol class="rows" style="margin-top:2rem">'; var pl = s.places || []; for (var i = pl.length - 1; i >= 0; i--) o += '<li><em>' + pl[i].place + '.º</em>' + h(pl[i].name) + (pl[i].score != null ? '<i>' + dec(pl[i].score) + '</i>' : '') + '</li>'; o += '</ol>'; }
      else if (s.open) o += '<div class="mid gold">🗳️ Vota desde tu celular</div><b class="big fit" style="display:block">' + h(s.open.name) + '</b>' + thing(s.open) + (left ? '<div class="clock">' + left + '</div>' : '');
      else if (s.onstage) o += '<div class="mid gold">🎤 En el escenario</div><b class="big fit" style="display:block">' + h(s.onstage.name) + '</b>' + thing(s.onstage);
      else if (s.signup) { o += '<div class="mid gold">📝 Inscripciones abiertas</div>' + (left ? '<div class="clock">' + left + '</div>' : '') + '<ol class="rows" style="margin-top:2rem">'; var ps = s.players || []; for (var k = 0; k < ps.length && k < 8; k++) o += '<li>' + h(ps[k].name) + (ps[k].thing ? ' · ' + h(ps[k].thing) : '') + '</li>'; o += '</ol>'; }
      else if (s.last) o += '<div class="mid">Ya viene el siguiente participante</div>';
      else { o += '<div class="mid gold">Participantes</div><ol class="rows" style="margin-top:2rem">'; var pp = s.players || []; for (var m = 0; m < pp.length && m < 8; m++) o += '<li>' + h(pp[m].name) + (pp[m].thing ? ' · ' + h(pp[m].thing) : '') + '</li>'; o += '</ol>'; }
      o += '</div>' + qrFoot();
      view.innerHTML = o;
      fitAll();
    }
    function load() { get('/api/vote', function (r) { if (r && cur === 'sala') { st = r; paint(); } }); }
    load();
    every(stageTimers, 2000, load);
    every(stageTimers, 1000, function () { if (st) paint(); });
  }
  function sDraw() {
    var last = '';
    function paint(g) {
      var ready = g.ready && (!g.last || g.ready.at > g.last.at);
      var rolling = !ready && g.last && !g.last.direct && now() < g.last.at + 4500;
      var sig = JSON.stringify([g.list, g.total, ready, rolling, g.last && g.last.at]);
      if (sig === last) return;
      last = sig;
      var o = '';
      var n = ready ? g.list.length + 1 : g.list.length;
      if (ready) { o += '<div class="abs g-title fit">🎲 Sorteo del ' + n + '.º juego</div><div class="abs" style="top:16rem"><ol class="rows">'; for (var i = 0; i < g.ready.pool.length; i++) o += '<li class="top">' + GAMES[g.ready.pool[i]][0] + ' ' + h(GAMES[g.ready.pool[i]][1]) + '</li>'; o += '</ol></div>'; }
      else if (rolling) o += '<div class="abs g-title fit">🎲 Sorteo del ' + n + '.º juego</div><div class="abs big gold" style="top:30rem">🎲 Sorteando…</div>';
      else if (g.last) o += '<div class="abs g-title fit">🎲 El ' + n + '.º juego es</div><div class="abs" style="top:22rem"><b class="big fit gold" style="display:block">' + GAMES[g.last.game][0] + ' ' + h(GAMES[g.last.game][1]) + '</b></div>';
      o += '<div class="abs" style="top:52rem"><ol class="rows">';
      for (var k = 0; k < g.total; k++) o += '<li><em>' + (k + 1) + '.º</em>' + (g.list[k] ? GAMES[g.list[k]][0] + ' ' + h(GAMES[g.list[k]][1]) : '🔒') + '</li>';
      o += '</ol></div>';
      view.innerHTML = o;
      fitAll();
    }
    function load() { get('/api/gamedraw', function (g) { if (g && cur === 'sala') paint(g); }); }
    load();
    every(stageTimers, 1000, load);
  }
  function sGameVote() {
    var g = null; var introShown = -1;
    function paintIntro() {
      var GI = window.GAME_INTRO;
      if (!GI) return;
      var k = GI.stepOf(g.intro, now());
      if (k === introShown) return;
      introShown = k;
      var sl = GI.slides(SHORT[VENUE])[k];
      var o = '<div class="abs" style="top:4rem"><div class="g-sub" style="color:#ffc400;text-transform:uppercase">📢 Antes de votar · ' + (k + 1) + ' de 6</div><b class="big fit" style="display:block;font-size:5.4rem">' + sl.icon + ' ' + h(sl.title) + '</b></div>' +
        '<div class="abs" style="top:16rem"><div style="width:36rem;margin:0 auto">' + GI.art(sl.key) + '</div></div><div class="abs" id="pvlines" style="top:41rem;bottom:32rem;text-align:left;overflow:hidden"><ul class="rows">';
      for (var i = 0; i < sl.lines.length; i++) o += '<li style="white-space:normal;font-size:3em">' + h(sl.lines[i]) + '</li>'; // en «em»: se achica junto con el recuadro si no cabe
      o += '</ul></div>' + qrFoot();
      view.innerHTML = o;
      fitAll();
      fitBox($('pvlines'));
    }
    function paint() {
      if (!g) return;
      if (g.phase === 'intro') { paintIntro(); return; }
      introShown = -1;
      var opts = g.options && g.options.length ? g.options : ['bingo', 'rosco', 'festival', 'objeto'];
      var top = g.phase === 'voting' ? (g.round === 2 ? '🗳️ Segunda vuelta' : '🗳️ Votación') : '🗳️ Resultado de la votación';
      var big = g.phase === 'done' && g.winner ? '🏆 ¡Ganó ' + GAMES[g.winner][0] + ' ' + h(GAMES[g.winner][1]) + '!' : g.phase === 'result' && g.empty ? 'Nadie votó' : g.phase === 'result' && g.runoff ? 'Nadie superó el 50%' : '¿Qué juego quieren jugar?';
      var line = g.phase === 'voting' ? 'Quedan <b class="gold">' + clock(g.until - now()) + '</b>' : g.phase === 'result' && g.runoff ? 'Segunda vuelta: ' + GAMES[g.runoff[0]][0] + ' ' + h(GAMES[g.runoff[0]][1]) + ' y ' + GAMES[g.runoff[1]][0] + ' ' + h(GAMES[g.runoff[1]][1]) : g.tie ? 'Empate en la segunda vuelta: se decidió por sorteo' : '';
      var o = '<div class="abs" style="top:4rem"><div class="g-sub" style="color:#ffc400;text-transform:uppercase">' + top + '</div><b class="big fit" style="display:block;font-size:5.4rem">' + big + '</b>' + (line ? '<div class="mid fit">' + line + '</div>' : '') + '</div><div class="abs" style="top:24rem"><ol class="rows">';
      for (var i = 0; i < opts.length; i++) {
        var k = opts[i]; var n = (g.counts || {})[k] || 0; var p = pct(n, g.total);
        var dim = (g.phase === 'done' && k !== g.winner) || (g.phase === 'result' && g.runoff && g.runoff.indexOf(k) < 0);
        o += '<li class="bar top" style="' + (dim ? 'opacity:.45' : '') + '"><u style="width:' + p.toFixed(1) + '%;background:' + GVC[k] + '"></u><span>' + GAMES[k][0] + ' ' + h(GAMES[k][1]) + '</span><i>' + fmtPct(p) + ' · ' + votos(n) + '</i></li>';
      }
      o += '</ol><div class="g-sub">' + (g.total ? votos(g.total) + ' en total' : '') + '</div></div>' + qrFoot();
      view.innerHTML = o;
      fitAll();
    }
    function load() { get('/api/gamevote', function (r) { if (r && cur === 'sala') { g = r; paint(); } }); }
    load();
    every(stageTimers, 1000, load);
  }
  function sShow() {
    get('/api/light/cartelera?local=' + VENUE, function (c) {
      if (cur !== 'sala') return;
      view.innerHTML = '<div class="abs g-title">⭐ El show de esta noche</div><div class="abs" style="top:30rem"><b class="big" style="display:block">' + (c && c.show ? showHtml(c.show) : 'KRB Stage') + '</b></div>' + qrFoot();
      fitAll();
    });
  }
  function sInsta() {
    get('/api/insta', function (r) {
      if (cur !== 'sala') return;
      view.innerHTML = '<div class="abs g-title">📸 Síguenos en Instagram</div><div class="abs" style="top:34rem"><b class="big fit gold" style="display:block">@' + h((r && r.handle) || 'krbstage') + '</b></div>' + qrFoot();
      fitAll();
    });
  }

  // ---------- Qué mostrar (las mismas reglas que la pantalla completa) ----------
  function tick() {
    get('/api/vertical/' + P, function (st) {
      if (!st) return;
      lastOk = new Date().getTime();
      if (st.video !== ver) {
        ver = st.video;
        if (ver) { vid.src = Q.liviano && Q.lver === String(ver) ? Q.liviano : '/vertical/' + P + '.mp4?v=' + ver; if (cur === 'video') play(); } else vid.removeAttribute('src');
      }
      var show = st.show;
      if (show === 'light') show = { karaoke: st.karaokeNow ? 'karaoke' : 'light-kar', qr: 'light-qr', show: 'light-show' }[st.lightStage] || 'light';
      var want = show === 'video' ? (ver ? 'video' : 'logo') : show === 'light' ? 'info' : show === 'light-qr' ? 'info-qr' : show === 'light-show' ? 'info-show' : show === 'light-kar' ? 'info-kar' : show === 'karaoke' ? 'karaoke' : !st.activity ? (ver ? 'video' : 'logo') : 'sala';
      if (want !== cur) go(want);
    });
  }
  tick();
  setInterval(tick, 3000);
  // Cada 6 horas se recarga sola (versión nueva y memoria limpia), salvo en medio de los juegos o en pantalla completa
  // (al recargar se saldría de la pantalla completa y habría que volver a apretar el botón)
  // (y nunca donde el video necesita un toque para partir, como el iPad viejo: después de recargar volvería a pedirlo)
  setTimeout(function () { setInterval(function () { if (cur !== 'sala' && !fsEl() && !vid.webkitDisplayingFullscreen && (autoOk || !ver) && serverOk()) location.reload(); }, 60000); }, 6 * 3600 * 1000);
  // Revisión: con ?diag=1, el navegador y los errores
  if (Q.diag) {
    var d = document.createElement('pre'); d.id = 'diag'; document.body.appendChild(d);
    setInterval(function () { d.textContent = navigator.userAgent + '\nventana ' + window.innerWidth + 'x' + window.innerHeight + ' · pantalla ' + P + ' · vista ' + cur + ' · video ' + ver + (vid.paused ? ' (detenido)' : ' (andando)') + '\nerrores: ' + (errs.length ? errs.join(' | ') : 'ninguno'); }, 1500);
  }
})();
</script>
