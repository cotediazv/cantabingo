<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<title>KRB Stage · Pantalla</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<!-- Letras del diseño nuevo (pedido de Cote, 22 nov): solo se usan con la clase «t2» puesta en <html> -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<!--
  Pantalla de los locales, versión liviana (pedido de Cote, 21 nov): la misma pantalla vertical, escrita para navegadores
  antiguos (el Chrome del decodificador de Kennedy y el iPad viejo con iOS 9.3.5). JavaScript antiguo (ES5, sin flechas,
  sin let/const, sin plantillas `...`), XMLHttpRequest y CSS sin grid ni flex, sin «inset» ni «aspect-ratio».
  Sigue las mismas reglas que la pantalla completa (vertical.js): el video de la cartelera, la información del local
  (sala light), el karaoke o los juegos de la sala completa del local.
  Dirección: /pv.html?p=<pantalla>&girar=1 (girar: la pantalla de pie recibe la imagen horizontal y se entrega girada 90°
  a la derecha; solo se gira si la ventana está horizontal, así en el iPad de pie se ve derecha).
  Las pantallas antiguas llegan solas aquí desde #/vertical/<pantalla> (ver el aviso al comienzo de index.html).
-->
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: 'Fredoka', 'Trebuchet MS', Arial, sans-serif; -webkit-text-size-adjust: 100%; }
  * { box-sizing: border-box; -webkit-box-sizing: border-box; }
  #cv { position: absolute; left: 0; top: 0; overflow: hidden; background: #0b0a18; }
  #cv.rot { -webkit-transform-origin: 0 0; transform-origin: 0 0; -webkit-transform: rotate(90deg) translateY(-100%); transform: rotate(90deg) translateY(-100%); }
  #cv.th-kennedy { background: #062a5e; background: -webkit-linear-gradient(290deg, #041a3e, #0b5ea8 55%, #062a5e); background: linear-gradient(160deg, #041a3e, #0b5ea8 55%, #062a5e); }
  #cv.th-frida { background: #3a0b3f; background: -webkit-linear-gradient(290deg, #2a0a3a, #8a1f6b 55%, #2a0a3a); background: linear-gradient(160deg, #2a0a3a, #8a1f6b 55%, #2a0a3a); }
  #cv.th-tobalaba { background: #3b0508; background: -webkit-linear-gradient(290deg, #2a0406, #8f1d1d 55%, #2a0406); background: linear-gradient(160deg, #2a0406, #8f1d1d 55%, #2a0406); }
  .hide { display: none !important; }
  /* «GC PER» (pedido de Cote, 22 nov): el texto escrito en el GC Master, como una franja abajo, sobre lo que se esté mostrando; lo que va entre comillas sale en amarillo */
  #per { position: absolute; left: 2.5rem; right: 2.5rem; bottom: 2.2rem; z-index: 40; padding: 1.3rem 2.2rem 1.1rem; border-top: .45rem solid #f4bf5a; background: #0c0b12; background: rgba(12, 11, 18, .96); color: #fff; font-size: 2.6rem; font-weight: 900; line-height: 1.2; text-align: center; }
  #per b { color: #f4bf5a; font-weight: 900; }
  /* con la franja puesta, lo que se muestra se achica hacia arriba para que no tape nada (el video no) */
  #cv.per #view { -webkit-transform: scale(.87); transform: scale(.87); -webkit-transform-origin: 50% 0; transform-origin: 50% 0; }
  #vid { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #000; object-fit: cover; }
  #tap { position: absolute; left: 4rem; right: 4rem; bottom: 10rem; padding: 2rem; border-radius: 2rem; background: rgba(0, 0, 0, .7); text-align: center; font-size: 3rem; font-weight: 700; }
  #view { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #cv.wide #view { left: 50%; width: 56.25rem; margin-left: -28.125rem; }
  #marks { position: absolute; left: 0; right: 0; bottom: 1.2rem; height: 3.2rem; text-align: center; }
  #marks img { height: 3.2rem; vertical-align: middle; margin: 0 1rem; }
  #marks i { display: inline-block; width: .2rem; height: 3rem; background: rgba(255, 255, 255, .6); vertical-align: middle; }
  .abs { position: absolute; left: 3rem; right: 3rem; text-align: center; }
  .fit { white-space: nowrap; overflow: hidden; }
  .gold { color: #ffc400; }
  .card { background: rgba(8, 6, 26, .78); border: .5rem solid #ffc400; border-radius: 3rem; }
  .qrw { display: inline-block; background: #fff; border-radius: 2rem; padding: 1.2rem; }
  .qrw img { display: block; width: 100%; height: auto; }
  .qrp { color: #c4175e; font-weight: 700; text-transform: uppercase; text-align: center; line-height: 1.15; }
  .logo-big { position: absolute; left: 50%; top: 50%; width: 36rem; margin: -10rem 0 0 -18rem; }
  /* Información del local (fondo de la sala light) */
  .lv-top small { display: block; font-size: 2.6rem; font-weight: 700; letter-spacing: .3rem; text-transform: uppercase; color: #ffc400; }
  .lv-top b { display: block; font-size: 7.4rem; line-height: 1.05; font-weight: 700; }
  .lv-top span { display: block; margin-top: .8rem; font-size: 2.9rem; font-weight: 600; }
  .lv-card { position: absolute; left: 3rem; right: 3rem; top: 25rem; bottom: 33rem; padding: 2.6rem 2.8rem 3.6rem; overflow: hidden; }
  .lv-slide { height: 100%; overflow: hidden; font-size: 1rem; }
  .lv-slide h2 { margin: 0 0 1.6em; font-size: 3.6em; color: #ffc400; text-align: center; font-weight: 700; }
  .lv-now { margin: 0 0 1.6em; text-align: center; }
  .lv-now small { display: block; font-size: 2.4em; color: #ffd76a; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
  .lv-now b { display: block; font-size: 5em; line-height: 1.1; font-weight: 700; }
  .lv-now span { display: block; font-size: 2.8em; margin-top: .2em; }
  .lv-list, .lv-hours, .lv-week { margin: 0; padding: 0; list-style: none; }
  .lv-list li, .lv-hours li, .lv-week li { margin: 0 0 1em; font-size: 2.9em; line-height: 1.2; }
  .lv-list li b, .lv-hours li b, .lv-week li b { font-weight: 700; }
  .lv-list li span { display: block; font-size: .8em; color: #d8d3ff; }
  .lv-hours li em, .lv-week li em { display: inline-block; min-width: 4.2em; font-style: normal; color: #ffd76a; font-weight: 700; margin-right: .5em; }
  .lv-hours li.on, .lv-week li.on { color: #ffc400; }
  .lv-sh { display: block; }
  .lv-by { display: block; font-size: .85em; color: #ffd76a; }
  .lv-by small { font-size: .7em; color: #fff; }
  /* El nombre del show dentro del título: del tamaño del título (la regla «.lv-now span» de arriba lo agrandaba casi 3 veces
     y salía gigante y cortado en «El show de esta noche») */
  .lv-now b span, .lv-now b .lv-sh { font-size: 1em; margin-top: 0; }
  .lv-now b .lv-by { font-size: .85em; }
  .lv-now b .lv-by small { display: inline; font-size: .7em; letter-spacing: 0; text-transform: none; color: #fff; }
  .lv-slide b, .lv-slide span, .lv-slide li, .lv-slide h2 { word-wrap: break-word; overflow-wrap: break-word; }
  /* Flyers del Instagram del local (pedido de Cote, 21 nov): pasan dentro del mismo recuadro, un poco más chicos */
  .lv-flyer { text-align: center; }
  .lv-flyer img { max-width: 88%; border-radius: 1.6rem; border: .4rem solid #ffc400; }
  .lv-dots { position: absolute; left: 0; right: 0; bottom: 1.4rem; text-align: center; }
  .lv-dots i { display: inline-block; width: 1.4rem; height: 1.4rem; margin: 0 .5rem; border-radius: 50%; background: rgba(255, 255, 255, .3); }
  .lv-dots i.on { background: #ffc400; }
  .lv-qr { position: absolute; left: 3rem; right: 3rem; bottom: 6rem; height: 24rem; text-align: center; white-space: nowrap; }
  .lv-qr .qrw { width: 22rem; vertical-align: middle; }
  .lv-qrtext { display: inline-block; vertical-align: middle; width: 25rem; margin-left: 2.4rem; text-align: left; white-space: normal; }
  .lv-qrtext b { display: block; font-size: 3.2rem; line-height: 1.15; font-weight: 700; }
  .lv-qrtext span { display: block; margin-top: 1rem; font-size: 2.4rem; color: #ffd76a; }
  .lv-bigqr .qrw { width: 34rem; }
  /* Karaoke a pantalla completa */
  .kf-now { position: absolute; left: 3rem; right: 3rem; top: 16rem; height: 31rem; padding: 3rem 2.4rem; text-align: center; }
  .kf-now small { display: block; font-size: 3.2rem; color: #ffc400; font-weight: 700; }
  .kf-now b { display: block; margin-top: 1.4rem; font-size: 7rem; line-height: 1.1; font-weight: 700; }
  .kf-now span { display: block; margin-top: 1.2rem; font-size: 3.8rem; }
  .kf-now i { display: block; margin-top: .6rem; font-size: 3rem; color: #d8d3ff; }
  .kf-bottom { position: absolute; left: 3rem; right: 3rem; top: 50rem; bottom: 6rem; white-space: nowrap; }
  .kf-next { display: inline-block; vertical-align: top; width: 27rem; white-space: normal; }
  .kf-next small { display: block; font-size: 2.8rem; color: #ffc400; font-weight: 700; margin-bottom: 1.6rem; }
  .kf-next p { margin: 0 0 2rem; font-size: 3rem; line-height: 1.15; }
  .kf-next p em { font-style: normal; color: #ffc400; font-weight: 700; margin-right: .6rem; }
  .kf-next p span { display: block; font-size: 2.3rem; color: #d8d3ff; }
  .kf-qr { display: inline-block; vertical-align: top; width: 22rem; margin-left: 1.25rem; text-align: center; white-space: normal; }
  .kf-qr .qrw { width: 22rem; }
  .kf-qr .qrp { margin-top: 1.2rem; color: #fff; font-size: 2.2rem; }
  /* Juegos de la sala completa */
  .g-title { top: 4rem; font-size: 5.2rem; font-weight: 700; }
  .g-sub { font-size: 2.8rem; color: #ffd76a; font-weight: 600; }
  .ball { position: absolute; left: 50%; top: 15rem; width: 32rem; height: 32rem; margin-left: -16rem; border-radius: 50%; background: #fff; color: #1a1a1a; text-align: center; border: 1.4rem solid #ffc400; }
  .ball small { display: block; margin-top: 3.4rem; font-size: 5rem; font-weight: 700; color: #c4175e; }
  .ball b { display: block; font-size: 13rem; line-height: 1; font-weight: 700; }
  .prev { top: 49rem; }
  .prev span { display: inline-block; width: 7rem; height: 7rem; margin: 0 .6rem; border-radius: 50%; background: rgba(255, 255, 255, .9); color: #1a1a1a; font-size: 2.6rem; line-height: 7rem; font-weight: 700; }
  .rows { margin: 0; padding: 0; list-style: none; text-align: left; }
  .rows li { margin: 0 0 1.2rem; padding: 1.2rem 2rem; border-radius: 1.6rem; background: rgba(8, 6, 26, .72); font-size: 3.2rem; line-height: 1.15; white-space: nowrap; overflow: hidden; }
  .rows li em { display: inline-block; width: 4.6rem; font-style: normal; color: #ffc400; font-weight: 700; }
  .rows li i { float: right; font-style: normal; color: #ffc400; font-weight: 700; margin-left: 1.4rem; }
  .rows li.top { font-size: 3.8rem; }
  .bar { position: relative; overflow: hidden; }
  .bar u { position: absolute; left: 0; top: 0; bottom: 0; opacity: .5; text-decoration: none; }
  .bar span, .bar i { position: relative; }
  .big { font-size: 7rem; font-weight: 700; line-height: 1.1; }
  .mid { font-size: 4rem; font-weight: 600; line-height: 1.2; }
  .clock { font-size: 5rem; font-weight: 700; color: #ffc400; }
  .qr-foot { bottom: 6rem; }
  .qr-foot .qrw { width: 20rem; }
  .qr-foot .qrp { margin-top: 1rem; color: #fff; font-size: 2.2rem; }
  /* Botón «Pantalla completa» (pedido de Cote, 21 nov): aparece al tocar la pantalla y se esconde solo a los 8 s */
  #fs { position: absolute; right: 2rem; top: 2rem; z-index: 50; margin: 0; padding: 1.4rem 2.4rem; border: .3rem solid #ffc400; border-radius: 1.6rem; background: #000; background: rgba(0, 0, 0, .78); color: #fff; font-family: 'Fredoka', 'Trebuchet MS', Arial, sans-serif; font-size: 2.8rem; font-weight: 700; line-height: 1.1; -webkit-appearance: none; cursor: pointer; }
  #diag { position: fixed; left: 0; right: 0; bottom: 0; z-index: 99; margin: 0; padding: 8px; font: 12px/1.35 monospace; background: #fff; color: #000; white-space: pre-wrap; word-wrap: break-word; max-height: 45%; overflow: auto; }

  /* ================= Diseño nuevo (pedido de Cote, 22 nov: «Me gusta, aplícalo a todo») =================
     La línea gráfica de public/propuesta.html (pantalla vertical): fondo de noche, foco dorado, el color de cada local,
     letras Big Shoulders Display (títulos y nombres), Manrope (textos) y JetBrains Mono (horas y etiquetas), formas rectas.
     TODO va bajo «.t2» (clase de <html>): con el interruptor del Centro de control apagado (/api/tema) o con ?tema=0 se
     quita la clase y la página queda exactamente como antes. Escrito para navegadores antiguos: sin flex, grid, inset,
     aspect-ratio, min(), clamp(), variables, color-mix ni clip-path (los cortes en diagonal son triángulos hechos con
     bordes); los colores van escritos directo y los del local se repiten por local (.th-kennedy, .th-frida, .th-tobalaba).
     Colores: noche #0c0b12, tarima #15131e, líneas #2a2636, texto #f3eee6, tenue #a59fb0, foco #f4bf5a;
     Kennedy #47b8e6 (texto encima #06131a), Frida #e0338f y Tobalaba #e5413a (texto encima blanco). */
  #t2pre { position: absolute; left: 0; top: 0; width: 0; height: 0; overflow: hidden; opacity: 0; } /* hace cargar las letras nuevas al abrir la página */
  .t2 #t2pre b { font-family: "Big Shoulders Display", sans-serif; font-weight: 900; }
  .t2 #t2pre s { font-family: "Big Shoulders Display", sans-serif; font-weight: 800; }
  .t2 #t2pre i { font-family: "Manrope", sans-serif; font-weight: 700; }
  .t2 #t2pre u { font-family: "Manrope", sans-serif; font-weight: 800; }
  .t2 #t2pre em { font-family: "JetBrains Mono", monospace; font-weight: 700; }
  @-webkit-keyframes pv2entra { from { opacity: 0; -webkit-transform: translateX(-2.4rem); } to { opacity: 1; -webkit-transform: none; } }
  @keyframes pv2entra { from { opacity: 0; transform: translateX(-2.4rem); } to { opacity: 1; transform: none; } }
  @-webkit-keyframes pv2bola { from { opacity: 0; -webkit-transform: scale(.72); } to { opacity: 1; -webkit-transform: none; } }
  @keyframes pv2bola { from { opacity: 0; transform: scale(.72); } to { opacity: 1; transform: none; } }
  @-webkit-keyframes pv2pulso { 50% { opacity: .3; } }
  @keyframes pv2pulso { 50% { opacity: .3; } }

  /* ----- base: fondo, logos y piezas compartidas ----- */
  .t2, .t2 body { background: #07060c; color: #f3eee6; font-family: "Manrope", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .t2 #cv { background: #0c0b12; color: #f3eee6; }
  .t2 #cv.th-kennedy { background: #0c0b12; background: radial-gradient(circle at 20% 10%, rgba(71, 184, 230, .46) 0, rgba(71, 184, 230, 0) 48%), radial-gradient(circle at 86% 94%, rgba(244, 191, 90, .22) 0, rgba(244, 191, 90, 0) 42%), repeating-linear-gradient(115deg, rgba(255, 255, 255, .03) 0, rgba(255, 255, 255, .03) 1px, rgba(255, 255, 255, 0) 1px, rgba(255, 255, 255, 0) 3.2rem), linear-gradient(160deg, #15131e, #0c0b12 55%, #07060c); }
  .t2 #cv.th-frida { background: #0c0b12; background: radial-gradient(circle at 20% 10%, rgba(224, 51, 143, .46) 0, rgba(224, 51, 143, 0) 48%), radial-gradient(circle at 86% 94%, rgba(244, 191, 90, .22) 0, rgba(244, 191, 90, 0) 42%), repeating-linear-gradient(115deg, rgba(255, 255, 255, .03) 0, rgba(255, 255, 255, .03) 1px, rgba(255, 255, 255, 0) 1px, rgba(255, 255, 255, 0) 3.2rem), linear-gradient(160deg, #15131e, #0c0b12 55%, #07060c); }
  .t2 #cv.th-tobalaba { background: #0c0b12; background: radial-gradient(circle at 20% 10%, rgba(229, 65, 58, .46) 0, rgba(229, 65, 58, 0) 48%), radial-gradient(circle at 86% 94%, rgba(244, 191, 90, .22) 0, rgba(244, 191, 90, 0) 42%), repeating-linear-gradient(115deg, rgba(255, 255, 255, .03) 0, rgba(255, 255, 255, .03) 1px, rgba(255, 255, 255, 0) 1px, rgba(255, 255, 255, 0) 3.2rem), linear-gradient(160deg, #15131e, #0c0b12 55%, #07060c); }
  /* los logos van arriba, al centro (como en la propuesta); todo lo demás parte más abajo */
  .t2 #marks { top: 2.6rem; bottom: auto; height: 3rem; }
  .t2 #marks img { height: 3rem; margin: 0 .9rem; }
  .t2 #marks i { width: .2rem; height: 2.6rem; background: rgba(255, 255, 255, .5); }
  .t2 .gold { color: #f4bf5a; }
  .t2 .card { background: #15131e; background: rgba(21, 19, 30, .88); border: .12rem solid #2a2636; border-radius: 0; }
  .t2 .qrw { border-radius: 0; padding: 1rem; }
  .t2 .fit { padding-top: .1em; padding-bottom: .1em; } /* espacio para las tildes de las mayúsculas y las colas de las letras (la línea recorta lo que sobresale) */
  .t2 .g-sub { font-family: "JetBrains Mono", Menlo, Consolas, "Courier New", monospace; font-size: 2rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #f4bf5a; }
  .t2 .mid { font-family: "Manrope", "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 3.2rem; font-weight: 800; line-height: 1.15; }
  .t2 .big { font-family: "Big Shoulders Display", "Arial Narrow", "HelveticaNeue-CondensedBold", "Roboto Condensed", sans-serif-condensed, Impact, sans-serif; font-size: 8rem; font-weight: 900; line-height: 1; text-transform: uppercase; letter-spacing: .005em; }
  .t2 .clock { font-family: "JetBrains Mono", Menlo, Consolas, "Courier New", monospace; font-size: 6.4rem; font-weight: 700; line-height: 1.25; color: #f4bf5a; }
  /* línea fina con degradado (color del local → foco) bajo cada encabezado */
  .t2 .lv-top::after, .t2 .kf-top::after, .t2 .g-title::after, .t2 .g-main::after, .t2 .gv-head::after { content: ""; display: block; height: .22rem; margin-top: 1.3rem; background: #f4bf5a; }
  .t2 .th-kennedy .lv-top::after, .t2 .th-kennedy .kf-top::after, .t2 .th-kennedy .g-title::after, .t2 .th-kennedy .g-main::after, .t2 .th-kennedy .gv-head::after { background: linear-gradient(90deg, rgba(71, 184, 230, 0), #47b8e6 22%, #f4bf5a 78%, rgba(244, 191, 90, 0)); }
  .t2 .th-frida .lv-top::after, .t2 .th-frida .kf-top::after, .t2 .th-frida .g-title::after, .t2 .th-frida .g-main::after, .t2 .th-frida .gv-head::after { background: linear-gradient(90deg, rgba(224, 51, 143, 0), #e0338f 22%, #f4bf5a 78%, rgba(244, 191, 90, 0)); }
  .t2 .th-tobalaba .lv-top::after, .t2 .th-tobalaba .kf-top::after, .t2 .th-tobalaba .g-title::after, .t2 .th-tobalaba .g-main::after, .t2 .th-tobalaba .gv-head::after { background: linear-gradient(90deg, rgba(229, 65, 58, 0), #e5413a 22%, #f4bf5a 78%, rgba(244, 191, 90, 0)); }
  /* etiquetas tipo «pestaña»: recuadro dorado (o del color del local) con el corte en diagonal hecho con un triángulo de bordes */
  .t2 .lv-slide h2, .t2 .kf-now small, .t2 .v-body .mid.gold, .t2 .r-win .g-sub, .t2 .g-tagw span { display: inline-block; position: relative; margin: 0 1.1em 0 0; padding: .45em .5em .45em .9em; background: #f4bf5a; color: #1a1407; font-family: "JetBrains Mono", Menlo, Consolas, "Courier New", monospace; font-size: 1.8rem; font-weight: 700; line-height: 1.2; letter-spacing: .16em; text-transform: uppercase; text-align: left; white-space: nowrap; }
  .t2 .lv-slide h2::after, .t2 .kf-now small::after, .t2 .v-body .mid.gold::after, .t2 .r-win .g-sub::after, .t2 .g-tagw span::after { content: ""; position: absolute; left: 100%; top: 0; width: 0; height: 0; margin-left: -1px; border-top: 2.1em solid #f4bf5a; border-right: 1.1em solid transparent; }
  .t2 .th-kennedy .kf-now small { background: #47b8e6; color: #06131a; } .t2 .th-kennedy .kf-now small::after { border-top-color: #47b8e6; }
  .t2 .th-frida .kf-now small { background: #e0338f; color: #fff; } .t2 .th-frida .kf-now small::after { border-top-color: #e0338f; }
  .t2 .th-tobalaba .kf-now small { background: #e5413a; color: #fff; } .t2 .th-tobalaba .kf-now small::after { border-top-color: #e5413a; }
  /* el QR: recuadro blanco a todo el ancho, con la frase al lado */
  .t2 .lv-qr, .t2 .qr-foot, .t2 .kf-qr { height: auto; padding: 1.6rem; background: #fff; text-align: left; white-space: nowrap; }
  .t2 .lv-qr { bottom: 3rem; } .t2 .qr-foot { bottom: 3rem; }
  .t2 .lv-qr .qrw, .t2 .qr-foot .qrw, .t2 .kf-qr .qrw { width: 15rem; padding: 0; vertical-align: middle; }

  }
  // Achica la letra de un texto de una línea hasta que quepa (nunca se corta)
  function fitLine(el) {

  }

      if (!sp || !ri) continue;

      for (var k = 0; k < 60 && sp.offsetWidth + ri.offsetWidth + pad + fs > li.clientWidth && fs > 6; k++) { fs *= 0.95; li.style.fontSize = fs.toFixed(1) + 'px'; }
    }
  }

  // ---------- Tamaño y giro ----------

    var rot = Q.girar === '1' && W > H;
    var cw = rot ? H : W; var ch = rot ? W : H;
    cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
    cv.className = (rot ? 'rot ' : '') + 'th-' + VENUE + (cw > ch * 0.75 ? ' wide' : '') + (perShown ? ' per' : '');

  // Las letras del diseño nuevo pueden terminar de cargar después de dibujar: se vuelve a ajustar el tamaño de los textos

  var fsBtn = $('fs'); var fsHide = null; var fsFirst = true;
  var FS_TXT = fsBtn.innerHTML;
  fsBtn.innerHTML = se(FS_TXT);
  var IOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement || document.webkitCurrentFullScreenElement || document.mozFullScreenElement || document.msFullscreenElement || null; }
  function fsReq() { var el = document.documentElement; return el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen || el.mozRequestFullScreen || el.msRequestFullscreen || null; }
  function pageFsOk() {

  function videoFsOk() { return cur === 'video' && !!vid.webkitEnterFullscreen && !/(^| )rot( |$)/.test(cv.className); }
  var embedded = false; // dentro de otra página (ej. las pantallas incrustadas en krbstage.cl) el botón no va

  document.addEventListener('keydown', wasTouched, false);
  setInterval(function () {
    var moved = vTicks > 0; vTicks = 0;
    if (cur !== 'video' || !vid.getAttribute('src')) { vStuck = 0; vFixes = 0; return; }

      else if (s.signup) { o += '<div class="mid gold">' + se('📝 Inscripciones abiertas') + '</div>' + (left ? '<div class="clock">' + left + '</div>' : '') + '<ol class="rows" style="margin-top:2rem">'; var ps = s.players || []; for (var k = 0; k < ps.length && k < 8; k++) o += '<li>' + row(ps[k]) + '</li>'; o += '</ol>'; }
      else if (s.last) o += '<div class="mid v-msg">Ya viene el siguiente participante</div>';
      else { o += '<div class="mid gold">Participantes</div><ol class="rows" style="margin-top:2rem">'; var pp = s.players || []; for (var m = 0; m < pp.length && m < 8; m++) o += '<li>' + row(pp[m]) + '</li>'; o += '</ol>'; }
      o += '</div>' + qrFoot();
      if (T2 && o.indexOf('<ol') < 0) o = o.replace('abs v-body', 'abs v-body v-hero'); // diseño nuevo: sin lista, el bloque va más al centro
      view.innerHTML = o;
      fitAll();
    }
    function load() { get('/api/vote', function (r) { if (r && cur === 'sala') { st = r; paint(); } }); }
    load();
    every(stageTimers, 2000, load);
    every(stageTimers, 1000, function () { if (st) paint(); });
  }
  function sDraw() {
    var last = '';
    function paint(g) {
      var ready = g.ready && (!g.last || g.ready.at > g.last.at);
      var rolling = !ready && g.last && !g.last.direct && now() < g.last.at + 4500;
      var sig = JSON.stringify([g.list, g.total, ready, rolling, g.last && g.last.at]);
      if (sig === last) return;
      last = sig;
      var o = '';
      var n = ready ? g.list.length + 1 : g.list.length;
      if (ready) { o += '<div class="abs g-title fit">' + tv('🎲 ', '') + 'Sorteo del ' + n + '.º juego</div><div class="abs d-pool" style="top:16rem"><ol class="rows">'; for (var i = 0; i < g.ready.pool.length; i++) o += '<li class="top fit">' + gname(g.ready.pool[i]) + '</li>'; o += '</ol></div>'; }
      else if (rolling) o += '<div class="abs g-title fit">' + tv('🎲 ', '') + 'Sorteo del ' + n + '.º juego</div><div class="abs big gold r-roll' + tv('', ' fit') + '" style="top:30rem">' + se('🎲 Sorteando…') + '</div>';
      else if (g.last) o += '<div class="abs g-title fit">' + tv('🎲 ', '') + 'El ' + n + '.º juego es</div><div class="abs d-win" style="top:22rem"><b class="big fit gold" style="display:block">' + gname(g.last.game) + '</b></div>';
      o += '<div class="abs d-list" style="top:52rem"><ol class="rows rk">';
      for (var k = 0; k < g.total; k++) o += '<li class="fit' + (g.list[k] ? '' : ' off') + '"><em>' + (k + 1) + '.º</em>' + (g.list[k] ? gname(g.list[k]) : tv('🔒', '—')) + '</li>';
      o += '</ol></div>';
      view.innerHTML = o;
      fitAll();
    }
    function load() { get('/api/gamedraw', function (g) { if (g && cur === 'sala') paint(g); }); }
    load();
    every(stageTimers, 1000, load);
  }
  function sGameVote() {
    var g = null; var introShown = -1;
    function paintIntro() {
      var GI = window.GAME_INTRO;
      if (!GI) return;
      var k = GI.stepOf(g.intro, now());
      if (k === introShown) return;
      introShown = k;
      var sl = GI.slides(SHORT[VENUE])[k];
      var o = '<div class="abs gv-head" style="top:4rem"><div class="g-sub" style="color:#ffc400;text-transform:uppercase">' + tv('📢 ', '') + 'Antes de votar · ' + (k + 1) + ' de 6</div><b class="big fit" style="display:block;font-size:' + tv('5.4', '6.6') + 'rem">' + tv(sl.icon + ' ', '') + h(sl.title) + '</b></div>' +
        '<div class="abs gi-art" style="top:16rem"><div style="width:36rem;margin:0 auto">' + GI.art(sl.key) + '</div></div><div class="abs" id="pvlines" style="top:41rem;bottom:32rem;text-align:left;overflow:hidden"><ul class="rows">';
      for (var i = 0; i < sl.lines.length; i++) o += '<li style="white-space:normal;font-size:3em">' + h(sl.lines[i]) + '</li>'; // en «em»: se achica junto con el recuadro si no cabe
      o += '</ul></div>' + qrFoot();
      view.innerHTML = o;
      fitAll();
      fitBox($('pvlines'));
    }
    function paint() {
      if (!g) return;
      if (g.phase === 'intro') { paintIntro(); return; }
      introShown = -1;
      var opts = g.options && g.options.length ? g.options : ['bingo', 'rosco', 'festival', 'objeto'];
      var top = se(g.phase === 'voting' ? (g.round === 2 ? '🗳️ Segunda vuelta' : '🗳️ Votación') : '🗳️ Resultado de la votación');
      var big = g.phase === 'done' && g.winner ? tv('🏆 ', '') + '¡Ganó ' + gname(g.winner) + '!' : g.phase === 'result' && g.empty ? 'Nadie votó' : g.phase === 'result' && g.runoff ? 'Nadie superó el 50%' : '¿Qué juego quieren jugar?';
      var line = g.phase === 'voting' ? 'Quedan <b class="gold">' + clock(g.until - now()) + '</b>' : g.phase === 'result' && g.runoff ? 'Segunda vuelta: ' + gname(g.runoff[0]) + ' y ' + gname(g.runoff[1]) : g.tie ? 'Empate en la segunda vuelta: se decidió por sorteo' : '';
      var o = '<div class="abs gv-head" style="top:4rem"><div class="g-sub" style="color:#ffc400;text-transform:uppercase">' + top + '</div><b class="big fit" style="display:block;font-size:' + tv('5.4', '6.6') + 'rem">' + big + '</b>' + (line ? '<div class="mid fit">' + line + '</div>' : '') + '</div><div class="abs gv-bars" style="top:24rem"><ol class="rows">';
      for (var i = 0; i < opts.length; i++) {
        var k = opts[i]; var n = (g.counts || {})[k] || 0; var p = pct(n, g.total);
        var dim = (g.phase === 'done' && k !== g.winner) || (g.phase === 'result' && g.runoff && g.runoff.indexOf(k) < 0);
        o += '<li class="bar top" style="' + (dim ? 'opacity:.45' : '') + '"><u style="width:' + p.toFixed(1) + '%;background:' + GVC[k] + '"></u><span>' + gname(k) + '</span><i>' + fmtPct(p) + ' · ' + votos(n) + '</i></li>';
      }
      o += '</ol><div class="g-sub">' + (g.total ? votos(g.total) + ' en total' : '') + '</div></div>' + qrFoot();
      view.innerHTML = o;
      fitAll();
    }
    function load() { get('/api/gamevote', function (r) { if (r && cur === 'sala') { g = r; paint(); } }); }
    load();
    every(stageTimers, 1000, load);
  }
  function sShow() {
    get('/api/light/cartelera?local=' + VENUE, function (c) {
      if (cur !== 'sala') return;
      view.innerHTML = '<div class="abs g-title g-tagw s-tag"><span>' + se('⭐ El show de esta noche') + '</span></div><div class="abs s-hero" style="top:30rem"><b class="big' + tv('', ' fit') + '" style="display:block">' + (c && c.show ? showHtml(c.show) : 'KRB Stage') + '</b></div>' + qrFoot();
      fitAll();
    });
  }
  function sInsta() {
    get('/api/insta', function (r) {
      if (cur !== 'sala') return;
      view.innerHTML = '<div class="abs g-title g-tagw i-tag"><span>' + se('📸 Síguenos en Instagram') + '</span></div><div class="abs i-hero" style="top:34rem"><b class="big fit gold" style="display:block">@' + h((r && r.handle) || 'krbstage') + '</b></div>' + qrFoot();
      fitAll();
    });
  }

  // ---------- Diseño nuevo: encendido o apagado desde el Centro de control ----------
  function temaSet(on) {
    if (on === T2) return;
    T2 = on;
    document.documentElement.className = T2 ? 't2' : '';
    fsBtn.innerHTML = se(FS_TXT);
    layout();
    if (cur && cur !== 'video' && cur !== 'logo') go(cur); // se vuelve a dibujar la vista con el otro diseño
  }
  function temaLoad() { get('/api/tema', function (r) { if (r && typeof r.on === 'boolean') temaSet(r.on); }); }
  if (Q.tema !== '0' && Q.tema !== '1') { temaLoad(); setInterval(temaLoad, 60000); }

  // ---------- Qué mostrar (las mismas reglas que la pantalla completa) ----------
  // «GC PER»: lo que va entre comillas ("…", “…” o «…») sale destacado y las comillas no se ven
  var perEl = document.getElementById('per'); perShown = '';
  function perHtml(t) {
    var re = /"([^"]+)"|\u201c([^\u201d]+)\u201d|\u00ab([^\u00bb]+)\u00bb/g; var out = ''; var i = 0; var m;
    while ((m = re.exec(t))) { out += h(t.slice(i, m.index)) + '<b>' + h(m[1] || m[2] || m[3]) + '</b>'; i = re.lastIndex; }
    return out + h(t.slice(i));
  }
  function tick() {
    get('/api/vertical/' + P, function (st) {
      if (!st) return;
      lastOk = new Date().getTime();
      var pt = st.per && st.per.text ? String(st.per.text) : '';
      if (pt !== perShown) { perShown = pt; perEl.className = pt ? '' : 'hide'; perEl.innerHTML = perHtml(pt); cv.className = cv.className.replace(/ per\b/, '') + (pt ? ' per' : ''); }
      if (st.video !== ver) {
        ver = st.video;
        if (ver) { vid.src = Q.liviano && Q.lver === String(ver) ? Q.liviano : '/vertical/' + P + '.mp4?v=' + ver; if (cur === 'video') play(); } else vid.removeAttribute('src');
      }
      var show = st.show;
      if (show === 'light') show = { karaoke: st.karaokeNow ? 'karaoke' : 'light-kar', qr: 'light-qr', show: 'light-show' }[st.lightStage] || 'light';
      var want = show === 'video' ? (ver ? 'video' : 'logo') : show === 'light' ? 'info' : show === 'light-qr' ? 'info-qr' : show === 'light-show' ? 'info-show' : show === 'light-kar' ? 'info-kar' : show === 'karaoke' ? 'karaoke' : !st.activity ? (ver ? 'video' : 'logo') : 'sala';
      if (want !== cur) go(want);
    });
  }
  function pubLoad() { get('/api/tema', function (r) { if (r && typeof r.pub === 'string') PUB = r.pub; }); }
  pubLoad(); setInterval(pubLoad, 300000);
  tick();
  setInterval(tick, 3000);
  // Versión nueva publicada (pedido de Cote, 21 nov: que la pantalla se actualice sin tener que apretar nada): cada minuto
  // se mira la marca de esta página en el servidor; si cambió, la pantalla se recarga sola. No lo hace en pantalla completa
  // (se perdería), en medio de los juegos, con el servidor sin responder, ni con el video puesto donde el video necesita
  // un toque para partir (iPad viejo: espera a que la pantalla pase a otra vista).
  var myTag = null; var newVersion = false;
  function checkVersion() {
    var x = new XMLHttpRequest();
    x.open('HEAD', 'pv.html?_=' + new Date().getTime(), true);
    x.timeout = 15000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4 || x.status !== 200) return;
      var tag = x.getResponseHeader('ETag') || x.getResponseHeader('Last-Modified') || '';
      if (!tag) return;
      if (myTag === null) myTag = tag; else if (tag !== myTag) newVersion = true;
    };
    try { x.send(null); } catch (e) { /* nada */ }
  }
  checkVersion();
  setInterval(function () {
    if (newVersion && serverOk() && cur !== 'sala' && !fsEl() && !vid.webkitDisplayingFullscreen && (autoOk || cur !== 'video')) { location.reload(); return; }
    if (!newVersion) checkVersion();
  }, Q.vtest ? 5000 : 60000);
  // Cada 6 horas se recarga sola (versión nueva y memoria limpia), salvo en medio de los juegos o en pantalla completa
  // (al recargar se saldría de la pantalla completa y habría que volver a apretar el botón)
  // (y nunca donde el video necesita un toque para partir, como el iPad viejo: después de recargar volvería a pedirlo)
  setTimeout(function () { setInterval(function () { if (cur !== 'sala' && !fsEl() && !vid.webkitDisplayingFullscreen && (autoOk || !ver) && serverOk()) location.reload(); }, 60000); }, 6 * 3600 * 1000);
  // Revisión: con ?diag=1, el navegador y los errores
  if (Q.diag) {
    var d = document.createElement('pre'); d.id = 'diag'; document.body.appendChild(d);
    setInterval(function () { d.textContent = navigator.userAgent + '\nventana ' + window.innerWidth + 'x' + window.innerHeight + ' · pantalla ' + P + ' · vista ' + cur + ' · video ' + ver + (vid.paused ? ' (detenido)' : ' (andando)') + '\nerrores: ' + (errs.length ? errs.join(' | ') : 'ninguno'); }, 1500);
  }
})();
</script>
