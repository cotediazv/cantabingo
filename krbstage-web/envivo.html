<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>KRB Stage · En vivo</title>
<!--
  Solo el video en vivo de baja latencia (Cloudflare) de un local, a pantalla completa (pedido de Cote):
    envivo.html?local=kennedy · envivo.html?local=tobalaba · envivo.html?local=frida
  Si el local no está transmitiendo, muestra un aviso y vuelve a intentar sola cada 5 segundos.
-->
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#aviso{position:fixed;inset:0;display:grid;place-content:center;text-align:center;gap:10px;font-size:22px;color:#ccc}
#aviso b{font-size:30px;color:var(--c)}
#son{position:fixed;right:16px;bottom:16px;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:10px 18px;font:700 16px system-ui;cursor:pointer}
[hidden]{display:none!important}
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<div id="aviso"><b id="nombre"></b><span id="estado">Conectando…</span></div>
<button id="son" hidden>🔇 Activar sonido</button>
<script>
const LOCALES={
  kennedy:{n:'Mercado Kennedy',c:'#47b8e6',whep:'https://customer-3bznxs0ex4mcn0j1.cloudflarestream.com/c24ccde66ad7d935841dd934d9b3e1cf/webRTC/play'},
  tobalaba:{n:'Espacio Gastronómico Tobalaba',c:'#e5413a',whep:'https://customer-3bznxs0ex4mcn0j1.cloudflarestream.com/9c4d261a1b6c2fb79842b6d3821b9018/webRTC/play'},
  frida:{n:'Frida Kahlo',c:'#e0338f',whep:'https://customer-3bznxs0ex4mcn0j1.cloudflarestream.com/2c9c627707b0fbc53e20c611f84235a0/webRTC/play'}
};
const q=new URLSearchParams(location.search),k=LOCALES[q.get('local')]?q.get('local'):'kennedy',L=LOCALES[k];
document.documentElement.style.setProperty('--c',L.c);document.title=`${L.n} · En vivo`;
const v=document.getElementById('v'),aviso=document.getElementById('aviso'),estado=document.getElementById('estado'),son=document.getElementById('son');
document.getElementById('nombre').textContent=L.n;
let pc=null,viendo=false;
// sonido: los navegadores piden un toque antes de dejar sonar
son.onclick=()=>{v.muted=!v.muted;if(!v.muted)v.play().catch(()=>{});son.textContent=v.muted?'🔇 Activar sonido':'🔊 Silenciar'};
function cerrar(){if(pc){try{pc.close()}catch(_){}pc=null}}
function reintentar(msg){viendo=false;cerrar();aviso.hidden=false;son.hidden=true;estado.textContent=msg;setTimeout(conectar,5000)}
function conectar(){
  cerrar();
  pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.cloudflare.com:3478'}],bundlePolicy:'max-bundle'});
  const ms=new MediaStream(),este=pc;
  pc.addTransceiver('video',{direction:'recvonly'});pc.addTransceiver('audio',{direction:'recvonly'});
  pc.ontrack=e=>{ms.addTrack(e.track);v.srcObject=ms;v.play().catch(()=>{})};
  pc.onconnectionstatechange=()=>{if(pc!==este)return;if(['failed','disconnected','closed'].includes(este.connectionState)&&viendo)reintentar('Se cortó la señal. Reconectando…')};
  const plazo=setTimeout(()=>{if(!viendo&&pc===este)reintentar('Sin transmisión en este momento. Se conecta sola apenas empiece.')},12000);
  pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>new Promise(r=>{if(este.iceGatheringState==='complete')return r();
    const t=setTimeout(r,1500);este.addEventListener('icegatheringstatechange',()=>{if(este.iceGatheringState==='complete'){clearTimeout(t);r()}})}))
    .then(()=>fetch(L.whep,{method:'POST',headers:{'content-type':'application/sdp'},body:este.localDescription.sdp}))
    .then(r=>{if(!r.ok)throw new Error('WHEP '+r.status);return r.text()})
    .then(sdp=>este.setRemoteDescription({type:'answer',sdp}))
    .catch(()=>{clearTimeout(plazo);if(pc===este)reintentar('Sin transmisión en este momento. Se conecta sola apenas empiece.')});
}
v.addEventListener('playing',()=>{viendo=true;aviso.hidden=true;son.hidden=false});
conectar();
</script>
</body>
</html>
